<title>DGT — Digital Governance Transmigration</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Leaflet powers the real-world basemap in the Geospasial module. Loaded from a CDN, so it
     only works where external requests are allowed (GitHub Pages) — the schematic map and
     province grid remain fully self-contained fallbacks for CSP-restricted previews. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Design-system typefaces (Plus Jakarta Sans / JetBrains Mono), synced from the DGT Transmigrasi
     2026 Figma file. Same CDN-dependency exception as Leaflet above: falls back to the system stack
     below wherever external requests are blocked. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Neutrals — "Abu" ramp, DGT Transmigrasi 2026 design system (Figma) */
    --bg: #f7f9fa;
    --bg-2: #eff3f5;
    --panel: #ffffff;
    --panel-2: #eff3f5;
    --panel-3: #eef2f6;
    --border: #dfe6ea;
    --border-soft: rgba(15, 25, 34, 0.06);
    --text: #0f1922;
    --text-dim: #5b6b76;
    --text-faint: #97a7b2;
    /* Brand — "Biru Nusantara" (primary navy) is the app's one accent color, used throughout */
    --primary: #163b54;
    --primary-soft: rgba(22, 59, 84, 0.12);
    --primary-line: rgba(22, 59, 84, 0.35);
    --sidebar: #081826;
    /* "Teal Laut" — secondary/info accent, chart series 2 */
    --series-2: #33809c;
    --series-2-soft: rgba(51, 128, 156, 0.14);
    /* "Hijau" — functional, success only */
    --good: #1f5d47;
    --good-soft: rgba(31, 93, 71, 0.14);
    /* "Emas Tanah" — functional, warning only */
    --warn: #c09546;
    --warn-soft: rgba(192, 149, 70, 0.14);
    /* "Merah" — functional, destructive only */
    --critical: #ce1126;
    --critical-soft: rgba(206, 17, 38, 0.12);
    --radius: 10px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(22, 59, 84, 0.05), transparent 60%),
      radial-gradient(1000px 700px at 100% 0%, rgba(51, 128, 156, 0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .mono { font-family: "JetBrains Mono", "Cascadia Code", "Consolas", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }

  a { color: inherit; }
  button { font-family: inherit; }

  ::selection { background: var(--primary-soft); }

  :focus-visible { outline: 2px dashed var(--primary); outline-offset: 2px; }

  /* ---------- topbar ---------- */
  .topbar {
    height: 56px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0 1.1rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(15,25,34,0.02), transparent);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }

  .brand-mark {
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    background: linear-gradient(155deg, var(--primary), var(--sidebar));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.72rem; color: #f4f8fa;
    flex: 0 0 auto;
  }

  .brand-text { line-height: 1.15; min-width: 0; }
  .brand-text .name {
    font-weight: 700; font-size: 0.86rem; letter-spacing: 0.06em;
    text-transform: uppercase; white-space: nowrap;
  }
  .brand-text .sub {
    font-size: 0.72rem; color: var(--text-dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  .topbar-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 1.1rem;
    color: var(--text-dim);
  }

  .live-pill {
    display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--good);
    background: var(--good-soft);
    border: 1px solid rgba(31,93,71,0.3);
    padding: 0.3rem 0.6rem; border-radius: 999px;
  }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--good);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(31,93,71,0.5); }
    50% { opacity: 0.55; box-shadow: 0 0 0 4px rgba(31,93,71,0); }
  }

  .clock { font-size: 0.78rem; }

  /* ---------- shell ---------- */
  .shell { display: flex; flex: 1 1 auto; min-height: 0; }

  .rail {
    width: 232px; flex: 0 0 auto;
    border-right: 1px solid var(--border);
    padding: 0.9rem 0.6rem;
    overflow-y: auto;
    background: linear-gradient(180deg, rgba(15,25,34,0.015), transparent);
    transition: width 0.15s ease, padding 0.15s ease;
  }
  /* fully collapsed, not icon-only — width:0 hides it completely so .main gets the space back.
     The toggle button lives in the topbar (not inside .rail) specifically so it stays reachable
     once the rail itself has zero width. */
  .rail.collapsed { width: 0; padding: 0; border-right: none; overflow: hidden; }

  .rail-group-label {
    font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-faint); padding: 0.4rem 0.6rem 0.5rem;
  }

  .rail-item {
    display: flex; align-items: center; gap: 0.65rem;
    width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: var(--text-dim); padding: 0.55rem 0.6rem; margin-bottom: 0.15rem;
    cursor: pointer; font-size: 0.82rem;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }

  .rail-item:hover { background: var(--panel-2); color: var(--text); }

  .rail-item.active {
    background: var(--primary-soft);
    border-color: var(--primary-line);
    color: var(--text);
  }

  .rail-icon {
    width: 18px; height: 18px; flex: 0 0 auto;
    color: var(--text-faint);
  }
  .rail-icon svg { display: block; width: 100%; height: 100%; }
  .rail-item.active .rail-icon { color: var(--primary); }

  .rail-item .rail-label { line-height: 1.25; }
  .rail-item .rail-sub { display: block; font-size: 0.68rem; color: var(--text-faint); }

  .main {
    flex: 1 1 auto; min-width: 0; overflow-y: auto;
    padding: 1.3rem 1.5rem 3rem;
  }

  .page-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; margin-bottom: 1.1rem; flex-wrap: wrap;
  }

  .page-head h1 {
    margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .page-head .desc { margin: 0.2rem 0 0; color: var(--text-dim); font-size: 0.82rem; max-width: 62ch; }

  .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  select, .btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.42rem 0.7rem; font-size: 0.78rem; cursor: pointer;
  }
  select:hover, .btn:hover { border-color: var(--primary-line); }
  .btn.primary { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary); }
  .btn.small { padding: 0.3rem 0.55rem; font-size: 0.7rem; }
  .btn[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--border); }

  /* ---------- kpi grid ---------- */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.7rem; margin-bottom: 1.1rem;
  }

  .kpi-tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.85rem 0.95rem;
  }
  .kpi-tile .k-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi-tile .k-value { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; }
  .kpi-tile .k-delta { font-size: 0.72rem; margin-top: 0.2rem; }
  .k-delta.up { color: var(--good); }
  .k-delta.down { color: var(--critical); }
  .k-delta.flat { color: var(--text-faint); }

  /* ---------- panel/grid layout ---------- */
  .grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 0.9rem; align-items: start; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; align-items: start; }
  @media (max-width: 980px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1rem 1.05rem; margin-bottom: 0.9rem;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.75rem; gap: 0.6rem; flex-wrap: wrap;
  }
  .panel-header h2 { margin: 0; font-size: 0.92rem; font-weight: 700; }
  .panel-header .hint { font-size: 0.7rem; color: var(--text-faint); }

  /* ---------- badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.68rem; padding: 0.16rem 0.5rem; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    white-space: nowrap;
  }
  .badge.mandiri { background: var(--good-soft); color: var(--good); }
  .badge.berkembang { background: var(--series-2-soft); color: var(--series-2); }
  .badge.tumbuh { background: var(--warn-soft); color: var(--warn); }
  .badge.rintisan { background: var(--critical-soft); color: var(--critical); }
  .badge.dot::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .sev { font-size: 0.66rem; padding: 0.14rem 0.45rem; border-radius: 5px; font-weight: 700; letter-spacing: 0.04em; }
  .sev.high { background: var(--critical-soft); color: var(--critical); }
  .sev.med { background: var(--warn-soft); color: var(--warn); }
  .sev.low { background: var(--series-2-soft); color: var(--series-2); }

  /* ---------- table ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-faint); font-weight: 600; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border);
    white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: var(--text-dim); }
  th .arrow { opacity: 0.5; font-size: 0.6rem; margin-left: 0.2rem; }
  td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tbody tr { cursor: pointer; transition: background 0.1s ease; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr.selected { background: var(--primary-soft); }

  .bar-cell { display: flex; align-items: center; gap: 0.5rem; }
  .bar-track { width: 70px; height: 5px; border-radius: 3px; background: var(--panel-3); overflow: hidden; flex: 0 0 auto; }
  .bar-fill { height: 100%; border-radius: 3px; background: var(--primary); }

  /* ---------- drawer ---------- */
  .drawer {
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 0.9rem 1rem; font-size: 0.8rem; color: var(--text-dim);
  }
  .drawer h3 { margin: 0 0 0.4rem; color: var(--text); font-size: 0.88rem; }
  .drawer .row { display: flex; justify-content: space-between; padding: 0.28rem 0; border-bottom: 1px dashed var(--border-soft); }
  .drawer .row span:last-child { color: var(--text); }
  .drawer .empty { color: var(--text-faint); font-style: italic; }

  /* ---------- map / geospatial ---------- */
  .map-legend { display: flex; gap: 1rem; font-size: 0.72rem; color: var(--text-dim); flex-wrap: wrap; }
  .map-legend .sw { display: inline-flex; align-items: center; gap: 0.35rem; }
  .map-legend .chip { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .province-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 0.55rem;
  }
  .prov-tile {
    position: relative; border-radius: 8px; padding: 0.55rem 0.6rem;
    background: var(--panel-2); border: 1px solid var(--border);
    cursor: pointer; overflow: hidden; min-height: 68px;
  }
  .prov-tile:hover { border-color: var(--primary-line); }
  .prov-tile .p-name { font-size: 0.7rem; font-weight: 600; }
  .prov-tile .p-count { font-size: 0.68rem; color: var(--text-dim); margin-top: 0.15rem; }
  .prov-tile .layer { position: absolute; inset: auto 0 0 0; height: 5px; }
  .prov-tile .layer.hpl { background: var(--series-2); bottom: 5px; }
  .prov-tile .layer.shm { background: var(--primary); bottom: 0; }
  .prov-tile.selected { outline: 2px solid var(--primary); }

  /* ---------- basemap (Leaflet) view ---------- */
  .basemap-wrap { border-radius: 8px; overflow: hidden; border: 1px solid var(--border-soft); }
  .basemap-el { width: 100%; height: 360px; background: var(--panel-2); }
  .basemap-fallback {
    width: 100%; height: 220px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 1rem; color: var(--text-faint); font-size: 0.78rem;
    background: var(--panel-2);
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel-2); color: var(--text); }
  .leaflet-popup-content { font-size: 0.78rem; }

  /* static snapshot fallback (baked-in OSM image, used when live tiles can't load) */
  .basemap-static { position: relative; }
  .basemap-static img { display: block; width: 100%; height: auto; }
  .basemap-static .bm-pin {
    position: absolute; transform: translate(-50%, -50%); border-radius: 50%;
    border: 1.5px solid var(--bg); cursor: pointer; opacity: 0.92;
  }
  .basemap-static .bm-pin:hover, .basemap-static .bm-pin.selected { outline: 2px solid var(--primary); }
  .basemap-static .bm-attrib {
    position: absolute; right: 4px; bottom: 3px; font-size: 0.6rem; color: rgba(255,255,255,0.85);
    background: rgba(10,15,28,0.55); padding: 0.05rem 0.4rem; border-radius: 4px;
  }
  .basemap-static .bm-attrib a { color: inherit; }
  .basemap-static-note { font-size: 0.68rem; color: var(--text-faint); margin-top: 0.5rem; text-align: center; }

  /* ---------- geospasial: immersive full-bleed map with a collapsible dark HUD sidebar ---------- */
  .main.no-pad { padding: 0; }
  .geo-immersive { position: relative; height: 100%; overflow: hidden; background: #0c1620; }
  /* z-index establishes its own stacking context so Leaflet's internal panes (popup/marker panes
     go up to z-index 700) stay contained here and never escape above the HUD sidebar below */
  .geo-map-full { position: absolute; inset: 0; z-index: 1; }
  .geo-map-full .basemap-wrap { height: 100%; border-radius: 0; border: none; }
  .geo-map-full .basemap-el { height: 100%; }
  .geo-map-full .basemap-static { height: 100%; }
  .geo-map-full .basemap-static img { width: 100%; height: 100%; object-fit: cover; }
  .geo-map-full .basemap-static-note {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); margin: 0;
    background: rgba(10,15,28,0.6); color: #fff; padding: 0.2rem 0.6rem; border-radius: 999px;
  }
  .geo-grid-pad { height: 100%; overflow-y: auto; box-sizing: border-box; padding: 1.3rem 1.5rem 3rem; background: var(--bg); }

  .hud {
    background: rgba(8, 20, 30, 0.74); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; color: #eaf2f6;
    box-shadow: 0 12px 28px rgba(0,0,0,0.35);
  }

  /* national executive-summary strip — sits above both sidebars, which is why they're offset to
     top:80px (not 16px) below. Recompute that offset if this strip's height ever changes. */
  .hud-kpi-strip {
    position: absolute; z-index: 22; top: 16px; left: 332px; right: 332px;
    display: flex; gap: 0.3rem; padding: 0.55rem 0.7rem; flex-wrap: wrap; align-items: center; justify-content: center;
  }
  .hud-kpi { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; padding: 0 0.7rem; min-width: 84px; }
  .hud-kpi span {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: rgba(234,242,246,0.55); white-space: nowrap;
  }
  .hud-kpi b { font-size: 1rem; font-weight: 700; color: #eaf2f6; }
  .hud-kpi.warn b { color: #ff9d9d; }

  .hud-sidebar {
    position: absolute; z-index: 20; top: 80px; left: 16px; bottom: 16px; width: 300px;
    display: flex; flex-direction: column; overflow: hidden;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .hud-sidebar.collapsed-panel { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }

  .hud-sidebar-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem;
    padding: 0.9rem 1rem 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.08); flex: 0 0 auto;
  }
  .hud-title { font-size: 0.86rem; font-weight: 700; }
  .hud-sub { font-size: 0.68rem; color: rgba(234,242,246,0.55); margin-top: 0.15rem; }
  .hud-collapse, .hud-edge-tab {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #eaf2f6;
    border-radius: 7px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: 0 0 auto;
  }
  .hud-collapse:hover, .hud-edge-tab:hover { background: rgba(255,255,255,0.16); }
  .hud-collapse svg, .hud-edge-tab svg { width: 14px; height: 14px; }

  .hud-edge-tab { position: absolute; z-index: 20; top: 80px; left: 16px; }

  .hud-status { padding: 0.7rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); flex: 0 0 auto; }
  .hud-status-row {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    font-size: 0.72rem; color: rgba(234,242,246,0.68); padding: 0.15rem 0;
  }
  .hud-status-row b { color: #eaf2f6; font-weight: 600; }
  .hud-status-row .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3ddc84;
    margin-right: 0.35rem; box-shadow: 0 0 0 3px rgba(61,220,132,0.18);
  }

  .hud-section { border-bottom: 1px solid rgba(255,255,255,0.08); flex: 0 0 auto; }
  .hud-section.grow { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .hud-section.collapsed .hud-section-body { display: none; }
  .hud-section.collapsed.grow { flex: 0 0 auto; }
  .hud-section-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; color: rgba(234,242,246,0.85); cursor: pointer;
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.75rem 1rem; flex: 0 0 auto;
  }
  .hud-section-head svg { width: 13px; height: 13px; transition: transform 0.15s ease; }
  .hud-section.collapsed .hud-section-head svg { transform: rotate(-90deg); }
  .hud-section.grow .hud-section-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .hud-section-body { padding: 0 1rem 0.9rem; }

  .hud-radio-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .hud-radio {
    display: flex; align-items: center; gap: 0.55rem; width: 100%; text-align: left;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    color: rgba(234,242,246,0.75); padding: 0.5rem 0.65rem; cursor: pointer; font-size: 0.76rem;
  }
  .hud-radio svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .hud-radio:hover { background: rgba(255,255,255,0.08); }
  .hud-radio.active { background: rgba(51,128,156,0.28); border-color: rgba(51,128,156,0.55); color: #fff; }

  .hud-kawasan-list { display: flex; flex-direction: column; gap: 0.25rem; }
  .hud-kawasan-item {
    display: flex; align-items: center; gap: 0.55rem; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: rgba(234,242,246,0.8); padding: 0.45rem 0.55rem; cursor: pointer; font-size: 0.76rem;
  }
  .hud-kawasan-item:hover { background: rgba(255,255,255,0.06); }
  .hud-kawasan-item.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.16); }
  .hud-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .hud-kw-text { display: flex; flex-direction: column; min-width: 0; }
  .hud-kw-text .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-kw-text .pv { font-size: 0.66rem; color: rgba(234,242,246,0.5); }

  function mercatorPx(lon, lat, zoom) {
    var n = Math.pow(2, zoom);
    var x = (lon + 180) / 360 * n * 256;
    var latRad = lat * Math.PI / 180;
    var y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n * 256;
    return [x, y];
  }

  var _bmBotRight = mercatorPx(BASEMAP_BBOX.lonMax, BASEMAP_BBOX.latMin, BASEMAP_BBOX.zoom);
  function basemapPct(lon, lat) {
    var p = mercatorPx(lon, lat, BASEMAP_BBOX.zoom);
    return {
      xPct: (p[0] - _bmTopLeft[0]) / (_bmBotRight[0] - _bmTopLeft[0]) * 100,

  }

      return s / 4294967296;
    };
  }

  function barChart(data, opts) {
    opts = opts || {};
    var w = opts.width || 480, h = opts.height || 200;
    var pad = { t: 10, r: 10, b: 34, l: 10 };
    var innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
    var max = opts.max || Math.max.apply(null, data.map(function (d) { return d.value; })) * 1.15;
    var bw = innerW / data.length;
    var svg = el("svg", { viewBox: "0 0 " + w + " " + h, width: "100%", height: h, role: "img", "aria-label": opts.ariaLabel || "bar chart" });

    data.forEach(function (d, i) {
      var barH = (d.value / max) * innerH;
      var x = pad.l + i * bw + bw * 0.18;
      var y = pad.t + innerH - barH;
      var bwActual = bw * 0.64;
      var rect = el("rect", {
        x: x, y: y, width: bwActual, height: Math.max(barH, 1.5), rx: 3,
        fill: d.color || opts.color || "var(--primary)", opacity: 0.92
      }, svg);
      var title = el("title", {}, rect);
      title.textContent = d.label + ": " + d.value + (opts.suffix || "");

      el("text", {
        x: x + bwActual / 2, y: h - pad.b + 15, "text-anchor": "middle",
        fill: "var(--text-faint)", "font-size": "9"
      }, svg).textContent = d.label.length > 10 ? d.label.slice(0, 9) + "…" : d.label;

      el("text", {
        x: x + bwActual / 2, y: y - 5, "text-anchor": "middle",
        fill: "var(--text-dim)", "font-size": "9.5", "font-family": "'JetBrains Mono', monospace"
      }, svg).textContent = d.value + (opts.suffix || "");
    });
    return svg;
  }

  function lineChartDual(labels, s1, s2, opts) {
    opts = opts || {};
    var w = opts.width || 560, h = opts.height || 210;
    var pad = { t: 14, r: 14, b: 26, l: 14 };
    var innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
    var all = s1.concat(s2).filter(function (v) { return v !== null && v !== undefined; });
    var max = Math.max.apply(null, all) * 1.1;
    var stepX = innerW / (labels.length - 1);

    function pathFor(series) {
      var d = "";
      series.forEach(function (v, i) {
        if (v === null || v === undefined) return;
        var x = pad.l + i * stepX;
        var y = pad.t + innerH - (v / max) * innerH;
        d += (d === "" ? "M " : " L ") + x.toFixed(1) + " " + y.toFixed(1);
      });
      return d;
    }

    var svg = el("svg", { viewBox: "0 0 " + w + " " + h, width: "100%", height: h, role: "img", "aria-label": "s-curve chart" });

    // grid
    for (var g = 0; g <= 4; g++) {
      var gy = pad.t + (innerH / 4) * g;
      el("line", { x1: pad.l, y1: gy, x2: w - pad.r, y2: gy, stroke: "var(--border-soft)", "stroke-width": 1 }, svg);
    }

    el("path", { d: pathFor(s1), fill: "none", stroke: "var(--series-2)", "stroke-width": 2, "stroke-dasharray": "4 3" }, svg);
    el("path", { d: pathFor(s2), fill: "none", stroke: "var(--primary)", "stroke-width": 2.4 }, svg);

    labels.forEach(function (lb, i) {
      if (i % 2 !== 0 && labels.length > 8) return;
      el("text", {
        x: pad.l + i * stepX, y: h - 6, "text-anchor": "middle",
        fill: "var(--text-faint)", "font-size": "8.5"
      }, svg).textContent = lb;
    });

    s2.forEach(function (v, i) {
      if (v === null || v === undefined) return;
      var x = pad.l + i * stepX, y = pad.t + innerH - (v / max) * innerH;
      el("circle", { cx: x, cy: y, r: 2.6, fill: "var(--primary)" }, svg);
    });

    return svg;
  }

  function donut(segments, opts) {
    opts = opts || {};
    var size = opts.size || 150, stroke = opts.stroke || 16;
    var r = (size - stroke) / 2, cx = size / 2, cy = size / 2;
    var total = segments.reduce(function (s, d) { return s + d.value; }, 0) || 1;
    var svg = el("svg", { viewBox: "0 0 " + size + " " + size, width: size, height: size, role: "img", "aria-label": "donut chart" });
    var circumf = 2 * Math.PI * r;
    var offset = 0;
    segments.forEach(function (seg) {
      var frac = seg.value / total;
      var len = frac * circumf;
      var circle = el("circle", {
        cx: cx, cy: cy, r: r, fill: "none", stroke: seg.color, "stroke-width": stroke,
        "stroke-dasharray": len + " " + (circumf - len),
        "stroke-dashoffset": (-offset).toFixed(2),
        transform: "rotate(-90 " + cx + " " + cy + ")"
      }, svg);
      el("title", {}, circle).textContent = seg.label + ": " + seg.value;
      offset += len;
    });
    if (opts.centerLabel) {
      el("text", { x: cx, y: cy - 2, "text-anchor": "middle", fill: "var(--text)", "font-size": "18", "font-weight": "700" }, svg).textContent = opts.centerLabel;
      el("text", { x: cx, y: cy + 14, "text-anchor": "middle", fill: "var(--text-faint)", "font-size": "8.5" }, svg).textContent = opts.centerSub || "";
    }
    return svg;
  }

  function gauge(value, max, opts) {
    opts = opts || {};
    var w = opts.width || 180, h = opts.height || 100;
    var cx = w / 2, cy = h - 8, r = w / 2 - 10;
    var frac = Math.max(0, Math.min(1, value / max));
    var angle = Math.PI * frac;
    var x2 = cx - r * Math.cos(angle), y2 = cy - r * Math.sin(angle);
    var svg = el("svg", { viewBox: "0 0 " + w + " " + h, width: "100%", height: h });
    el("path", { d: "M " + (cx - r) + " " + cy + " A " + r + " " + r + " 0 0 1 " + (cx + r) + " " + cy, fill: "none", stroke: "var(--panel-3)", "stroke-width": 10, "stroke-linecap": "round" }, svg);
    el("path", { d: "M " + (cx - r) + " " + cy + " A " + r + " " + r + " 0 0 1 " + x2 + " " + y2, fill: "none", stroke: opts.color || "var(--primary)", "stroke-width": 10, "stroke-linecap": "round" }, svg);
    el("text", { x: cx, y: cy - 10, "text-anchor": "middle", fill: "var(--text)", "font-size": "20", "font-weight": "700" }, svg).textContent = value;
    el("text", { x: cx, y: cy + 6, "text-anchor": "middle", fill: "var(--text-faint)", "font-size": "8.5" }, svg).textContent = opts.label || "";

  }

          '</tr>';
      }).join("");
      qsa(wrap, "tbody#profilTbody tr").forEach(function (tr) {
        tr.addEventListener("click", function () { state.selectedKawasan = tr.dataset.id; renderProfilTable(); renderDrawer(); });
      });
    }

    function renderDrawer() {
      var k = kawasan.find(function (x) { return x.id === state.selectedKawasan; });
      var d = qs(wrap, "#profilDrawer");
      if (!k) { d.innerHTML = '<p class="empty">Pilih kawasan pada tabel.</p>'; return; }
      d.innerHTML = '<h3>' + k.nama + '</h3>' +
        row("Provinsi", k.provinsi) + row("Tipe", k.tipe) +
        row("Tahap", '<span class="badge ' + stageClass[k.tahap] + '">' + k.tahap + '</span>') +
        row("Populasi", k.populasi.toLocaleString("id-ID") + " jiwa") +
        row("Indeks 5T", k.indeks5t + " / 100") +
        row("HPL", k.hplHa.toLocaleString("id-ID") + " Ha") +
        row("SHM Terbit", k.shmHa.toLocaleString("id-ID") + " Ha") +
        row("Realisasi Anggaran", k.anggaranPct + "%") +
        row("Tingkat Risiko", '<span class="sev ' + k.risiko + '">' + ({ high: "Tinggi", med: "Sedang", low: "Rendah" })[k.risiko] + '</span>');
    }
    function row(label, val) { return '<div class="row"><span>' + label + '</span><span>' + val + '</span></div>'; }

    var counts = {};
    STAGES.forEach(function (s) { counts[s] = 0; });
    kawasan.forEach(function (k) { counts[k.tahap]++; });
    var colors = { "Rintisan": "var(--critical)", "Tumbuh": "var(--warn)", "Berkembang": "var(--series-2)", "Mandiri": "var(--good)" };
    var segs = STAGES.map(function (s) { return { label: s, value: counts[s], color: colors[s] }; });
    qs(wrap, "#stageDonut").appendChild(donut(segs, { centerLabel: kawasan.length, centerSub: "kawasan" }));
    qs(wrap, "#stageLegend").innerHTML = STAGES.map(function (s) {
      return '<span class="sw"><span class="chip" style="background:' + colors[s] + '"></span>' + s + ' (' + counts[s] + ')</span>';
    }).join("");

    renderProfilTable();
    renderDrawer();
    return wrap;
  }

  /* ---------- render: 02 Geospasial ---------- */
  function miniIconSvg(kind) {
    var paths = {
      dasar: ICON_PATHS.geospasial,
      grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + paths[kind] + '</svg>';
  }

  function renderGeospasial() {
    var leafletMarkers = {};

    function hudSection(key, title, bodyHtml, grow) {
      return '<div class="hud-section' + (grow ? " grow" : "") + '" data-section="' + key + '">' +
        '<button class="hud-section-head" data-toggle="' + key + '"><span>' + title + '</span>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
        '</button>' +
        '<div class="hud-section-body">' + bodyHtml + '</div>' +
      '</div>';
    }

    var chevron = function (d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>'; };
    var CHEVRON_DOWN = chevron("m6 9 6 6 6-6"), CHEVRON_LEFT = chevron("m15 18-6-6 6-6"), CHEVRON_RIGHT = chevron("m9 18 6-6-6-6");
    var CHAT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';

    /* National executive-summary strip — one metric pulled from each of the other 7 modules, so an
       executive can read the whole picture here without navigating away (per request: Geospasial as
       the one screen that "sums up" everything for decision support). */
    var mandiriCount = kawasan.filter(function (k) { return k.tahap === "Mandiri"; }).length;
    var totalPop = kawasan.reduce(function (s, k) { return s + k.populasi; }, 0);
    var avgAnggaran = Math.round(kawasan.reduce(function (s, k) { return s + k.anggaranPct; }, 0) / kawasan.length);
    var avgInfra = Math.round(infraKategori.reduce(function (s, c) { return s + c.capaian; }, 0) / infraKategori.length);
    var topKomoditas = komoditas.slice().sort(function (a, b) { return b.nilai - a.nilai; })[0];
    var activeAlertsInit = ewsAlerts.filter(function (a) { return !a.ack; }).length;
    var kpiStripHtml =
      '<div class="hud hud-kpi-strip" id="geoKpiStrip">' +
        '<div class="hud-kpi"><span>Kawasan Mandiri</span><b>' + mandiriCount + ' / ' + kawasan.length + '</b></div>' +
        '<div class="hud-kpi"><span>Populasi Transmigran</span><b>' + totalPop.toLocaleString("id-ID") + '</b></div>' +
        '<div class="hud-kpi"><span>Indeks 5T Nasional</span><b>' + nationalKPI.avgIndeks + ' / 100</b></div>' +
        '<div class="hud-kpi"><span>Realisasi Anggaran</span><b>' + avgAnggaran + '%</b></div>' +
        '<div class="hud-kpi"><span>Capaian Infrastruktur</span><b>' + avgInfra + '%</b></div>' +
        '<div class="hud-kpi"><span>Komoditas Unggulan</span><b>' + topKomoditas.nama + '</b></div>' +
        '<div class="hud-kpi' + (activeAlertsInit > 0 ? " warn" : "") + '"><span>Peringatan Aktif</span><b id="geoKpiAlert">' + activeAlertsInit + '</b></div>' +
      '</div>';

    var wrap = h(
      '<div class="geo-immersive">' +
        '<div class="geo-map-full" id="sebaranBody"></div>' +
        kpiStripHtml +

        '<button class="hud-edge-tab" id="geoSidebarReveal" hidden aria-label="Tampilkan panel">' + CHEVRON_RIGHT + '</button>' +
        '<aside class="hud hud-sidebar" id="geoSidebar">' +
          '<div class="hud-sidebar-head">' +
            '<div><div class="hud-title">Geospasial Kawasan</div><div class="hud-sub">HPL · SHM · Trans Tuntas</div></div>' +
            '<button class="hud-collapse" id="geoSidebarToggle" aria-label="Ciutkan panel">' + CHEVRON_LEFT + '</button>' +
          '</div>' +
          '<div class="hud-status">' +
            '<div class="hud-status-row"><span><span class="dot"></span>Sistem</span><b>Online</b></div>' +
            '<div class="hud-status-row"><span>Kawasan terpantau</span><b>' + kawasan.length + '</b></div>' +
            '<div class="hud-status-row"><span>Peringatan aktif</span><b id="geoAlertCount">' + ewsAlerts.filter(function (a) { return !a.ack; }).length + '</b></div>' +
          '</div>' +
          hudSection("basemap", "Peta Dasar",
            '<div class="hud-radio-list" id="styleSwitch">' +
              '<button class="hud-radio" data-view="dasar">' + miniIconSvg("dasar") + '<span>Peta OSM</span></button>' +
              '<button class="hud-radio" data-view="grid">' + miniIconSvg("grid") + '<span>Grid Provinsi</span></button>' +
            '</div>'
          ) +
          hudSection("ews", "Peringatan Dini (EWS)", '<div class="hud-ews-list" id="ewsHudList"></div>') +
          hudSection("list", "Daftar Kawasan", '<div class="hud-kawasan-list" id="kawasanList"></div>', true) +
        '</aside>' +

        '<button class="hud-edge-tab hud-edge-tab-right" id="geoDetailReveal" hidden aria-label="Tampilkan detail kawasan">' + CHEVRON_LEFT + '</button>' +
        '<aside class="hud hud-sidebar-right" id="geoDetailPanel">' +
          '<div class="hud-sidebar-head">' +
            '<div><div class="hud-title">Detail Kawasan</div><div class="hud-sub">populasi · indeks 5T · legalitas</div></div>' +
            '<button class="hud-collapse" id="geoDetailToggle" aria-label="Ciutkan panel">' + CHEVRON_RIGHT + '</button>' +
          '</div>' +
          '<div class="hud-section-body" id="geoDetail" style="padding-top:0.9rem"></div>' +
        '</aside>' +

        '<button class="hud-chat-fab" id="geoChatFab" aria-label="Buka asisten AI">' + CHAT_ICON + '</button>' +
        '<div class="hud hud-chat-panel" id="geoChatPanel" hidden>' +
          '<div class="hud-sidebar-head">' +
            '<div><div class="hud-title">Asisten AI</div><div class="hud-sub">tanya cepat seputar data kawasan</div></div>' +
            '<button class="hud-collapse" id="geoChatClose" aria-label="Tutup">✕</button>' +
          '</div>' +
          '<div class="chat-log" id="geoChatLog"></div>' +
          '<div class="chat-input-row"><input id="geoChatInput" type="text" placeholder="Contoh: kawasan mana yang paling berisiko?" />' +
          '<button class="btn primary" id="geoChatSend">Kirim</button></div>' +
        '</div>' +
      '</div>'
    );

    qsa(wrap, ".hud-section-head").forEach(function (btn) {
      btn.addEventListener("click", function () { btn.closest(".hud-section").classList.toggle("collapsed"); });
    });
    qs(wrap, "#geoSidebarToggle").addEventListener("click", function () {
      qs(wrap, "#geoSidebar").classList.add("collapsed-panel");
      qs(wrap, "#geoSidebarReveal").hidden = false;
    });
    qs(wrap, "#geoSidebarReveal").addEventListener("click", function () {
      qs(wrap, "#geoSidebar").classList.remove("collapsed-panel");
      qs(wrap, "#geoSidebarReveal").hidden = true;
    });
    qs(wrap, "#geoDetailToggle").addEventListener("click", function () {
      qs(wrap, "#geoDetailPanel").classList.add("collapsed-panel");
      qs(wrap, "#geoDetailReveal").hidden = false;
    });
    qs(wrap, "#geoDetailReveal").addEventListener("click", function () {
      qs(wrap, "#geoDetailPanel").classList.remove("collapsed-panel");
      qs(wrap, "#geoDetailReveal").hidden = true;
    });

    /* ---- floating AI chat widget, reuses the same aiAnswer() keyword-matching mock as Intelijen ---- */
    var chatLog = [{ role: "ai", text: "Selamat datang. Tanya cepat seputar kawasan, risiko, atau anggaran." }];
    function renderChatLog() {
      var el = qs(wrap, "#geoChatLog");
      el.innerHTML = chatLog.map(function (m) { return '<div class="msg ' + m.role + '">' + m.text + '</div>'; }).join("");
      el.scrollTop = el.scrollHeight;
    }
    function sendChat(text) {
      if (!text.trim()) return;
      chatLog.push({ role: "user", text: text });
      chatLog.push({ role: "ai", text: aiAnswer(text) });
      renderChatLog();
    }
    qs(wrap, "#geoChatFab").addEventListener("click", function () {
      qs(wrap, "#geoChatPanel").hidden = false;
      qs(wrap, "#geoChatInput").focus();
    });
    qs(wrap, "#geoChatClose").addEventListener("click", function () { qs(wrap, "#geoChatPanel").hidden = true; });
    qs(wrap, "#geoChatSend").addEventListener("click", function () {
      var inp = qs(wrap, "#geoChatInput"); sendChat(inp.value); inp.value = "";
    });
    qs(wrap, "#geoChatInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { sendChat(this.value); this.value = ""; }
    });
    renderChatLog();

    /* ---- "Daftar Kawasan" list — click selects a kawasan, kept in sync with map pin / province tile clicks ---- */
    /* ---- "Peringatan Dini (EWS)" — same ewsAlerts data + ack toggle as the Analitik module's list ---- */
    function renderEwsHud() {
      var listEl = qs(wrap, "#ewsHudList");
      var sevLabel = { high: "Tinggi", med: "Sedang", low: "Rendah" };
      listEl.innerHTML = ewsAlerts.length
        ? ewsAlerts.map(function (a) {
            return '<div class="ews-item' + (a.ack ? " ack" : "") + '">' +
              '<span class="sev ' + a.sev + '">' + sevLabel[a.sev] + '</span>' +
              '<div class="ews-body"><div class="t">' + a.title + '</div><div class="d">' + a.detail + '</div>' +
              '<div class="ews-meta">' + a.when + '</div></div>' +
              '<button class="btn small" data-ack="' + a.id + '">' + (a.ack ? "Dibuka" : "Tandai") + '</button>' +
            '</div>';
          }).join("")
        : '<p class="hud-empty">Tidak ada peringatan aktif.</p>';
      qsa(listEl, "[data-ack]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var a = ewsAlerts.find(function (x) { return x.id === btn.dataset.ack; });
          a.ack = !a.ack;
          renderEwsHud();
          var active = ewsAlerts.filter(function (x) { return !x.ack; }).length;
          qs(wrap, "#geoAlertCount").textContent = active;
          qs(wrap, "#geoKpiAlert").textContent = active;
          qs(wrap, "#geoKpiAlert").parentElement.classList.toggle("warn", active > 0);
        });
      });
    }

    function renderKawasanList() {
      var listEl = qs(wrap, "#kawasanList");
      listEl.innerHTML = kawasan.map(function (k) {
        return '<button class="hud-kawasan-item' + (state.selectedKawasan === k.id ? " active" : "") + '" data-id="' + k.id + '">' +
          '<span class="hud-dot" style="background:' + STAGE_COLOR_HEX[k.tahap] + '"></span>' +
          '<span class="hud-kw-text"><span class="nm">' + k.nama + '</span><span class="pv">' + k.provinsi + '</span></span>' +
        '</button>';
      }).join("");
      qsa(listEl, ".hud-kawasan-item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          selectKawasan(kawasan.find(function (x) { return x.id === btn.dataset.id; }));
        });
      });
    }

    /* ---- "Detail Kawasan" panel — populasi, indeks 5T, legalitas HPL/SHM, risiko, mini photo ---- */
    function renderDetail() {
      var el = qs(wrap, "#geoDetail");
      var k = kawasan.find(function (x) { return x.id === state.selectedKawasan; });
      if (!k) { el.innerHTML = '<p class="hud-empty">Pilih kawasan pada daftar atau peta.</p>'; return; }
      var legalPct = Math.round(k.shmHa / k.hplHa * 100);
      var riskLabel = { low: "Rendah", med: "Sedang", high: "Tinggi" }[k.risiko];
      var media = k.foto
        ? '<img src="' + k.foto + '" alt="Foto ' + k.nama + '" loading="lazy" />'
        : cityIllustration(k, 260, 110);
      el.innerHTML =
        '<div class="hud-detail-title">' + k.nama + '</div>' +
        '<div class="hud-detail-row"><span>Provinsi</span><b>' + k.provinsi + '</b></div>' +
        '<div class="hud-detail-row"><span>Tipe</span><b>' + k.tipe + '</b></div>' +
        '<div class="hud-detail-row"><span>Tahap</span><b><span class="badge ' + stageClass[k.tahap] + '">' + k.tahap + '</span></b></div>' +
        '<div class="hud-detail-row"><span>Populasi transmigran</span><b>' + k.populasi.toLocaleString("id-ID") + ' jiwa</b></div>' +
        '<div class="hud-detail-row"><span>Indeks 5T</span><b>' + k.indeks5t + ' / 100</b></div>' +
        '<div class="hud-detail-row"><span>Realisasi anggaran</span><b>' + k.anggaranPct + '%</b></div>' +
        '<div class="hud-detail-row"><span>Risiko</span><b><span class="sev ' + k.risiko + '">' + riskLabel + '</span></b></div>' +
        '<div class="hud-legal">' +
          '<div class="hud-legal-label"><span>Legalitas lahan (SHM/HPL)</span><b>' + legalPct + '%</b></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + legalPct + '%"></div></div>' +
        '</div>' +
        '<div class="hud-photo-strip"><div class="photo-thumb">' + media + '<span class="pt-label">' + k.nama + '</span></div></div>';
    }

    function selectKawasan(k) {
      if (!k) return;
      state.selectedKawasan = k.id;
      state.selectedProv = k.provinsi;
      renderKawasanList();
      renderDetail();
      if (state.geoView === "dasar" && activeLeafletMap && leafletMarkers[k.id]) {
        activeLeafletMap.panTo([k.lat, k.lon]);
        leafletMarkers[k.id].openPopup();
      }
    }

    /* ---- grid-of-provinces view (original), fills the canvas with a light padded panel instead of the map ---- */
    function renderProvGrid() {
      var body = qs(wrap, "#sebaranBody");
      body.innerHTML =
        '<div class="geo-grid-pad">' +
          '<div class="toolbar" style="margin-bottom:0.7rem">' +
            '<button class="btn small" id="toggleHPL" aria-pressed="true">Layer HPL</button>' +
            '<button class="btn small" id="toggleSHM" aria-pressed="true">Layer SHM</button>' +
          '</div>' +
          '<div class="map-legend" style="margin-bottom:0.7rem">' +
            '<span class="sw"><span class="chip" style="background:var(--series-2)"></span>Luas HPL</span>' +
            '<span class="sw"><span class="chip" style="background:var(--primary)"></span>Luas SHM Terbit</span>' +
          '</div>' +
          '<div class="province-grid" id="provGrid"></div>' +
        '</div>';

      function draw() {
        var grid = qs(wrap, "#provGrid");
        grid.innerHTML = provinces.map(function (p) {
          var hplPct = Math.min(100, (p.hpl / 15000) * 100);
          var shmPct = Math.min(100, (p.shm / 15000) * 100);
          return '<div class="prov-tile' + (state.selectedProv === p.nama ? " selected" : "") + '" data-p="' + p.nama + '">' +
            '<div class="p-name">' + p.nama + '</div><div class="p-count">' + p.count + ' kawasan</div>' +
            (state.showHPL ? '<div class="layer hpl" style="width:' + hplPct + '%"></div>' : "") +
            (state.showSHM ? '<div class="layer shm" style="width:' + shmPct + '%"></div>' : "") +
            '</div>';
        }).join("");
        qsa(grid, ".prov-tile").forEach(function (t) {
          t.addEventListener("click", function () {
            state.selectedProv = state.selectedProv === t.dataset.p ? null : t.dataset.p;
            state.selectedKawasan = null;
            draw(); renderKawasanList(); renderDetail();
          });
        });
      }
      qs(wrap, "#toggleHPL").addEventListener("click", function (e) {
        state.showHPL = !state.showHPL; e.target.setAttribute("aria-pressed", state.showHPL); draw();
      });
      qs(wrap, "#toggleSHM").addEventListener("click", function (e) {
        state.showSHM = !state.showSHM; e.target.setAttribute("aria-pressed", state.showSHM); draw();
      });
      draw();
    }

    /* ---- real-world basemap view (Leaflet + OpenStreetMap), full-bleed under the HUD sidebar ---- */
    function renderDasar() {
      var body = qs(wrap, "#sebaranBody");
      if (activeLeafletMap) { activeLeafletMap.remove(); activeLeafletMap = null; }
      leafletMarkers = {};

      if (typeof L === "undefined") {
        renderDasarStatic(body);
        return;
      }

      body.innerHTML = '<div class="basemap-wrap"><div class="basemap-el" id="basemapEl"></div></div>';

      var map = L.map(qs(wrap, "#basemapEl"), { scrollWheelZoom: false, attributionControl: false }).setView([-2.2, 118], 5);
      L.control.attribution({ position: "topright" }).addTo(map);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
      }).addTo(map);

      var maxPop = Math.max.apply(null, kawasan.map(function (k) { return k.populasi; }));

      kawasan.forEach(function (k) {
        var radius = 6 + (k.populasi / maxPop) * 10;
        var marker = L.circleMarker([k.lat, k.lon], {
          radius: radius, color: "#0a0f1c", weight: 1.4,
          fillColor: STAGE_COLOR_HEX[k.tahap], fillOpacity: 0.9
        }).addTo(map);
        marker.bindPopup('<b>' + k.nama + '</b><br/>' + k.provinsi + '<br/>Tahap: ' + k.tahap +
          '<br/>Populasi: ' + k.populasi.toLocaleString("id-ID") + ' jiwa');
        marker.on("click", function () { selectKawasan(k); });
        leafletMarkers[k.id] = marker;
      });

      activeLeafletMap = map;
      setTimeout(function () { map.invalidateSize(); }, 60);
    }

    /* ---- static snapshot fallback: real OSM imagery baked in, no live tiles required ---- */
    function renderDasarStatic(body) {
      var maxPop = Math.max.apply(null, kawasan.map(function (k) { return k.populasi; }));
      body.innerHTML = '<div class="basemap-wrap basemap-static">' +
          '<img src="' + BASEMAP_STATIC_SRC + '" alt="Peta dasar OpenStreetMap wilayah Indonesia" />' +
          kawasan.map(function (k) {
            var pos = basemapPct(k.lon, k.lat);
            var size = 8 + (k.populasi / maxPop) * 10;
            return '<span class="bm-pin' + (state.selectedKawasan === k.id ? " selected" : "") + '" data-id="' + k.id + '" ' +
              'style="left:' + pos.xPct.toFixed(2) + '%;top:' + pos.yPct.toFixed(2) + '%;width:' + size + 'px;height:' + size + 'px;background:' + STAGE_COLOR_HEX[k.tahap] + ';"></span>';
          }).join("") +
          '<span class="bm-attrib">&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></span>' +
        '</div>' +
        '<p class="basemap-static-note">Cuplikan statis (tanpa geser/perbesar).</p>';

      qsa(wrap, ".bm-pin").forEach(function (pin) {
        pin.addEventListener("click", function () {
          selectKawasan(kawasan.find(function (x) { return x.id === pin.getAttribute("data-id"); }));
          qsa(wrap, ".bm-pin").forEach(function (p2) { p2.classList.toggle("selected", p2 === pin); });
        });
      });
    }

    function renderSebaran() {
      qsa(wrap, ".hud-radio").forEach(function (b) { b.classList.toggle("active", b.dataset.view === state.geoView); });
      if (state.geoView !== "dasar" && activeLeafletMap) { activeLeafletMap.remove(); activeLeafletMap = null; }
      if (state.geoView === "dasar") renderDasar();
      else renderProvGrid();
    }

    qsa(wrap, ".hud-radio").forEach(function (btn) {
      btn.addEventListener("click", function () { state.geoView = btn.dataset.view; renderSebaran(); });
    });

    renderEwsHud();
    renderKawasanList();
    renderDetail();
    renderSebaran();
    return wrap;
  }

  /* ---------- render: 03 Demografi ---------- */
  function renderDemografi() {
    var wrap = h(
      pageHead("Transmigran, Masyarakat Lokal & Kependudukan", "Visualisasi persebaran demografi, asal daerah transmigran, dan tingkat pembauran dengan masyarakat lokal.") +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-header"><h2>Asal Daerah Transmigran (Top 5)</h2></div><div id="asalBar"></div></div>' +
        '<div class="panel"><div class="panel-header"><h2>Indeks Pembauran Sosial</h2><span class="hint">rata-rata nasional</span></div>' +
        '<div style="display:flex;justify-content:center">' + '</div><div id="pembauranGauge" style="display:flex;justify-content:center"></div>' +
        '<p class="desc" style="text-align:center;margin-top:0.3rem">Skala 0–100 · berbasis survei interaksi sosial &amp; partisipasi kegiatan bersama</p></div>' +
      '</div>' +
      '<div class="panel"><div class="panel-header"><h2>Populasi per Kawasan</h2><span class="hint">jumlah jiwa transmigran terdaftar</span></div><div id="popBar"></div></div>'
    );

    var asalData = asalDaerah.map(function (a) { return { label: a.asal, value: a.jml, color: "var(--series-2)" }; });
    qs(wrap, "#asalBar").appendChild(barChart(asalData, { height: 190 }));

    qs(wrap, "#pembauranGauge").appendChild(gauge(67, 100, { label: "/ 100", color: "var(--good)" }));

    var popData = kawasan.map(function (k) { return { label: k.nama.replace(/^SKP |^KPB /, ""), value: k.populasi, color: "var(--primary)" }; });
    qs(wrap, "#popBar").appendChild(barChart(popData, { height: 200, width: 900 }));

    return wrap;
  }

  /* ---------- render: 04 Infrastruktur ---------- */
  function renderInfrastruktur() {
    var wrap = h(
      pageHead("Infrastruktur, Sarana Prasarana & Kolaborasi K/L", "Inventarisasi aset fisik kawasan dan pemetaan intervensi program lintas Kementerian/Lembaga — Trans Gotong Royong.") +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-header"><h2>Capaian Infrastruktur per Kategori</h2></div>' +
        '<div id="infraList"></div></div>' +
        '<div class="panel"><div class="panel-header"><h2>Kolaborasi Kementerian/Lembaga</h2></div>' +
        '<div class="table-wrap"><table><thead><tr><th>K/L</th><th>Program</th><th>Kawasan</th><th>Status</th></tr></thead><tbody>' +
        klCollab.map(function (c) {
          var statusClass = c.status === "Selesai" ? "mandiri" : c.status === "Berjalan" ? "berkembang" : "tumbuh";
          return '<tr><td>' + c.kl + '</td><td>' + c.program + '</td><td class="mono">' + c.kawasanCount + '</td><td><span class="badge ' + statusClass + '">' + c.status + '</span></td></tr>';
        }).join("") + '</tbody></table></div></div>' +
      '</div>'
    );

    qs(wrap, "#infraList").innerHTML = infraKategori.map(function (i) {
      return '<div style="margin-bottom:0.7rem"><div style="display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:0.3rem">' +
        '<span>' + i.nama + '</span><span class="mono">' + i.capaian + '%</span></div>' +
        '<div class="bar-track" style="width:100%;height:7px"><div class="bar-fill" style="width:' + i.capaian + '%"></div></div></div>';
    }).join("");

    return wrap;
  }

  /* ---------- render: 05 Monitoring ---------- */
  function renderMonitoring() {
    var wrap = h(
      pageHead("Monitoring 5T: Program, Kinerja, Anggaran & Tindak Lanjut", "Pelacakan linimasa program (Kurva S) dan realisasi penyerapan anggaran program unggulan 5T secara real-time.") +
      '<div class="kpi-grid">' +
        kpiTile("Realisasi Fisik", "74%", "vs. rencana 80%", "down") +
        kpiTile("Realisasi Anggaran", "68%", "▲ 5% bulan ini", "up") +
        kpiTile("Program Berjalan", "18", "dari 24 program aktif", "flat") +
        kpiTile("Tenggat Terlewat", "3", "perlu tindak lanjut", "down") +
      '</div>' +
      '<div class="panel"><div class="panel-header"><h2>Kurva S — Rencana vs. Realisasi</h2>' +
        '<span class="map-legend"><span class="sw"><span class="chip" style="background:var(--series-2)"></span>Rencana</span><span class="sw"><span class="chip" style="background:var(--primary)"></span>Realisasi</span></span></div>' +
        '<div id="scurve"></div></div>' +
      '<div class="panel"><div class="panel-header"><h2>Realisasi Anggaran per Kawasan</h2></div><div id="anggaranBar"></div></div>'
    );

    qs(wrap, "#scurve").appendChild(lineChartDual(sCurve.labels, sCurve.rencana, sCurve.realisasi, { width: 900, height: 220 }));

    var angData = kawasan.map(function (k) {
      return { label: k.nama.replace(/^SKP |^KPB /, ""), value: k.anggaranPct, suffix: "%", color: k.anggaranPct < 35 ? "var(--critical)" : k.anggaranPct < 60 ? "var(--warn)" : "var(--good)" };
    });
    qs(wrap, "#anggaranBar").appendChild(barChart(angData, { height: 200, width: 900, suffix: "%", max: 100 }));

    return wrap;
  }

  /* ---------- render: 06 Ekonomi ---------- */
  function renderEkonomi() {
    var wrap = h(
      pageHead("Potensi Ekonomi, Komoditas, Hilirisasi & Investasi Kawasan", "Dasbor komoditas unggulan, rantai pasok hulu-hilir, dan peta peluang investasi — Trans Karya Nusa.") +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-header"><h2>Indeks Komoditas Unggulan</h2></div><div id="komoditasBar"></div></div>' +
        '<div class="panel"><div class="panel-header"><h2>Rantai Hilirisasi — Kelapa Sawit</h2></div>' +
        '<div class="stepper">' +
          step("1", "Kebun Rakyat") + step("2", "Pengumpul") + step("3", "Pabrik CPO") + step("4", "Refinery") + step("5", "Pasar Ekspor") +
        '</div></div>' +
      '</div>' +
      '<div class="panel"><div class="panel-header"><h2>Peluang Investasi Terbuka</h2><span class="hint">siap diakses calon mitra</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Kawasan</th><th>Sektor</th><th>Estimasi Nilai</th><th>Status</th></tr></thead><tbody>' +
        '<tr><td>KPB Rambutan</td><td>Pengolahan Karet</td><td class="mono">Rp 42 M</td><td><span class="badge mandiri">Siap Tawar</span></td></tr>' +
        '<tr><td>SKP Salor</td><td>Pergudangan Pangan</td><td class="mono">Rp 18 M</td><td><span class="badge berkembang">Studi Kelayakan</span></td></tr>' +
        '<tr><td>KPB Bathin III</td><td>Agroindustri Kelapa Sawit</td><td class="mono">Rp 65 M</td><td><span class="badge mandiri">Siap Tawar</span></td></tr>' +
        '<tr><td>KPB Air Terang</td><td>Perikanan Tambak</td><td class="mono">Rp 9 M</td><td><span class="badge tumbuh">Perencanaan</span></td></tr>' +
        '</tbody></table></div></div>'
    );
    function step(n, label) { return '<div class="step"><div class="s-icon">' + n + '</div><div class="s-label">' + label + '</div></div>'; }

    var komData = komoditas.map(function (k) { return { label: k.nama, value: k.nilai, color: "var(--primary)" }; });
    qs(wrap, "#komoditasBar").appendChild(barChart(komData, { height: 200 }));

    return wrap;
  }

  /* ---------- render: 07 Analitik / EWS ---------- */
  function renderAnalitik() {
    var wrap = h(
      pageHead("Analitik Kawasan, Skoring Prioritas 5T & Early Warning", "Pemodelan statistik untuk skoring prioritas intervensi serta notifikasi otomatis Early Warning System (EWS).") +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-header"><h2>Skoring Prioritas Intervensi</h2><span class="hint">semakin rendah indeks 5T, semakin tinggi prioritas</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Kawasan</th><th>Indeks 5T</th><th>Risiko</th><th>Prioritas</th></tr></thead><tbody id="priorityTbody"></tbody></table></div></div>' +
        '<div class="panel"><div class="panel-header"><h2>Early Warning System</h2><span class="hint" id="ewsCount"></span></div><div id="ewsList"></div></div>' +
      '</div>'
    );

    var ranked = kawasan.slice().sort(function (a, b) { return a.indeks5t - b.indeks5t; });
    qs(wrap, "#priorityTbody").innerHTML = ranked.map(function (k, i) {
      var priority = i < 2 ? "high" : i < 5 ? "med" : "low";
      return '<tr><td class="mono">#' + (i + 1) + ' ' + k.nama + '</td><td class="mono">' + k.indeks5t + '</td>' +
        '<td><span class="sev ' + k.risiko + '">' + ({ high: "Tinggi", med: "Sedang", low: "Rendah" })[k.risiko] + '</span></td>' +
        '<td><span class="sev ' + priority + '">' + ({ high: "Segera", med: "Terjadwal", low: "Pantau" })[priority] + '</span></td></tr>';
    }).join("");

    function renderEWS() {
      var active = ewsAlerts.filter(function (a) { return !a.ack; }).length;
      qs(wrap, "#ewsCount").textContent = active + " aktif";
      qs(wrap, "#ewsList").innerHTML = ewsAlerts.map(function (a) {
        return '<div class="ews-item' + (a.ack ? " ack" : "") + '" data-id="' + a.id + '">' +
          '<span class="sev ' + a.sev + '">' + ({ high: "Tinggi", med: "Sedang", low: "Rendah" })[a.sev] + '</span>' +
          '<div class="ews-body"><div class="t">' + a.title + '</div><div class="d">' + a.detail + '</div>' +
          '<div class="ews-meta">' + a.when + '</div></div>' +
          '<button class="btn small" data-ack="' + a.id + '">' + (a.ack ? "Dibuka" : "Tandai") + '</button>' +
          '</div>';
      }).join("");
      qsa(wrap, "[data-ack]").forEach(function (b) {
        b.addEventListener("click", function () {
          var a = ewsAlerts.find(function (x) { return x.id === b.dataset.ack; });
          a.ack = !a.ack; renderEWS();
        });
      });
    }
    renderEWS();

    return wrap;
  }

  /* ---------- render: 08 Executive Intelligence / AI ---------- */
  function renderIntelijen() {
    var wrap = h(
      pageHead("Executive Intelligence, Pelaporan Strategis & AI Assistant", "Konsolidasi statistik sektoral transmigrasi tingkat nasional dan asisten AI untuk pertanyaan cepat pimpinan.") +
      '<div class="kpi-grid">' +
        kpiTile("Kawasan Mandiri", kawasan.filter(function (k) { return k.tahap === "Mandiri"; }).length, "dari " + kawasan.length + " kawasan", "flat") +
        kpiTile("Luas HPL Nasional", (nationalKPI.hplTotal / 1000).toFixed(1) + "rb Ha", "seluruh kawasan terpantau", "flat") +
        kpiTile("Luas SHM Terbit", (nationalKPI.shmTotal / 1000).toFixed(1) + "rb Ha", Math.round(nationalKPI.shmTotal / nationalKPI.hplTotal * 100) + "% dari HPL", "up") +
        kpiTile("Peringatan Aktif", ewsAlerts.filter(function (a) { return !a.ack; }).length, "perlu tindak lanjut", "down") +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-header"><h2>Laporan Strategis</h2></div>' +
        '<p class="desc">Ringkasan otomatis kondisi seluruh kawasan untuk bahan rapat pimpinan, disusun dari data 8 modul di atas.</p>' +
        '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.6rem">' +
          '<button class="btn primary small" disabled>Unduh Ringkasan PDF</button>' +
          '<button class="btn small" disabled>Jadwalkan Laporan Mingguan</button>' +
        '</div>' +
        '</div>' +
        '<div class="panel"><div class="panel-header"><h2>AI Assistant</h2><span class="hint">tanya cepat seputar data kawasan</span></div>' +
        '<div class="chat-log" id="chatLog"></div>' +
        '<div class="chat-input-row"><input id="chatInput" type="text" placeholder="Contoh: kawasan mana yang paling berisiko?" />' +
        '<button class="btn primary" id="chatSend">Kirim</button></div>' +
        '<div class="chat-suggest">' +
          '<button class="btn small" data-q="kawasan mandiri">kawasan mandiri</button>' +
          '<button class="btn small" data-q="risiko tinggi">risiko tinggi</button>' +
          '<button class="btn small" data-q="realisasi anggaran">realisasi anggaran</button>' +
        '</div></div>' +
      '</div>'
    );

    var log = [{ role: "ai", text: "Selamat datang. Saya dapat merangkum status kawasan, risiko, dan anggaran dari data pada dashboard ini." }];

    function renderLog() {
      qs(wrap, "#chatLog").innerHTML = log.map(function (m) {
        return '<div class="msg ' + m.role + '">' + m.text + '</div>';
      }).join("");
      var elLog = qs(wrap, "#chatLog"); elLog.scrollTop = elLog.scrollHeight;
    }

    function send(text) {
      if (!text.trim()) return;
      log.push({ role: "user", text: text });
      log.push({ role: "ai", text: aiAnswer(text) });
      renderLog();
    }

    qs(wrap, "#chatSend").addEventListener("click", function () {
      var inp = qs(wrap, "#chatInput"); send(inp.value); inp.value = "";
    });
    qs(wrap, "#chatInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { send(this.value); this.value = ""; }
    });
    qsa(wrap, "[data-q]").forEach(function (b) {
      b.addEventListener("click", function () { send(b.dataset.q); });
    });

    renderLog();
    return wrap;
  }

  var RENDERERS = {
    profil: renderProfil, geospasial: renderGeospasial, demografi: renderDemografi,
    infrastruktur: renderInfrastruktur, monitoring: renderMonitoring, ekonomi: renderEkonomi,
    analitik: renderAnalitik, intelijen: renderIntelijen
  };

  function render() {
    mainEl.innerHTML = "";
    mainEl.classList.toggle("no-pad", state.tab === "geospasial");
    mainEl.appendChild(RENDERERS[state.tab]());
  }

  /* ---------- clock ---------- */
  function tickClock() {
    var d = new Date();
    var pad2 = function (n) { return (n < 10 ? "0" : "") + n; };
    document.getElementById("clock").textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- rail toggles: mobile off-canvas open/close (≤760px) vs. desktop full collapse ---------- */
  var railToggle = document.getElementById("railToggle");
  var railCollapseToggle = document.getElementById("railCollapseToggle");
  function checkWidth() {
    var narrow = window.innerWidth <= 760;
    railToggle.style.display = narrow ? "inline-flex" : "none";
    railCollapseToggle.style.display = narrow ? "none" : "inline-flex";
  }
  window.addEventListener("resize", checkWidth);
  checkWidth();
  railToggle.addEventListener("click", function () {
    document.getElementById("rail").classList.toggle("open");
  });
  railCollapseToggle.addEventListener("click", function () {
    var collapsed = document.getElementById("rail").classList.toggle("collapsed");
    railCollapseToggle.setAttribute("aria-label", collapsed ? "Perluas menu" : "Ciutkan menu");
  });

  render();
})();
</script>
