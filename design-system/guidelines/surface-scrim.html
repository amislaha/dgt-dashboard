<!-- @dsCard group="Surfaces" viewport="700x160" name="Scrim & glass" subtitle="Text protection over imagery; blurred sticky bars" -->
<!doctype html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--background);font:var(--type-body)}</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;height:118px;border-radius:var(--radius-lg);background:linear-gradient(120deg,var(--biru-700),var(--emas-500));position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div>
<div style="position:absolute;left:12px;bottom:10px;color:#fff"><div style="font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;opacity:.85">Kawasan</div><div style="font:var(--weight-bold) 18px/1.2 var(--font-sans)">KTM Lamunti, Kalteng</div></div>
</div>
<div style="flex:1;height:118px;border-radius:var(--radius-lg);background:linear-gradient(120deg,var(--teal-500),var(--biru-700));display:grid;place-items:center">
<div style="background:var(--glass-bg);backdrop-filter:var(--glass-blur);padding:10px 16px;border-radius:var(--radius-full);font:var(--type-label)">--glass-bg + --glass-blur</div>
</div></div></body></html>
