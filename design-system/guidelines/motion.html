<!doctype html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--background);font:var(--type-body)}.b{height:10px;border-radius:5px;background:var(--biru-400);animation:slide 2.4s var(--ease-standard) infinite alternate}@keyframes slide{from{width:12%}to{width:100%}}</style></head><body>
<div style="display:grid;gap:9px;font:var(--type-mono);font-size:10px;color:var(--muted-foreground)">
<div style="display:flex;align-items:center;gap:10px"><span style="width:170px">--duration-instant · 80ms · press feedback</span><span style="flex:1"><span class="b" style="display:block;animation-duration:1.2s"></span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:170px">--duration-fast · 120ms · colour/hover</span><span style="flex:1"><span class="b" style="display:block;animation-duration:1.6s"></span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:170px">--duration-normal · 180ms · dialogs, switches</span><span style="flex:1"><span class="b" style="display:block;animation-duration:2s"></span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:170px">--duration-slow · 280ms · progress, expand</span><span style="flex:1"><span class="b" style="display:block;animation-duration:2.6s"></span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:170px">--duration-page · 420ms · route change</span><span style="flex:1"><span class="b" style="display:block;animation-duration:3.2s"></span></span></div>
</div></body></html>
