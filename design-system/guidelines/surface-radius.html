<!doctype html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--background);font:var(--type-body)}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end">

<div style="font:var(--type-caption);color:var(--muted-foreground);max-width:20ch">Cards use xl, controls md, badges full.</div>
