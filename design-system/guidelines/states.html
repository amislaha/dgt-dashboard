<!doctype html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--background);font:var(--type-body)}.btn{height:36px;padding:0 16px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);border:0;font:var(--type-label);display:inline-flex;align-items:center}</style></head><body>
<div style="display:flex;gap:14px;align-items:flex-end">
<div style="text-align:center"><span class="btn" style="">Simpan</span><div style="margin-top:8px;font:var(--type-caption);color:var(--muted-foreground)">Default</div></div><div style="text-align:center"><span class="btn" style="background:var(--biru-700)">Simpan</span><div style="margin-top:8px;font:var(--type-caption);color:var(--muted-foreground)">Hover</div></div><div style="text-align:center"><span class="btn" style="background:var(--biru-700);transform:scale(.985)">Simpan</span><div style="margin-top:8px;font:var(--type-caption);color:var(--muted-foreground)">Press</div></div><div style="text-align:center"><span class="btn" style="box-shadow:0 0 0 var(--focus-ring-width) var(--focus-ring-color)">Simpan</span><div style="margin-top:8px;font:var(--type-caption);color:var(--muted-foreground)">Focus</div></div><div style="text-align:center"><span class="btn" style="opacity:.5">Simpan</span><div style="margin-top:8px;font:var(--type-caption);color:var(--muted-foreground)">Disabled</div></div>
</div></body></html>
