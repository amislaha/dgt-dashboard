<!-- @dsCard group="Colors" viewport="700x130" name="Status mapping" subtitle="Fixed meanings for record states across every surface" -->
<!doctype html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--background);font:var(--type-body)}.s{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:var(--radius-lg);border:1px solid}.s b{font-size:var(--text-sm)}.s span{font:var(--type-caption)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
<div class="s" style="background:var(--hijau-50);border-color:var(--hijau-100);color:var(--hijau-700)"><b>Terverifikasi</b><span>success</span></div>
<div class="s" style="background:var(--emas-50);border-color:var(--emas-100);color:var(--emas-600)"><b>Menunggu</b><span>warning</span></div>
<div class="s" style="background:var(--merah-50);border-color:var(--merah-100);color:var(--merah-600)"><b>Ditolak</b><span>danger</span></div>
<div class="s" style="background:var(--teal-50);border-color:var(--teal-100);color:var(--teal-500)"><b>Baru</b><span>info</span></div>
<div class="s" style="background:var(--abu-100);border-color:var(--abu-200);color:var(--abu-700)"><b>Arsip</b><span>neutral</span></div>
</div></body></html>
