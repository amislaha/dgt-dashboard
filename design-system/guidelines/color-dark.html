<!-- @dsCard group="Colors" viewport="700x150" name="Dark surfaces" subtitle=".dark scope — used for the SIMTRANS sidebar and night mode" -->
<!doctype html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--background);font:var(--type-body)}</style></head><body><div class="dark" style="background:var(--background);color:var(--foreground);padding:14px;border-radius:var(--radius-lg);display:flex;gap:10px;align-items:stretch">
<div style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;font-size:var(--text-sm)">--card<div style="color:var(--muted-foreground);font:var(--type-caption);margin-top:4px">--muted-foreground</div></div>
<div style="flex:1;background:var(--primary);color:var(--primary-foreground);border-radius:var(--radius-md);padding:10px;font-size:var(--text-sm)">--primary</div>
<div style="flex:1;background:var(--secondary);color:var(--secondary-foreground);border-radius:var(--radius-md);padding:10px;font-size:var(--text-sm)">--secondary</div>
<div style="flex:1;background:var(--accent);color:var(--accent-foreground);border-radius:var(--radius-md);padding:10px;font-size:var(--text-sm)">--accent</div>
</div></body></html>
