<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body><div id="root"></div><script type="text/babel">
const NS = window.TransmigrasiDigitalDesignSystem_7b839d;
const { Alert, Dialog, Button, Textarea } = NS;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return <div className="col">
    <Alert tone="info" title="Jadwal verifikasi">Berkas Anda dijadwalkan diverifikasi pada 2 September 2026.</Alert>
    <Alert tone="success" title="Permohonan terkirim" onDismiss={()=>{}}>Nomor registrasi TRM-2026-004182.</Alert>
    <Alert tone="warning" title="Dokumen belum lengkap" action={<Button size="sm" variant="outline">Unggah dokumen</Button>}>Unggah SK Bupati sebelum 30 September 2026.</Alert>
    <Alert tone="danger" title="Permohonan ditolak">Data luas lahan tidak sesuai dengan SK penetapan.</Alert>
    <div className="row"><Button variant="outline" onClick={()=>setOpen(true)}>Buka dialog</Button></div>
    <Dialog open={open} onClose={()=>setOpen(false)} title="Setujui permohonan?" description="Tindakan ini tercatat dalam log audit."
      footer={<><Button variant="outline" onClick={()=>setOpen(false)}>Batal</Button><Button onClick={()=>setOpen(false)}>Setujui</Button></>}>
      <Textarea rows={3} placeholder="Catatan verifikator (opsional)"/>
    </Dialog>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
