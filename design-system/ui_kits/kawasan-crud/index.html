<style>
body{margin:0;background:var(--abu-50)}
.kc-page{display:flex;flex-direction:column;gap:20px;max-width:var(--container-wide);margin:0 auto;padding:28px 24px 64px}
.kc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.kc-eyebrow{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted-foreground);margin-bottom:6px}
.kc-head h1{font:var(--type-h1);letter-spacing:var(--tracking-tight)}
.kc-head p{margin-top:6px;font:var(--type-body);color:var(--muted-foreground);max-width:70ch}
.kc-head__a{display:flex;gap:8px}
.kc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kc-stat{display:flex;flex-direction:column;gap:6px;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-xs)}
.kc-stat__l{font:var(--type-label);color:var(--muted-foreground)}
.kc-stat__v{font:var(--weight-extrabold) var(--text-3xl)/1 var(--font-display);letter-spacing:var(--tracking-tighter);font-variant-numeric:tabular-nums}
.kc-stat__s{font:var(--type-caption);color:var(--muted-foreground)}
.kc-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kc-toolbar > span:first-child{width:280px}
.kc-toolbar__badges{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.kc-tablewrap{width:100%;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-xl);margin-top:14px}
.kc-table{width:100%;border-collapse:collapse;font-family:var(--font-sans);font-size:var(--text-sm)}
.kc-table thead th{background:var(--abu-50);border-bottom:1px solid var(--border);padding:8px 12px;font-size:var(--text-xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted-foreground);text-align:left;white-space:nowrap}
.kc-table thead tr:first-child th{border-bottom:1px solid var(--border)}
.kc-table th.kc-grp{text-align:center;border-left:1px solid var(--border)}
.kc-table tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.kc-table tbody tr:hover{background:var(--abu-50)}
.kc-table tbody tr:last-child td{border-bottom:0}
.kc-table .kc-num{text-align:right;font-variant-numeric:tabular-nums}
.kc-table .kc-name{font-weight:500;color:var(--foreground)}
.kc-empty{padding:40px;text-align:center;color:var(--muted-foreground)}
.kc-rowa{display:flex;gap:2px}
.kc-table tfoot td{padding:10px 12px;background:var(--emas-50);border-top:1px solid var(--border);font-weight:var(--weight-semibold)}
.kc-avglabel{text-align:right;color:var(--abu-700)}
.kc-form{display:flex;flex-direction:column;gap:14px}
.kc-f{display:flex;flex-direction:column;gap:6px}
.kc-f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
