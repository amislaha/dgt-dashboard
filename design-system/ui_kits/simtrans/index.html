<script type="text/babel">
const TITLES = { dashboard: "Dasbor", registri: "Registri Kawasan", detail: "Telaah Permohonan", permohonan: "Permohonan", penempatan: "Penempatan KK", anggaran: "Anggaran", peta: "Peta Kawasan", audit: "Log Audit", pengaturan: "Pengaturan" };
function App() {
  const [auth, setAuth] = React.useState(false);
  const [screen, setScreen] = React.useState("dashboard");
  if (!auth) return <LoginScreen onSignIn={() => setAuth(true)} />;
  const nav = (id) => setScreen(id);
  let body;
  if (screen === "registri" || screen === "permohonan") body = <RegistriScreen onOpen={nav} />;
  else if (screen === "detail") body = <DetailScreen />;
  else if (screen === "dashboard") body = <DashboardScreen onOpen={nav} />;
  else body = <div className="sim-page"><PageHead title={TITLES[screen]} desc="Modul ini tidak termasuk dalam UI kit — sengaja dibiarkan kosong." /></div>;
  return (
    <div className="sim-app">
      <Sidebar active={screen === "detail" ? "permohonan" : screen} onNavigate={nav} />
      <div className="sim-main">
        <Topbar title={TITLES[screen] || "SIMTRANS"} actions={<NSAvatar />} />
        {body}
      </div>
    </div>
  );
}
function NSAvatar() { const { Avatar } = window.TransmigrasiDigitalDesignSystem_7b839d; return <Avatar name="Siti Rahayu" size="sm" ring />; }
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
