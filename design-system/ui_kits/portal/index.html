<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--background)}
.pt-wrap{width:100%;max-width:var(--container-max);margin:0 auto;padding:0 24px}
.pt-eyebrow{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--biru-600)}
.pt-lead{font:var(--type-body-lg);color:var(--muted-foreground);max-width:62ch;margin-top:10px}
.pt-strip{background:var(--biru-950);color:rgb(255 255 255/.72);font-size:var(--text-xs)}
.pt-strip__in{display:flex;justify-content:space-between;align-items:center;height:34px}
.pt-strip__in span{display:flex;align-items:center;gap:6px}
.pt-strip a{color:rgb(255 255 255/.72)}
.pt-strip a:hover{color:#fff}
.pt-dot{width:3px;height:3px;border-radius:50%;background:rgb(255 255 255/.35);margin:0 8px}
.pt-head{position:sticky;top:0;z-index:30;background:var(--glass-bg);backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--border)}
.pt-head__in{display:flex;align-items:center;gap:28px;height:72px}
.pt-brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.pt-brand img{height:42px;width:auto}
.pt-brand strong{display:block;font:var(--weight-extrabold) 12.5px/1.15 var(--font-sans);letter-spacing:.01em;color:var(--biru-800)}
.pt-brand em{display:block;font-style:normal;font-size:10px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin-top:2px}
.pt-nav{display:flex;gap:20px;margin-left:auto}
.pt-nav a{font:var(--type-label);color:var(--abu-700);text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.pt-nav a:hover{color:var(--primary);text-decoration:none;border-bottom-color:var(--biru-200)}
.pt-nav a.pt-nav--on{color:var(--primary);border-bottom-color:var(--primary)}
.pt-head__a{display:flex;align-items:center;gap:6px}
.pt-hero{background:linear-gradient(155deg,var(--biru-900) 0%,var(--biru-700) 48%,var(--teal-600) 100%);color:#fff;padding:64px 0 72px;position:relative;overflow:hidden}
.pt-hero::after{content:"";position:absolute;inset:0;background:var(--scrim-flat);opacity:.25}
.pt-hero__in{position:relative;z-index:1;display:grid;grid-template-columns:1.35fr 1fr;gap:48px;align-items:center}
.pt-hero .pt-eyebrow{color:var(--emas-300)}
.pt-hero h1{font:var(--weight-extrabold) var(--text-5xl)/1.06 var(--font-display);letter-spacing:var(--tracking-tighter);margin-top:14px;max-width:20ch}
.pt-hero p{font:var(--type-body-lg);color:rgb(255 255 255/.82);max-width:52ch;margin-top:16px}
.pt-hero__cta{display:flex;gap:10px;margin-top:26px}
.pt-hero__cta .tds-btn--outline{background:transparent;color:#fff;border-color:rgb(255 255 255/.4)}
.pt-hero__cta .tds-btn--outline:hover{background:rgb(255 255 255/.1);color:#fff;border-color:#fff}
.pt-hero__meta{display:flex;align-items:center;gap:7px;margin-top:22px;font:var(--type-caption);color:rgb(255 255 255/.7)}
.pt-hero__card{background:var(--card);border-radius:var(--radius-2xl);padding:22px;box-shadow:var(--shadow-xl);display:flex;flex-direction:column;gap:14px;color:var(--foreground)}
.pt-hero__cardhd{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted-foreground)}
.pt-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pt-figs strong{display:block;font:var(--weight-extrabold) var(--text-3xl)/1 var(--font-display);letter-spacing:var(--tracking-tighter);font-variant-numeric:tabular-nums}
.pt-figs span{display:block;font:var(--type-caption);color:var(--muted-foreground);margin-top:4px}
.pt-hero__note{display:flex;align-items:center;gap:6px;font:var(--type-caption);color:var(--muted-foreground)}
.pt-sec{padding:64px 0}
.pt-sec--tint{background:var(--abu-50);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.pt-sechd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px}
.pt-sechd a{font:var(--type-label);display:inline-flex;align-items:center;gap:6px}
.pt-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pt-layicon{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--radius-md);background:var(--biru-50);color:var(--biru-600);flex:none}
.pt-split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.pt-peta__ph{height:320px;border-radius:var(--radius-2xl);border:1px dashed var(--abu-300);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted-foreground);font:var(--type-caption);text-align:center;padding:24px}
.pt-list{display:flex;flex-direction:column;margin:22px 0}
.pt-list__row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--border);font-size:var(--text-sm);color:var(--muted-foreground)}
.pt-list__row strong{color:var(--foreground);font-weight:600}
.pt-news{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pt-news__img{width:100%;aspect-ratio:16/10;border-radius:var(--radius-xl);background:linear-gradient(140deg,var(--teal-100),var(--emas-100));display:grid;place-items:center;font:var(--type-caption);color:var(--abu-500)}
.pt-news h3{font:var(--weight-bold) var(--text-lg)/1.3 var(--font-sans);letter-spacing:var(--tracking-tight);text-wrap:pretty}
.pt-news p{font:var(--type-body);color:var(--muted-foreground)}
.pt-news time{font:var(--type-caption);color:var(--abu-500)}
.pt-cta{background:var(--biru-800);color:#fff;padding:52px 0}
.pt-cta__in{display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
.pt-cta h2{font:var(--type-h2)}
.pt-cta p{color:rgb(255 255 255/.75);margin-top:8px;font:var(--type-body)}
.pt-cta__b{display:flex;gap:10px}
.pt-cta .tds-btn--outline{background:transparent;color:#fff;border-color:rgb(255 255 255/.4)}
.pt-cta .tds-btn--outline:hover{background:rgb(255 255 255/.1);color:#fff;border-color:#fff}
.pt-foot{background:var(--biru-950);color:rgb(255 255 255/.7);padding-top:52px}
.pt-foot__in{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.1fr;gap:32px;padding-bottom:40px}
.pt-foot__brand{display:flex;gap:14px}
.pt-foot__plate{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;background:#fff}
.pt-foot__plate img{width:46px;height:46px}
.pt-foot__wm{font:var(--weight-extrabold) 13px/1.2 var(--font-sans);color:#fff}
.pt-foot__wm2{font-size:10px;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--emas-300);margin-top:3px}
.pt-foot__brand p{font-size:var(--text-xs);line-height:1.6;margin-top:10px}
.pt-foot__badges{display:flex;gap:6px;margin-top:12px}
.pt-foot__badges .tds-badge{color:rgb(255 255 255/.7);border-color:rgb(255 255 255/.2)}
.pt-foot__col{display:flex;flex-direction:column;gap:8px}
.pt-foot__col h4{font:var(--type-label);color:#fff;margin-bottom:2px}
.pt-foot__col a{font-size:var(--text-xs);color:rgb(255 255 255/.65);text-decoration:none}
.pt-foot__col a:hover{color:#fff;text-decoration:underline}
.pt-foot__p{font-size:var(--text-xs);line-height:1.6}
.pt-foot__bar{border-top:1px solid rgb(255 255 255/.1);padding:16px 0}
.pt-foot__barin{display:flex;justify-content:space-between;font-size:var(--text-xs)}
.pt-form{padding:28px 0 72px;display:block}
.pt-form .pt-wrap{display:flex;flex-direction:column;gap:20px}
.pt-formhd{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:start;margin-top:6px}
.pt-formhd h1{font:var(--type-h1);margin-top:8px}
.pt-kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:var(--text-sm)}
.pt-kv:last-child{border-bottom:0}
.pt-kv span{color:var(--muted-foreground)}
.pt-steps{display:flex;gap:8px;flex-wrap:wrap}
.pt-step{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-full);font:var(--type-label);color:var(--muted-foreground);background:var(--card)}
.pt-step__n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--abu-200);color:var(--abu-700);font-size:11px;font-weight:700}
.pt-step--on{border-color:var(--primary);color:var(--primary)}
.pt-step--on .pt-step__n{background:var(--primary);color:var(--primary-foreground)}
.pt-step--done{color:var(--teal-600);border-color:var(--teal-200);background:var(--teal-50)}
.pt-step--done .pt-step__n{background:var(--teal-500);color:#fff}
.pt-formgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start}
.pt-fields{display:flex;flex-direction:column;gap:16px}
.pt-f{display:flex;flex-direction:column;gap:6px}
.pt-f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pt-formnav{display:flex;justify-content:space-between;gap:10px}
.pt-up{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px dashed var(--abu-300);border-radius:var(--radius-lg);background:var(--abu-50);color:var(--muted-foreground)}
.pt-up--ok{border-style:solid;border-color:var(--teal-200);background:var(--teal-50);color:var(--teal-700)}
.pt-up div{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.pt-up strong{font-size:var(--text-sm);font-weight:600;color:var(--foreground)}
.pt-up span{font:var(--type-caption)}
.pt-decl{padding:16px 18px;border-left:3px solid var(--emas-300);background:var(--abu-50);border-radius:var(--radius-md)}
.pt-decl h3{font:var(--type-h3);margin-bottom:8px}
.pt-decl p{font:var(--type-body);color:var(--muted-foreground);line-height:var(--leading-relaxed)}
.pt-aside{display:flex;flex-direction:column;gap:16px}
.pt-ul{margin:0;padding-left:18px;font-size:var(--text-sm);line-height:1.9;color:var(--muted-foreground)}
.pt-help{font:var(--type-body);color:var(--muted-foreground)}
.pt-badgebox{display:flex;gap:8px}
</style>
</head><body><div id="root"></div>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="screen-beranda.jsx"></script>
<script type="text/babel" src="screen-layanan.jsx"></script>
<script type="text/babel">
function Site() {
  const [screen, setScreen] = React.useState("beranda");
  React.useEffect(() => { window.scrollTo(0, 0); }, [screen]);
  return (
    <div>
      <TopStrip />
      <SiteHeader active={screen === "layanan" ? "Layanan" : "Beranda"} onNavigate={setScreen} />
      {screen === "layanan" ? <LayananScreen onNavigate={setScreen} /> : <BerandaScreen onNavigate={setScreen} />}
      <SiteFooter />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Site />);
</script></body></html>
