  var storedView = store.get("view", "public");
  if (VIEWS.indexOf(storedView) < 0) storedView = "public";

  var state = {
    view: storedView,
    dockCollapsed: store.get("dockCollapsed", false),
    collectionId: store.get("collectionId", classifications[0].id),
    basemap: store.get("basemap", "kp_street"),
    hidden: store.get("hidden", {}),            // classificationId -> true if layer hidden
    boundary: store.get("boundary", {}),        // boundary level key -> true if shown
    poiVisible: store.get("poiVisible", false),
    activeCompartment: store.get("activeCompartment", null),
    editing: null,                              // { isNew, id, type, latlngs, feature, trackKind }
    drawType: null,                             // 'Point' | 'LineString' | 'Polygon' while manual-drawing
    shapeMode: "vertex",                        // vertex | move | addvertex | delete
    countdown: null,                            // seconds left during Tracking Point
    lineTrack: null,                            // { kind:'LineString'|'Polygon', pts:[latlng] } during Tracking Line/Polygon
    myLoc: null,                                // last known GPS LatLng (captured in Edit Mode / locate FAB)
    myLocAcc: null,
    wcCreating: false,
    myLayersScopeAll: false,
    myGeomFilter: "all",
    apprFilter: "all",
    apprOpen: {}
  };
  if (!BASEMAPS[state.basemap]) state.basemap = "kp_street";
  if (!classifications.some(function (c) { return c.id === state.collectionId; })) state.collectionId = classifications[0].id;
  if (state.activeCompartment && !compartments.some(function (c) { return c.id === state.activeCompartment; })) state.activeCompartment = null;

  function persist() {
    store.set("classifications", classifications);
    store.set("features", features);
    store.set("compartments", compartments);
    store.set("tasks", tasks);
    store.set("activity", activity);
    store.set("view", state.view);
    store.set("dockCollapsed", state.dockCollapsed);
    store.set("collectionId", state.collectionId);
    store.set("basemap", state.basemap);
    store.set("hidden", state.hidden);
    store.set("boundary", state.boundary);
    store.set("poiVisible", state.poiVisible);
    store.set("activeCompartment", state.activeCompartment);
  }
  function clsById(id) { for (var i = 0; i < classifications.length; i++) if (classifications[i].id === id) return classifications[i]; return classifications[0]; }
  function wcById(id) { for (var i = 0; i < compartments.length; i++) if (compartments[i].id === id) return compartments[i]; return null; }

  /* ---------------- approval workflow (PRD open question #2) ---------------- */
  var APPROVAL_META = {
    PENDING:  { label: "Menunggu",  color: "var(--warn)" },
    APPROVED: { label: "Disetujui", color: "var(--good)" },
    REJECTED: { label: "Ditolak",   color: "var(--critical)" }
  };
  var APPROVAL_ACTION_LABEL = { SUBMITTED: "Diajukan", APPROVED: "Disetujui", REJECTED: "Ditolak", RESET: "Dikembalikan ke Menunggu" };
  // No login gate — resolve a default identity for approval/activity records.
  // (sessionStorage is still honoured if something set it, but nothing does now.)
  function userName() { try { return sessionStorage.getItem(AUTH_KEY) || "surveyor01"; } catch (e) { return "surveyor01"; } }
  function ensureApproval(f) {
    if (!f.approval) {
      var t = f.createdAt || new Date().toISOString();
      f.approval = { status: "PENDING", submittedBy: userName(), submittedAt: t, reviewer: null, reviewedAt: null, note: "", history: [{ action: "SUBMITTED", by: userName(), at: t, note: "" }] };
    }
    if (!f.approval.history) f.approval.history = [];
    return f.approval;
  }
  function newApproval() {
    var now = new Date().toISOString();
    return { status: "PENDING", submittedBy: userName(), submittedAt: now, reviewer: null, reviewedAt: null, note: "", history: [{ action: "SUBMITTED", by: userName(), at: now, note: "" }] };
  }
  function setApproval(f, status, note) {
    var a = ensureApproval(f);
    var now = new Date().toISOString();
    a.status = status;
    if (status === "PENDING") { a.reviewer = null; a.reviewedAt = null; a.note = note || ""; }
    else { a.reviewer = userName(); a.reviewedAt = now; a.note = note || ""; }
    a.history.unshift({ action: status === "PENDING" ? "RESET" : status, by: userName(), at: now, note: note || "" });
    persist();
    logActivity("Approval — " + (APPROVAL_ACTION_LABEL[status === "PENDING" ? "RESET" : status]) + ": " + (f.title || "(tanpa judul)") + (note ? " — " + note : ""));
  }
  function apprCount(status) { return features.filter(function (f) { return ensureApproval(f).status === status; }).length; }

  /* ---------------- activity log (PRD F-4.10/F-4.11) ---------------- */
  function logActivity(action) {
    activity.unshift({ id: uid("act"), ts: Date.now(), action: action });
    if (activity.length > 200) activity = activity.slice(0, 200);
    store.set("activity", activity);
    updateRailBadges();
    if (state.view === "activity") renderPanel();
  }
  var HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  var BULAN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  var MONTH_FULL = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  function fmtWhen(ts) {
    var d = new Date(ts);
    var jam = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    return HARI[d.getDay()] + ", " + d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear() + " · " + jam;
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec));
    var hh = Math.floor(sec / 3600), mm = Math.round((sec % 3600) / 60);
    if (hh) return hh + " j " + mm + " mnt";
    if (mm) return mm + " mnt";
    return "<1 mnt";
  }

  /* =================================================================
     GEO MATH
     ================================================================= */
  function toRad(d) { return d * Math.PI / 180; }
  function haversine(a, b) {
    var R = 6371008.8;
    var dLat = toRad(b.lat - a.lat), dLon = toRad(b.lng - a.lng);
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function lineLengthM(ll) { var t = 0; for (var i = 1; i < ll.length; i++) t += haversine(ll[i - 1], ll[i]); return t; }
  function polygonAreaM2(ll) {
    var pts = ll.slice();
    if (pts.length > 2 && pts[0].lat === pts[pts.length - 1].lat && pts[0].lng === pts[pts.length - 1].lng) pts.pop();
    var n = pts.length;
    if (n < 3) return 0;
    var R = 6378137, area = 0;
    for (var i = 0; i < n; i++) {
      var p1 = pts[i], p2 = pts[(i + 1) % n];
      area += toRad(p2.lng - p1.lng) * (2 + Math.sin(toRad(p1.lat)) + Math.sin(toRad(p2.lat)));
    }
    return Math.abs(area * R * R / 2);
  }
  function fmtNum(n, dp) { return Number(n).toLocaleString("id-ID", { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); }
  function fmtArea(m2) {
    if (!m2) return "0 m²";
    var s = fmtNum(m2, 2) + " m²";
    if (m2 >= 10000) s += " (" + fmtNum(m2 / 10000, 2) + " ha)";
    return s;
  }
  function fmtLen(m) {
    if (!m) return "0 m";
    return m >= 1000 ? fmtNum(m / 1000, 2) + " km (" + fmtNum(m, 0) + " m)" : fmtNum(m, 1) + " m";
  }

  function geomToLatLngs(g) {
    if (!g) return [];
    if (g.type === "Point") return [{ lat: g.coordinates[1], lng: g.coordinates[0] }];
    if (g.type === "LineString") return g.coordinates.map(function (c) { return { lat: c[1], lng: c[0] }; });
    if (g.type === "Polygon") return g.coordinates[0].slice(0, -1).map(function (c) { return { lat: c[1], lng: c[0] }; });
    return [];
  }
  function latLngsToGeom(type, ll) {
    if (type === "Point") return { type: "Point", coordinates: [ll[0].lng, ll[0].lat] };
    if (type === "LineString") return { type: "LineString", coordinates: ll.map(function (p) { return [p.lng, p.lat]; }) };
    var ring = ll.map(function (p) { return [p.lng, p.lat]; });
    ring.push([ll[0].lng, ll[0].lat]);
    return { type: "Polygon", coordinates: [ring] };
  }
  function geomLabel(t) { return t === "Point" ? "Titik" : t === "LineString" ? "Garis" : "Poligon"; }
  function featureCentroid(f) {
    var ll = geomToLatLngs(f.geometry);
    var la = 0, lo = 0;
    ll.forEach(function (p) { la += p.lat; lo += p.lng; });
    return { lat: la / ll.length, lng: lo / ll.length };
  }

  /* =================================================================
     MAP
     ================================================================= */
  var map = L.map("map", { zoomControl: false, attributionControl: true }).setView([-6.284, 106.826], 13);
  L.control.zoom({ position: "topright" }).addTo(map);
  map.attributionControl.setPrefix("");

  var tileLayer = null;
  function setBasemap(key, quiet) {
    if (!BASEMAPS[key]) key = "kp_street";
    var changed = state.basemap !== key || !tileLayer;
    state.basemap = key;
    if (tileLayer) map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(BASEMAPS[key].url, BASEMAPS[key].opts).addTo(map);
    tileLayer.bringToBack();
    persist();
    renderBmPop();
    if (changed && !quiet) logActivity("Ganti peta dasar → " + BASEMAPS[key].name);
  }

  var featureLayer = L.layerGroup().addTo(map);   // saved features (read-only render)
  var poiLayer = L.layerGroup().addTo(map);       // POI layer
  var editLayer = null;                           // shape being drawn / edited
  var handleLayer = L.layerGroup().addTo(map);    // vertex / midpoint / track handles
  var drawTemp = null;                            // preview line/polygon while drawing
  var locateMarker = null;                        // search / generic pin
  var myLocMarker = null;                         // My Location balloon

  /* boundary overlay groups */
  var boundaryGroups = {};
  (function buildBoundaries() {
    BND_LEVELS.forEach(function (lv) {
      var g = L.layerGroup();
      var latStep = (BND_BBOX.n - BND_BBOX.s) / lv.div;
      var lngStep = (BND_BBOX.e - BND_BBOX.w) / lv.div;
      for (var r = 0; r < lv.div; r++) {
        for (var c = 0; c < lv.div; c++) {
          var s = BND_BBOX.s + r * latStep, w = BND_BBOX.w + c * lngStep;
          L.rectangle([[s, w], [s + latStep, w + lngStep]], {
            color: lv.color, weight: lv.weight, fill: false, dashArray: "5 4", interactive: false
          }).addTo(g);
        }
      }
      boundaryGroups[lv.key] = g;
    });
  })();
  function renderBoundaries() {
    BND_LEVELS.forEach(function (lv) {
      var on = !!state.boundary[lv.key];
      var g = boundaryGroups[lv.key];
      if (on && !map.hasLayer(g)) g.addTo(map);
      if (!on && map.hasLayer(g)) map.removeLayer(g);
    });
    var anyOn = BND_LEVELS.some(function (lv) { return state.boundary[lv.key]; });
    document.getElementById("bndBtn").classList.toggle("on", anyOn);
  }

  function renderPOIs() {
    poiLayer.clearLayers();
    if (!state.poiVisible) return;
    POIS.forEach(function (p) {
      L.circleMarker([p.lat, p.lng], { radius: 5, color: "#fff", weight: 1.5, fillColor: "#c9974a", fillOpacity: 1 })
        .bindPopup("<b>" + esc(p.name) + "</b><br>POI · " + esc(p.kind))
        .addTo(poiLayer);
    });
  }

  function styleFor(cls) { return { color: cls.color, weight: 3, fillColor: cls.color, fillOpacity: 0.18 }; }

  function renderFeatures() {
    featureLayer.clearLayers();
    features.forEach(function (f) {
      if (state.hidden[f.classificationId]) return;
      if (state.editing && !state.editing.isNew && state.editing.id === f.id) return; // hidden while editing
      var cls = clsById(f.classificationId);
      var ll = geomToLatLngs(f.geometry);
      var lyr;
      if (f.geometry.type === "Point") {
        lyr = L.circleMarker(ll[0], { radius: 7, color: "#fff", weight: 2, fillColor: cls.color, fillOpacity: 1 });
      } else if (f.geometry.type === "LineString") {
        lyr = L.polyline(ll, { color: cls.color, weight: 4 });
      } else {
        lyr = L.polygon(ll, styleFor(cls));
      }
      lyr.bindPopup("<b>" + esc(f.title) + "</b><br>" + esc(cls.name) +
        (f.geometry.type === "Polygon" ? "<br>Luas: " + fmtArea(polygonAreaM2(ll)) :
          f.geometry.type === "LineString" ? "<br>Panjang: " + fmtLen(lineLengthM(ll)) : ""));
      lyr.on("click", function (e) {
        if (state.drawType || state.editing || state.lineTrack || state.countdown != null) return;
        L.DomEvent.stopPropagation(e);
        state.view = "edit"; renderRail();
        openEditor(f);
      });
      featureLayer.addLayer(lyr);
    });
  }

  /* =================================================================
     MANUAL DRAWING (Edit Mode → "atau gambar manual")
     ================================================================= */
  function beginDraw(type) {
    cancelEditing(true);
    stopLineTrack(true);
    state.drawType = type;
    state.editing = { isNew: true, id: null, type: type, latlngs: [], feature: null, trackKind: null };
    map.getContainer().style.cursor = "crosshair";
    map.doubleClickZoom.disable();
    renderDrawDock();
    renderDrawHint();
    if (state.view !== "edit") { state.view = "edit"; renderRail(); }
    renderPanel();
    toast(type === "Point" ? "Klik di peta untuk menempatkan titik" : "Klik untuk menambah titik · klik dua kali / Enter untuk selesai");
  }
  function addDrawPoint(latlng) {
    var e = state.editing;
    if (state.drawType === "Point") { e.latlngs = [latlng]; finishDraw(); return; }
    e.latlngs.push(latlng);
    refreshDrawPreview();
    renderDrawHint();
    renderPanel();
  }
  function refreshDrawPreview() {
    if (drawTemp) { map.removeLayer(drawTemp); drawTemp = null; }
    handleLayer.clearLayers();
    var e = state.editing;
    if (!e || !e.latlngs.length) return;
    if (state.drawType === "Polygon" && e.latlngs.length >= 3) {
      drawTemp = L.polygon(e.latlngs, { color: "#163b54", weight: 2, dashArray: "4 4", fillOpacity: 0.08 });
    } else {
      drawTemp = L.polyline(e.latlngs, { color: "#163b54", weight: 2, dashArray: "4 4" });
    }
    drawTemp.addTo(map);
    e.latlngs.forEach(function (p) {
      L.marker(p, { icon: L.divIcon({ className: "vhandle", iconSize: [11, 11] }), interactive: false }).addTo(handleLayer);
    });
  }
  function finishDraw() {
    var e = state.editing;
    var need = state.drawType === "Point" ? 1 : state.drawType === "LineString" ? 2 : 3;
    if (!e || e.latlngs.length < need) { toast("Butuh minimal " + need + " titik", "err"); return; }
    var type = state.drawType;
    state.drawType = null;
    map.getContainer().style.cursor = "";
    if (drawTemp) { map.removeLayer(drawTemp); drawTemp = null; }
    renderDrawDock();
    renderDrawHint();
    openEditor({
      id: null, classificationId: state.collectionId, compartmentId: state.activeCompartment || null,
      title: "", description: "", address: "", images: [], privilege: "PUBLIC",
      geometry: latLngsToGeom(type, e.latlngs)
    }, true);
  }
  function cancelDraw() {
    state.drawType = null;
    map.getContainer().style.cursor = "";
    map.doubleClickZoom.enable();
    if (drawTemp) { map.removeLayer(drawTemp); drawTemp = null; }
    handleLayer.clearLayers();
    state.editing = null;
    renderDrawDock();
    renderDrawHint();
    renderPanel();
  }

  /* =================================================================
     MY LOCATION (PRD F-5.5 / F-5.6) — GPS reference balloon
     ================================================================= */
  function setMyLoc(latlng, acc) {
    state.myLoc = latlng;
    state.myLocAcc = acc || null;
    if (myLocMarker) map.removeLayer(myLocMarker);
    myLocMarker = L.marker(latlng, {
      icon: L.divIcon({ className: "myloc-balloon", html: "<i></i>", iconSize: [18, 18], iconAnchor: [9, 18] }),
      zIndexOffset: 500, interactive: true
    }).addTo(map).bindPopup("Posisi My Location (GPS)" + (acc ? "<br>akurasi &plusmn;" + Math.round(acc) + " m" : ""));
    updateRailBadges();
  }
  function requestMyLoc(cb) {
    toast("Mengambil posisi GPS …");
    var done = false;
    map.once("locationfound", function (e) { done = true; setMyLoc(e.latlng, e.accuracy); if (cb) cb(e.latlng); if (state.view === "edit") renderPanel(); });
    map.once("locationerror", function () {
      if (done) return;
      // Prototype fallback: no GPS on desktop → use current map centre.
      setMyLoc(map.getCenter(), null);
      toast("GPS tidak tersedia — memakai pusat peta sebagai My Location", "err");
      if (cb) cb(map.getCenter());
      if (state.view === "edit") renderPanel();
    });
    map.locate({ enableHighAccuracy: true, timeout: 8000, maximumAge: 5000 });
  }

  /* =================================================================
     TRACKING POINT (PRD F-5.3/F-5.4) — 10-second countdown
     ================================================================= */
  var CD_SECONDS = 10;
  var cdTimer = null;
  var cdOv = document.getElementById("countdownOv");
  function startTrackPoint() {
    if (state.countdown != null) return;
    cancelEditing(true);
    stopLineTrack(true);
    if (state.drawType) cancelDraw();
    state.countdown = CD_SECONDS;
    renderCountdown();
    cdTimer = setInterval(function () {
      state.countdown--;
      if (state.countdown <= 0) { finishTrackPoint(); }
      else renderCountdown();
    }, 1000);
    renderPanel();
  }
  function renderCountdown() {
    cdOv.hidden = false;
    cdOv.innerHTML =
      '<div class="cd-ring"><span class="cd-num">' + state.countdown + '</span></div>' +
      '<div class="cd-cap">Berdiri tepat di titik yang ingin direkam. Koordinat diambil saat hitungan mencapai 0.</div>' +
      '<button class="cd-cancel" id="cdCancel" type="button">Batalkan</button>';
    qs(cdOv, "#cdCancel").addEventListener("click", cancelTrackPoint);
  }
  function cancelTrackPoint() {
    clearInterval(cdTimer); cdTimer = null;
    state.countdown = null;
    cdOv.hidden = true; cdOv.innerHTML = "";
    renderPanel();
  }
  function finishTrackPoint() {
    clearInterval(cdTimer); cdTimer = null;
    state.countdown = null;
    cdOv.hidden = true; cdOv.innerHTML = "";
    var pt = state.myLoc || map.getCenter();
    if (!state.myLoc) toast("My Location belum diambil — memakai pusat peta", "err");
    logActivity("Tracking Point selesai (hitung mundur " + CD_SECONDS + " dtk)");
    openEditor({
      id: null, classificationId: state.collectionId, compartmentId: state.activeCompartment || null,
      title: "", description: "", address: "", images: [], privilege: "PUBLIC",
      geometry: latLngsToGeom("Point", [L.latLng(pt.lat, pt.lng)])
    }, true, "point");
  }

  /* =================================================================
     TRACKING LINE / POLYGON (PRD F-5.6 – F-5.10)
     ================================================================= */
  function startLineTrack(kind) {
    cancelEditing(true);
    if (state.drawType) cancelDraw();
    if (!state.myLoc) { toast("Ambil My Location dulu — titik awal harus menempel pada posisi Anda", "err"); return; }
    state.lineTrack = { kind: kind, pts: [L.latLng(state.myLoc.lat, state.myLoc.lng)] };
    if (state.view !== "edit") { state.view = "edit"; renderRail(); }
    drawLineTrack();
    renderPanel();
    toast("Titik awal ditandai. Gerak ke titik berikutnya lalu tekan “Tambah titik”, atau klik peta.");
  }
  function lineTrackAddCurrent() {
    if (!state.lineTrack) return;
    var p = state.myLoc || map.getCenter();
    state.lineTrack.pts.push(L.latLng(p.lat, p.lng));
    drawLineTrack();
    renderPanel();
  }
  function lineTrackAddAt(latlng) {
    if (!state.lineTrack) return;
    state.lineTrack.pts.push(latlng);
    drawLineTrack();
    renderPanel();
  }
  function lineTrackUndo() {
    if (!state.lineTrack || state.lineTrack.pts.length <= 1) return;
    state.lineTrack.pts.pop();
    drawLineTrack();
    renderPanel();
  }
  function drawLineTrack() {
    if (drawTemp) { map.removeLayer(drawTemp); drawTemp = null; }
    handleLayer.clearLayers();
    var lt = state.lineTrack;
    if (!lt) return;
    var pts = lt.pts;
    if (lt.kind === "Polygon" && pts.length >= 3) {
      drawTemp = L.polygon(pts, { color: "#2563eb", weight: 3, dashArray: "5 4", fillOpacity: 0.08 });
    } else if (pts.length >= 2) {
      drawTemp = L.polyline(pts, { color: "#2563eb", weight: 3, dashArray: "5 4" });
    }
    if (drawTemp) drawTemp.addTo(map);
    // start point = blue balloon (F-5.6); subsequent points = markers (F-5.8)
    pts.forEach(function (p, i) {
      if (i === 0) {
        L.marker(p, { icon: L.divIcon({ className: "myloc-balloon", html: "<i></i>", iconSize: [18, 18], iconAnchor: [9, 18] }), interactive: false }).addTo(handleLayer);
      } else {
        L.marker(p, { icon: L.divIcon({ className: "vhandle", iconSize: [12, 12] }), interactive: false }).addTo(handleLayer);
      }
    });
  }
  function stopLineTrack(silent) {
    if (!state.lineTrack) return;
    state.lineTrack = null;
    if (drawTemp) { map.removeLayer(drawTemp); drawTemp = null; }
    handleLayer.clearLayers();
    if (!silent) renderPanel();
  }
  function finishLineTrack() {
    var lt = state.lineTrack;
    if (!lt) return;
    var need = lt.kind === "Polygon" ? 3 : 2;
    if (lt.pts.length < need) { toast("Butuh minimal " + need + " titik", "err"); return; }
    var kind = lt.kind, pts = lt.pts.slice();
    var lenM = lineLengthM(pts);
    stopLineTrack(true);
    if (kind === "Polygon") logActivity("Tracking Polygon selesai · " + fmtArea(polygonAreaM2(pts)));
    else logActivity("Tracking Line selesai · " + fmtLen(lenM));
    openEditor({
      id: null, classificationId: state.collectionId, compartmentId: state.activeCompartment || null,
      title: "", description: "", address: "", images: [], privilege: "PUBLIC",
      geometry: latLngsToGeom(kind, pts)
    }, true, kind === "Polygon" ? "polygon" : "line");
  }

  /* =================================================================
     EDIT AN EXISTING / JUST-CAPTURED SHAPE
     ================================================================= */
  function openEditor(feature, isNew, trackKind) {
    state.drawType = null;
    map.getContainer().style.cursor = "";
    map.doubleClickZoom.enable();
    state.shapeMode = feature.geometry.type === "Point" ? "move" : "vertex";
    state.editing = {
      isNew: !!isNew, id: feature.id || null, type: feature.geometry.type,
      latlngs: geomToLatLngs(feature.geometry), feature: feature, trackKind: trackKind || null
    };
    if (state.view !== "edit") { state.view = "edit"; renderRail(); }
    renderFeatures();
    mountEditShape();
    renderDrawDock();
    renderDrawHint();
    renderPanel();
  }
  function mountEditShape() {
    if (editLayer) { map.removeLayer(editLayer); editLayer = null; }
    handleLayer.clearLayers();
    var e = state.editing;
    if (!e) return;
    var cls = clsById((e.feature && e.feature.classificationId) || state.collectionId);
    if (e.type === "Point") {
      editLayer = L.marker(e.latlngs[0], { draggable: true, icon: L.divIcon({ className: "vhandle", iconSize: [16, 16] }) });
      editLayer.on("drag", function (ev) { e.latlngs = [ev.target.getLatLng()]; updateReadout(); });
      editLayer.on("dragend", commitEditGeom);
      editLayer.addTo(map);
    } else if (e.type === "LineString") {
      editLayer = L.polyline(e.latlngs, { color: cls.color, weight: 4 }).addTo(map);
    } else {
      editLayer = L.polygon(e.latlngs, styleFor(cls)).addTo(map);
    }
    renderHandles();
  }
  function renderHandles() {
    handleLayer.clearLayers();
    var e = state.editing;
    if (!e || e.type === "Point") return;
    var mode = state.shapeMode;
    e.latlngs.forEach(function (p, i) {
      var cn = "vhandle" + (mode === "delete" ? " del" : "");
      var m = L.marker(p, {
        draggable: mode === "vertex" || mode === "move",
        icon: L.divIcon({ className: cn, iconSize: [14, 14] })
      });
      m.on("drag", function (ev) {
        var np = ev.target.getLatLng();
        if (mode === "move") {
          var d = { lat: np.lat - e.latlngs[i].lat, lng: np.lng - e.latlngs[i].lng };
          e.latlngs = e.latlngs.map(function (q) { return L.latLng(q.lat + d.lat, q.lng + d.lng); });
        } else { e.latlngs[i] = np; }
        editLayer.setLatLngs(e.latlngs);
        updateReadout();
        if (mode === "move") renderHandles();
      });
      m.on("dragend", commitEditGeom);
      m.on("click", function (ev) {
        L.DomEvent.stopPropagation(ev);
        if (mode !== "delete") return;
        var min = e.type === "LineString" ? 2 : 3;
        if (e.latlngs.length <= min) { toast("Titik minimum tercapai", "err"); return; }
        e.latlngs.splice(i, 1);
        editLayer.setLatLngs(e.latlngs);
        commitEditGeom();
        renderHandles();
      });
      handleLayer.addLayer(m);
    });
    if (mode === "addvertex") {
      var n = e.latlngs.length;
      var segs = e.type === "Polygon" ? n : n - 1;
      for (var s = 0; s < segs; s++) {
        (function (idx) {
          var a = e.latlngs[idx], b = e.latlngs[(idx + 1) % n];
          var mid = L.latLng((a.lat + b.lat) / 2, (a.lng + b.lng) / 2);
          var m = L.marker(mid, { icon: L.divIcon({ className: "vhandle mid", iconSize: [12, 12] }) });
          m.on("click", function (ev) {
            L.DomEvent.stopPropagation(ev);
            e.latlngs.splice(idx + 1, 0, mid);
            editLayer.setLatLngs(e.latlngs);
            commitEditGeom();
            renderHandles();
          });
          handleLayer.addLayer(m);
        })(s);
      }
    }
  }
  function updateReadout() {
    var e = state.editing;
    if (!e) return;
    var box = document.getElementById("qnBox");
    if (box) box.innerHTML = questionnaireRows(e);
  }
  function commitEditGeom() {
    var e = state.editing;
    if (!e) return;
    e.feature.geometry = latLngsToGeom(e.type, e.latlngs);
    updateReadout();
  }
  function cancelEditing(silent) {
    if (state.drawType) { cancelDraw(); return; }
    if (!state.editing) return;
    state.editing = null;
    if (editLayer) { map.removeLayer(editLayer); editLayer = null; }
    handleLayer.clearLayers();
    renderFeatures();
    renderDrawDock();
    renderDrawHint();
    if (!silent) renderPanel();
  }

  /* map click routing */
  map.on("click", function (e) {
    if (state.drawType) { addDrawPoint(e.latlng); return; }
    if (state.lineTrack) { lineTrackAddAt(e.latlng); return; }
  });
  map.on("dblclick", function () { if (state.drawType && state.drawType !== "Point") finishDraw(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && state.drawType && state.drawType !== "Point") { e.preventDefault(); finishDraw(); }
    else if (e.key === "Enter" && state.lineTrack) { e.preventDefault(); finishLineTrack(); }
    else if (e.key === "Escape") {
      if (state.countdown != null) cancelTrackPoint();
      else if (state.drawType) cancelDraw();
      else if (state.lineTrack) stopLineTrack();
      else if (state.editing) cancelEditing();
    }
  });

  /* =================================================================
     RAIL — PRD Main Menu (4) + Edit Mode (4) + About
     ================================================================= */
  var RAIL = [
    { id: "public", icon: "folder", label: "Public Mapping" },
    { id: "mylayers", icon: "shapes", label: "My Layers" },
    { id: "approval", icon: "approval", label: "Approval" },
    { sep: true },
    { id: "edit", icon: "edit", label: "Edit Mode - Tracking" },
    { id: "task", icon: "task", label: "Task" },
    { sep: true },
    { id: "activity", icon: "clock", label: "Activity" }
  ];
  var railEl = document.getElementById("rail");
  function renderRail() {
    railEl.innerHTML = RAIL.map(function (r) {
      if (r.sep) return '<div class="rail-sep"></div>';
      return '<button class="rail-btn' + (state.view === r.id ? " active" : "") + '" data-view="' + r.id + '" type="button" aria-label="' + esc(r.label) + '">' +
        svg(r.icon) + '<span class="badge" data-badge="' + r.id + '" hidden></span>' +
        '<span class="tip">' + esc(r.label) + '</span></button>';
    }).join("");
    qsa(railEl, ".rail-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = b.getAttribute("data-view");
        if (v !== "edit") { if (state.editing) cancelEditing(true); if (state.drawType) cancelDraw(); if (state.lineTrack) stopLineTrack(true); }
        state.view = v;
        state.wcCreating = false;
        persist();
        renderRail();
        renderPanel();
        if (state.dockCollapsed) setDockCollapsed(false); // tapping a nav item reveals its panel
      });
    });
    updateRailBadges();
  }
  function updateRailBadges() {
    var unfinished = tasks.filter(function (t) { return !t.done; }).length;
    qsa(railEl, '[data-badge="task"]').forEach(function (b) { b.hidden = !unfinished; b.textContent = unfinished; });
    var pending = apprCount("PENDING");
    qsa(railEl, '[data-badge="approval"]').forEach(function (b) { b.hidden = !pending; b.textContent = pending; });
  }

  /* =================================================================
     DOCK — top area (search / collection) + panel body
     ================================================================= */
  var dockEl = document.getElementById("dock");
  var dockTop = document.getElementById("dockTop");
  var panelBody = document.getElementById("panelBody");

  var panelToggleBtn = document.getElementById("panelToggle");
  function setDockCollapsed(collapsed) {
    state.dockCollapsed = collapsed;
    dockEl.classList.toggle("collapsed", collapsed);
    panelToggleBtn.classList.toggle("on", collapsed);
    persist();
    setTimeout(function () { map.invalidateSize(); }, 240);
  }
  document.getElementById("dockTab").addEventListener("click", function () { setDockCollapsed(!state.dockCollapsed); });
  panelToggleBtn.addEventListener("click", function () { setDockCollapsed(!state.dockCollapsed); });
  dockEl.classList.toggle("collapsed", state.dockCollapsed);
  panelToggleBtn.classList.toggle("on", state.dockCollapsed);

  function renderDockTop() {
    var showSearch = state.view === "public" || state.view === "mylayers" || state.view === "edit";
    var showCollection = state.view === "edit";
    if (!showSearch) { dockTop.innerHTML = ""; return; }
    var cls = clsById(state.collectionId);
    dockTop.innerHTML =
      '<div class="search-row">' +
        '<form class="search-box" id="searchForm">' + svg("search") +
          '<input id="searchInput" type="text" placeholder="Cari lokasi, objek, atau \'lat, lon\' …" autocomplete="off" />' +
        '</form>' +
        '<button class="icon-btn primary" id="searchGo" type="button" title="Cari" aria-label="Cari">' + svg("search") + '</button>' +
        '<button class="icon-btn" id="fsBtn" type="button" title="Layar penuh" aria-label="Layar penuh">' + svg("expand") + '</button>' +
      '</div>' +
      (showCollection ?
        '<details class="card collection" id="collectionCard">' +
          '<summary>' +
            '<span class="swatch" style="background:' + cls.color + '">' + svg(cls.icon) + '</span>' +
            '<span><span class="c-name">' + esc(cls.name) + '</span><br><span class="c-desc">' + esc(cls.desc) + '</span></span>' +
            '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>' +
          '</summary>' +
          '<div class="opts">' +
            classifications.map(function (c) {
              return '<div class="opt' + (c.id === state.collectionId ? " sel" : "") + '" data-cls="' + c.id + '">' +
                '<span class="dot" style="background:' + c.color + '"></span>' + esc(c.name) + '</div>';
            }).join("") +
          '</div>' +
        '</details>' : "");

    qs(dockTop, "#searchForm").addEventListener("submit", function (e) { e.preventDefault(); runSearch(); });
    qs(dockTop, "#searchGo").addEventListener("click", runSearch);
    qs(dockTop, "#fsBtn").addEventListener("click", toggleFullscreen);
    if (qs(dockTop, "#collectionCard")) {
      qsa(dockTop, ".collection .opt").forEach(function (o) {
        o.addEventListener("click", function () {
          state.collectionId = o.getAttribute("data-cls");
          persist();
          qs(dockTop, "#collectionCard").open = false;
          renderDockTop();
          if (state.editing && state.editing.isNew) {
            state.editing.feature.classificationId = state.collectionId;
            renderPanel();
            mountEditShape();
          }
        });
      });
    }
  }

  function runSearch() {
    var inp = document.getElementById("searchInput");
    var q = (inp && inp.value || "").trim();
    if (!q) return;
    var m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (m) {
      var la = parseFloat(m[1]), lo = parseFloat(m[2]);
      if (Math.abs(la) <= 90 && Math.abs(lo) <= 180) {
        map.flyTo([la, lo], 16);
        dropPin([la, lo], la.toFixed(5) + ", " + lo.toFixed(5));
        return;
      }
    }
    var hit = features.filter(function (f) {
      return (f.title + " " + (f.address || "")).toLowerCase().indexOf(q.toLowerCase()) >= 0;
    })[0];
    if (hit) { zoomToFeature(hit); state.view = "edit"; renderRail(); openEditor(hit); return; }
    toast("Mencari “" + q + "” …");
    fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q), { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (arr) {
        if (arr && arr.length) {
          var r0 = arr[0];
          map.flyTo([parseFloat(r0.lat), parseFloat(r0.lon)], 15);
          dropPin([parseFloat(r0.lat), parseFloat(r0.lon)], r0.display_name);
        } else { toast("Lokasi tidak ditemukan", "err"); }
      })
      .catch(function () { toast("Pencarian lokasi tidak tersedia — coba ‘lat, lon’ atau nama objek", "err"); });
  }
  function dropPin(ll, label) {
    if (locateMarker) map.removeLayer(locateMarker);
    locateMarker = L.marker(ll).addTo(map).bindPopup(esc(label)).openPopup();
  }
  function zoomToFeature(f) {
    var ll = geomToLatLngs(f.geometry);
    if (f.geometry.type === "Point") map.flyTo(ll[0], 16);
    else map.flyToBounds(L.latLngBounds(ll), { padding: [60, 60], maxZoom: 16 });
  }
  function toggleFullscreen() {
    var el = document.documentElement;
    if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); }
    else { (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document); }
  }

  /* =================================================================
     DRAW DOCK + HINT + COUNTDOWN visibility
     ================================================================= */
  var drawDockEl = document.getElementById("drawDock");
  var drawHintEl = document.getElementById("drawHint");
  var DRAW_TOOLS = [
    { t: "Point", icon: "point", label: "Titik" },
    { t: "LineString", icon: "line", label: "Garis" },
    { t: "Polygon", icon: "polygon", label: "Poligon" }
  ];
  function renderDrawDock() {
    drawDockEl.innerHTML = DRAW_TOOLS.map(function (d) {
      var active = state.drawType === d.t;
      return '<button type="button" class="' + (active ? "active" : "") + '" data-t="' + d.t + '">' + svg(d.icon) + d.label + '</button>';
    }).join("");
    qsa(drawDockEl, "button").forEach(function (b) {
      b.addEventListener("click", function () {
        var t = b.getAttribute("data-t");
        if (state.drawType === t) cancelDraw();
        else beginDraw(t);
      });
    });
  }
  function renderDrawHint() {
    if (state.lineTrack) {
      var lt = state.lineTrack;
      drawHintEl.hidden = false;
      drawHintEl.innerHTML = '<span>' + geomLabel(lt.kind) + ' · ' + lt.pts.length + ' titik · ' +
        (lt.kind === "Polygon" && lt.pts.length >= 3 ? fmtArea(polygonAreaM2(lt.pts)) : fmtLen(lineLengthM(lt.pts))) + '</span>' +
        '<button class="h-done" type="button" id="hDone">Selesai</button>' +
        '<button class="h-cancel" type="button" id="hCancel">Batal</button>';
      qs(drawHintEl, "#hDone").addEventListener("click", finishLineTrack);
      qs(drawHintEl, "#hCancel").addEventListener("click", function () { stopLineTrack(); });
      return;
    }
    if (!state.drawType || state.drawType === "Point") { drawHintEl.hidden = true; drawHintEl.innerHTML = ""; return; }
    var n = state.editing ? state.editing.latlngs.length : 0;
    drawHintEl.hidden = false;
    drawHintEl.innerHTML = '<span>' + geomLabel(state.drawType) + ' · ' + n + ' titik</span>' +
      '<button class="h-done" type="button" id="hDone">Selesai</button>' +
      '<button class="h-cancel" type="button" id="hCancel">Batal</button>';
    qs(drawHintEl, "#hDone").addEventListener("click", finishDraw);
    qs(drawHintEl, "#hCancel").addEventListener("click", cancelDraw);
  }

  /* =================================================================
     PANEL DISPATCH
     ================================================================= */
  function renderPanel() {
    renderDockTop();
    var editView = state.view === "edit";
    drawDockEl.hidden = !editView || state.countdown != null;
    if (!editView) drawHintEl.hidden = true;
    else renderDrawHint();

    document.getElementById("wcFab").hidden = !(state.view === "public");

    if (state.view === "mylayers") renderMyLayersPanel();
    else if (state.view === "approval") renderApprovalPanel();
    else if (state.view === "activity") renderActivityPanel();
    else if (state.view === "edit") renderEditPanel();
    else if (state.view === "task") renderTaskPanel();
    else renderPublicPanel();
    updateWcChip();
  }

  function questionnaireRows(e) {
    if (e.type === "Polygon") {
      return '<div class="qn-row"><span class="qn-k">Area</span><span class="qn-v mono">' + fmtArea(polygonAreaM2(e.latlngs)) + '</span></div>' +
        '<div class="qn-row"><span class="qn-k">Keliling</span><span class="qn-v mono">' + fmtLen(lineLengthM(e.latlngs.concat([e.latlngs[0]]))) + '</span></div>' +
        '<div class="qn-row"><span class="qn-k">Jumlah titik</span><span class="qn-v mono">' + e.latlngs.length + '</span></div>';
    }
    if (e.type === "LineString") {
      var lenM = lineLengthM(e.latlngs);
      return '<div class="qn-row"><span class="qn-k">Panjang lintasan</span><span class="qn-v mono">' + fmtLen(lenM) + '</span></div>' +
        '<div class="qn-row"><span class="qn-k">Est. waktu tempuh (jalan kaki)</span><span class="qn-v mono">' + fmtDur(lenM / (4.5 * 1000 / 3600)) + '</span></div>' +
        '<div class="qn-row"><span class="qn-k">Jumlah titik</span><span class="qn-v mono">' + e.latlngs.length + '</span></div>';
    }
    var p = e.latlngs[0];
    return '<div class="qn-row"><span class="qn-k">Latitude</span><span class="qn-v mono">' + p.lat.toFixed(6) + '</span></div>' +
      '<div class="qn-row"><span class="qn-k">Longitude</span><span class="qn-v mono">' + p.lng.toFixed(6) + '</span></div>' +
      (state.myLocAcc ? '<div class="qn-row"><span class="qn-k">Akurasi GPS</span><span class="qn-v mono">&plusmn;' + Math.round(state.myLocAcc) + ' m</span></div>' : "");
  }

  /* =================================================================
     QUESTIONNAIRE — structured per-feature survey form (PRD F-4.x).
     An illustrative "tempat usaha / fasilitas" template modeled on the
     production Geomapping questionnaire (owner, operating hours, contact,
     founding date, administrative address). Answers persist on the
     feature under `f.questionnaire`, keyed by question id; group answers
     nest one level: f.questionnaire[groupId][itemId]. Opened from the
     "Edit" button on step 3 of the editor form via a modal dialog with
     a Wizard (one question at a time) / Scroll View toggle.
     ================================================================= */
  var QUESTIONNAIRE = [
    { id: "owner", label: "Nama Pemilik", hint: "Nama pemilik", type: "text" },
    { id: "hours", label: "Jam Operasi", hint: "Jam operasional per hari", type: "group", items: [
      { id: "mon", label: "Senin", type: "text" },
      { id: "tue", label: "Selasa", type: "text" },
      { id: "wed", label: "Rabu", type: "text" },
      { id: "thu", label: "Kamis", type: "text" },
      { id: "fri", label: "Jumat", type: "text" },
      { id: "sat", label: "Sabtu", type: "text" },
      { id: "sun", label: "Minggu", type: "text" }
    ] },
    { id: "phone", label: "Nomor Telefon", hint: "Phone number", type: "text" },
    { id: "website", label: "Website", hint: "Website", type: "text" },
    { id: "founded", label: "Tanggal Berdiri", hint: "Tanggal berdiri", type: "date" },
    { id: "addr", label: "Alamat", hint: "Alamat lokasi", type: "group", items: [
      { id: "street", label: "Jalan", type: "text" },
      { id: "rtrw", label: "RT/RW", type: "text" },
      { id: "kel", label: "Kelurahan", type: "text" },
      { id: "kec", label: "Kecamatan", type: "text" },
      { id: "kota", label: "Kota/Kabupaten", type: "text" },
      { id: "prov", label: "Propinsi", type: "text" },
      { id: "pos", label: "Kode Pos", type: "text" }
    ] }
  ];

  function qnFieldCount() {
    var n = 0;
    QUESTIONNAIRE.forEach(function (q) { n += q.type === "group" ? q.items.length : 1; });
    return n;
  }
  function qnAnsweredCount(data) {
    data = data || {};
    var n = 0;
    QUESTIONNAIRE.forEach(function (q) {
      if (q.type === "group") {
        var g = data[q.id] || {};
        q.items.forEach(function (it) { if (g[it.id] != null && String(g[it.id]).trim()) n++; });
      } else if (data[q.id] != null && String(data[q.id]).trim()) n++;
    });
    return n;
  }
  function fmtDateID(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
    if (!m) return String(iso || "");
    return (+m[3]) + " " + MONTH_FULL[+m[2] - 1] + " " + m[1];
  }
  function questionnaireSummary(f) {
    var data = (f && f.questionnaire) || {};
    var total = qnFieldCount();
    var done = qnAnsweredCount(data);
    if (!done) return '<div class="muted">Belum ada jawaban kuesioner. Ketuk <b>Edit</b> untuk mengisi ' + total + ' pertanyaan.</div>';
    var rows = [];
    QUESTIONNAIRE.forEach(function (q) {
      if (q.type === "group") {
        var g = data[q.id] || {};
        q.items.forEach(function (it) {
          var v = g[it.id];
          if (v != null && String(v).trim()) rows.push({ k: q.label + " · " + it.label, v: String(v) });
        });
      } else {
        var v = data[q.id];
        if (v != null && String(v).trim()) rows.push({ k: q.label, v: q.type === "date" ? fmtDateID(v) : String(v) });
      }
    });
    var shown = rows.slice(0, 4).map(function (r) {
      return '<div class="qn-row"><span class="qn-k">' + esc(r.k) + '</span><span class="qn-v">' + esc(r.v) + '</span></div>';
    }).join("");
    var more = rows.length > 4
      ? '<div class="qn-row"><span class="qn-k">…</span><span class="qn-v">+' + (rows.length - 4) + ' jawaban lain</span></div>'
      : "";
    return '<div class="qn-row"><span class="qn-k">Kelengkapan</span><span class="qn-v mono">' + done + ' / ' + total + '</span></div>' + shown + more;
  }

  var qdlgEl = null;
  var qdlg = { mode: "scroll", step: 0, feature: null, draft: null, calView: null };

  function openQuestionnaireDialog(feature) {
    if (qdlgEl) return;
    qdlg.feature = feature;
    qdlg.mode = "scroll";
    qdlg.step = 0;
    qdlg.calView = {};
    try { qdlg.draft = JSON.parse(JSON.stringify(feature.questionnaire || {})); }
    catch (e) { qdlg.draft = {}; }

    qdlgEl = document.createElement("div");
    qdlgEl.className = "qdlg-backdrop";
    qdlgEl.innerHTML =
      '<div class="qdlg" role="dialog" aria-modal="true" aria-label="Kuesioner objek">' +
        '<div class="qdlg-head">' +
          '<span class="qdlg-req">* Wajib diisi</span>' +
          '<span class="grow"></span>' +
          '<div class="qdlg-seg" id="qdMode">' +
            '<button type="button" data-m="wizard">' + svg("sliders") + ' Wizard</button>' +
            '<button type="button" data-m="scroll">Tampilan Gulir</button>' +
          '</div>' +
          '<button class="qdlg-x" id="qdClose" type="button" aria-label="Tutup dialog">' + svg("close") + '</button>' +
        '</div>' +
        '<div class="qdlg-body" id="qdBody"></div>' +
        '<div class="qdlg-foot">' +
          '<div class="qdlg-wiznav" id="qdWizNav" hidden>' +
            '<button class="btn btn-ghost" id="qdPrev" type="button">' + svg("chevL") + ' Sebelumnya</button>' +
            '<span id="qdStepLabel"></span>' +
            '<button class="btn btn-ghost" id="qdNext" type="button">Berikutnya ' + svg("chevR") + '</button>' +
          '</div>' +
          '<span class="grow"></span>' +
          '<button class="btn btn-save" id="qdSave" type="button">' + svg("check") + ' Simpan</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(qdlgEl);

    qdlgEl.addEventListener("mousedown", function (ev) { if (ev.target === qdlgEl) closeQuestionnaireDialog(); });
    qs(qdlgEl, "#qdClose").addEventListener("click", closeQuestionnaireDialog);
    qs(qdlgEl, "#qdSave").addEventListener("click", saveQuestionnaireDialog);
    qsa(qdlgEl, "#qdMode button").forEach(function (b) {
      b.addEventListener("click", function () { qdlg.mode = b.getAttribute("data-m"); qdlg.step = 0; renderQdlg(); });
    });
    qs(qdlgEl, "#qdPrev").addEventListener("click", function () { if (qdlg.step > 0) { qdlg.step--; renderQdlg(); } });
    qs(qdlgEl, "#qdNext").addEventListener("click", function () { if (qdlg.step < QUESTIONNAIRE.length - 1) { qdlg.step++; renderQdlg(); } });
    // capture phase + stopImmediatePropagation so Esc closes only the dialog,
    // not the editor behind it (the global keydown handler calls cancelEditing on Esc)
    document.addEventListener("keydown", qdlgKey, true);
    renderQdlg();
  }
  function qdlgKey(ev) {
    if (ev.key === "Escape" && qdlgEl) { ev.preventDefault(); ev.stopImmediatePropagation(); closeQuestionnaireDialog(); }
  }
  function closeQuestionnaireDialog() {
    if (!qdlgEl) return;
    document.removeEventListener("keydown", qdlgKey, true);
    qdlgEl.remove(); qdlgEl = null;
    qdlg.feature = null; qdlg.draft = null; qdlg.calView = null;
  }

  function qdlgSet(path, val) {
    var p = path.split("/");
    if (p.length === 2) {
      if (!qdlg.draft[p[0]] || typeof qdlg.draft[p[0]] !== "object") qdlg.draft[p[0]] = {};
      qdlg.draft[p[0]][p[1]] = val;
    } else {
      qdlg.draft[path] = val;
    }
  }
  function qdlgGet(path) {
    var p = path.split("/");
    if (p.length === 2) return (qdlg.draft[p[0]] || {})[p[1]] || "";
    return qdlg.draft[path] || "";
  }

  function renderQdlg() {
    if (!qdlgEl) return;
    qsa(qdlgEl, "#qdMode button").forEach(function (b) { b.classList.toggle("sel", b.getAttribute("data-m") === qdlg.mode); });
    var wizard = qdlg.mode === "wizard";
    var body = qs(qdlgEl, "#qdBody");
    if (wizard) {
      body.innerHTML = qqHtml(QUESTIONNAIRE[qdlg.step], qdlg.step + 1);
    } else {
      body.innerHTML = QUESTIONNAIRE.map(function (q, i) { return qqHtml(q, i + 1); }).join("");
    }
    var nav = qs(qdlgEl, "#qdWizNav");
    nav.hidden = !wizard;
    if (wizard) {
      qs(qdlgEl, "#qdStepLabel").textContent = "Langkah " + (qdlg.step + 1) + " / " + QUESTIONNAIRE.length;
      qs(qdlgEl, "#qdPrev").disabled = qdlg.step === 0;
      qs(qdlgEl, "#qdNext").disabled = qdlg.step === QUESTIONNAIRE.length - 1;
    }
    wireQqInputs(body);
    body.scrollTop = 0;
  }

  function qqHtml(q, num, parentId) {
    var head =
      '<div class="qq-head">' +
        '<span class="qq-num' + (parentId ? " sub" : "") + '">' + num + '</span>' +
        '<span><span class="qq-label">' + esc(q.label) + '</span>' +
        (q.hint ? '<span class="qq-hint">(' + esc(q.hint) + ')</span>' : "") + '</span>' +
      '</div>';
    if (q.type === "group") {
      var sub = q.items.map(function (it, i) { return qqHtml(it, num + "." + (i + 1), q.id); }).join("");
      return '<div class="qq">' + head + '<div class="qq-sub">' + sub + '</div></div>';
    }
    var path = parentId ? parentId + "/" + q.id : q.id;
    var val = qdlgGet(path);
    if (q.type === "date") {
      return '<div class="qq">' + head + '<div class="qq-input" data-cal="' + esc(path) + '">' + qcalHtml(val, path) + '</div></div>';
    }
    return '<div class="qq">' + head +
      '<div class="qq-input"><input type="text" data-path="' + esc(path) + '" value="' + esc(val) + '" placeholder="Isi jawaban" /></div>' +
      '</div>';
  }
  function wireQqInputs(root) {
    qsa(root, "input[data-path]").forEach(function (inp) {
      inp.addEventListener("input", function () { qdlgSet(inp.getAttribute("data-path"), inp.value); });
    });
    qsa(root, "[data-cal]").forEach(function (box) { wireQcal(box, box.getAttribute("data-cal")); });
  }

  /* compact inline date picker — matches the reference dialog's expanded calendar */
  var QCAL_DOW = ["Sn", "Sl", "Rb", "Km", "Jm", "Sb", "Mg"];
  function qcalHtml(iso, path) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
    var view = (qdlg.calView && qdlg.calView[path]) || null;
    var vy, vm;
    if (view) { vy = view.y; vm = view.m; }
    else if (m) { vy = +m[1]; vm = +m[2] - 1; }
    else { var t = new Date(); vy = t.getFullYear(); vm = t.getMonth(); }

    var startDow = (new Date(vy, vm, 1).getDay() + 6) % 7;   // Mon = 0
    var daysInMonth = new Date(vy, vm + 1, 0).getDate();
    var prevDays = new Date(vy, vm, 0).getDate();
    var cells = "";
    for (var i = 0; i < 42; i++) {
      var dayNum, out = false, cy = vy, cm = vm;
      if (i < startDow) { dayNum = prevDays - startDow + 1 + i; out = true; cm = vm - 1; if (cm < 0) { cm = 11; cy = vy - 1; } }
      else if (i >= startDow + daysInMonth) { dayNum = i - startDow - daysInMonth + 1; out = true; cm = vm + 1; if (cm > 11) { cm = 0; cy = vy + 1; } }
      else { dayNum = i - startDow + 1; }
      var cIso = cy + "-" + ("0" + (cm + 1)).slice(-2) + "-" + ("0" + dayNum).slice(-2);
      cells += '<button type="button" class="qcal-day' + (out ? " out" : "") + (iso && cIso === iso ? " sel" : "") +
        '" data-iso="' + cIso + '">' + dayNum + '</button>';
      if (i >= startDow + daysInMonth - 1 && i % 7 === 6) break;
    }
    return '<div class="qcal">' +
      '<div class="qcal-top">' +
        '<button class="qcal-nav" data-nav="-1" type="button" aria-label="Bulan sebelumnya">' + svg("chevL") + '</button>' +
        '<span class="grow"></span>' +
        '<span class="qcal-my">' + MONTH_FULL[vm] + ' ' + vy + '</span>' +
        '<span class="grow"></span>' +
        '<button class="qcal-nav" data-nav="1" type="button" aria-label="Bulan berikutnya">' + svg("chevR") + '</button>' +
      '</div>' +
      '<div class="qcal-grid">' + QCAL_DOW.map(function (d) { return '<span class="qcal-dow">' + d + '</span>'; }).join("") + cells + '</div>' +
      (iso ? '<button class="btn btn-ghost qcal-clear" data-clear="1" type="button">Kosongkan tanggal</button>' : "") +
      '</div>';
  }
  function wireQcal(box, path) {
    function redraw() { box.innerHTML = qcalHtml(qdlgGet(path), path); wireQcal(box, path); }
    qsa(box, "[data-nav]").forEach(function (b) {
      b.addEventListener("click", function () {
        var cur = (qdlg.calView && qdlg.calView[path]) || null, base;
        var g = /^(\d{4})-(\d{2})-(\d{2})$/.exec(qdlgGet(path));
        if (cur) base = new Date(cur.y, cur.m, 1);
        else if (g) base = new Date(+g[1], +g[2] - 1, 1);
        else base = new Date();
        base.setMonth(base.getMonth() + (+b.getAttribute("data-nav")));
        qdlg.calView = qdlg.calView || {};
        qdlg.calView[path] = { y: base.getFullYear(), m: base.getMonth() };
        redraw();
      });
    });
    qsa(box, "[data-iso]").forEach(function (b) {
      b.addEventListener("click", function () {
        var iso = b.getAttribute("data-iso");
        qdlgSet(path, iso);
        var mm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
        qdlg.calView = qdlg.calView || {};
        qdlg.calView[path] = { y: +mm[1], m: +mm[2] - 1 };
        redraw();
      });
    });
    var clr = qs(box, "[data-clear]");
    if (clr) clr.addEventListener("click", function () { qdlgSet(path, ""); redraw(); });
  }

  function saveQuestionnaireDialog() {
    if (!qdlg.feature) return;
    var clean = {};
    QUESTIONNAIRE.forEach(function (q) {
      if (q.type === "group") {
        var g = qdlg.draft[q.id] || {}, out = {};
        q.items.forEach(function (it) { var v = String(g[it.id] == null ? "" : g[it.id]).trim(); if (v) out[it.id] = v; });
        if (Object.keys(out).length) clean[q.id] = out;
      } else {
        var v = String(qdlg.draft[q.id] == null ? "" : qdlg.draft[q.id]).trim();
        if (v) clean[q.id] = v;
      }
    });
    qdlg.feature.questionnaire = clean;
    if (qdlg.feature.id && features.some(function (x) { return x.id === qdlg.feature.id; })) {
      persist();
      logActivity("Kuesioner diperbarui: " + (qdlg.feature.title || "(tanpa judul)"));
    }
    var sum = document.getElementById("qnSummary");
    if (sum) sum.innerHTML = questionnaireSummary(qdlg.feature);
    var btn = document.getElementById("qnEdit");
    if (btn) btn.innerHTML = svg("edit") + " Edit (" + qnAnsweredCount(clean) + "/" + qnFieldCount() + ")";
    toast("Jawaban kuesioner disimpan", "ok");
    closeQuestionnaireDialog();
  }

      '<div class="step">' +
        '<div class="step-head"><span class="step-title">Sunting Bentuk</span>' +
          '<span style="flex:1"></span><span class="c-desc" style="font-size:.7rem;color:var(--text-faint)">' + geomLabel(e.type) + '</span></div>' +

          shapeToolBtn("move", "move", "Geser bentuk", false) +
          shapeToolBtn("addvertex", "addpt", "Tambah titik", isPoint) +
          shapeToolBtn("delete", "delpt", "Hapus titik", isPoint) +

    var imgList = qs(panelBody, "#imgList");
    function renderImgs() {
      imgList.innerHTML = (f.images || []).map(function (u, i) {
        return '<div class="img-row"><input type="text" data-i="' + i + '" value="' + esc(u) + '" placeholder="https://…" />' +
          '<button type="button" data-del="' + i + '" aria-label="Hapus">' + svg("close") + '</button></div>';

        inp.addEventListener("input", function () { f.images[+inp.getAttribute("data-i")] = inp.value; });
      });

        b.addEventListener("click", function () { f.images.splice(+b.getAttribute("data-del"), 1); renderImgs(); });

      f.classificationId = this.value;
      renderPanel();
      mountEditShape();
    });
    qs(panelBody, "#fComp").addEventListener("change", function () { f.compartmentId = this.value || null; });

        b.classList.add("active");
        renderHandles();
      });
    });
    qs(panelBody, "#stClear").addEventListener("click", function () {
      if (isPoint) return;
      var keepType = e.type;
      cancelEditing(true);
      state.collectionId = f.classificationId || state.collectionId;
      beginDraw(keepType);
    });

    qs(panelBody, "#edCancel").addEventListener("click", function () { cancelEditing(); });
    qs(panelBody, "#edSave").addEventListener("click", saveEditor);
    if (qs(panelBody, "#edDelete")) {
      var delBtn = qs(panelBody, "#edDelete");
      var armed = false;
      delBtn.addEventListener("click", function () {
        if (!armed) { armed = true; delBtn.innerHTML = svg("trash") + " Ketuk lagi untuk hapus permanen"; return; }
        features = features.filter(function (x) { return x.id !== e.id; });
        persist();
        cancelEditing(true);
        renderFeatures();
        renderPanel();
        logActivity("Hapus objek: " + (e.feature.title || "(tanpa judul)"));

  function shapeToolBtn(mode, icon, title, disabled) {
    return '<button class="shape-tool' + (state.shapeMode === mode ? " active" : "") + '" data-mode="' + mode + '" type="button" title="' + esc(title) + '"' + (disabled ? " disabled" : "") + '>' + svg(icon) + '</button>';
  }

  function saveEditor() {
    var e = state.editing;
    var f = e.feature;
    var title = qs(panelBody, "#fTitle").value.trim();
    var desc = qs(panelBody, "#fDesc").value.trim();
    var ok = true;
    qs(panelBody, "#wrapTitle").classList.toggle("invalid", !title);
    qs(panelBody, "#wrapDesc").classList.toggle("invalid", !desc);
    if (!title || !desc) ok = false;
    if (!ok) { toast("Judul dan Deskripsi wajib diisi", "err"); return; }

    var now = new Date().toISOString();
    var rec = {
      id: e.id || uid("ft"),
      classificationId: qs(panelBody, "#fClass").value,
      compartmentId: qs(panelBody, "#fComp").value || null,
      title: title,
      description: desc,
      address: qs(panelBody, "#fAddr").value.trim(),
      images: (f.images || []).filter(function (u) { return u && u.trim(); }),
      privilege: qs(panelBody, "#fPriv").value,
      questionnaire: (f.questionnaire && typeof f.questionnaire === "object") ? f.questionnaire : {},
      geometry: latLngsToGeom(e.type, e.latlngs),
      approval: e.isNew ? newApproval() : ensureApproval(f),
      createdAt: e.isNew ? now : (f.createdAt || now),
      updatedAt: now
    };
    if (e.isNew) features.push(rec);
    else features = features.map(function (x) { return x.id === rec.id ? rec : x; });
    persist();

    logActivity((e.isNew ? "Simpan objek baru: " : "Perbarui objek: ") + title + " (" + geomLabel(e.type) + ")");
    state.editing = null;
    if (editLayer) { map.removeLayer(editLayer); editLayer = null; }
    handleLayer.clearLayers();
    renderDrawDock();
    renderDrawHint();
    renderFeatures();
    renderPanel();
    toast("Objek disimpan ke My Layers", "ok");
  }

  /* ---- feature row helpers ---- */
  function recentFeaturesHtml() {
    var list = features.slice().sort(function (a, b) { return (b.updatedAt || "").localeCompare(a.updatedAt || ""); }).slice(0, 6);
    if (!list.length) return '<div class="muted">Belum ada objek.</div>';
    return list.map(featureRowHtml).join("");
  }
  function featureRowHtml(f) {
    var cls = clsById(f.classificationId);
    var ll = geomToLatLngs(f.geometry);
    var meta = f.geometry.type === "Polygon" ? fmtArea(polygonAreaM2(ll))
      : f.geometry.type === "LineString" ? fmtLen(lineLengthM(ll))
      : ll[0].lat.toFixed(4) + ", " + ll[0].lng.toFixed(4);
    var wc = f.compartmentId && wcById(f.compartmentId);
    var a = ensureApproval(f);
    var am = APPROVAL_META[a.status] || APPROVAL_META.PENDING;
    return '<div class="list-item" data-fid="' + f.id + '">' +
      '<span class="li-ico" style="background:' + cls.color + '">' + svg(cls.icon) + '</span>' +
      '<span class="li-body"><span class="li-title">' + esc(f.title || "(tanpa judul)") + '</span>' +
      '<span class="li-meta">' + geomLabel(f.geometry.type) + ' · ' + meta + (wc ? ' · ' + esc(wc.name) : "") + '</span></span>' +
      '<span class="appr-dot" title="Approval: ' + am.label + '" style="background:' + am.color + '"></span>' +
      '<button class="li-act" data-del="' + f.id + '" type="button" aria-label="Hapus">' + svg("trash") + '</button>' +
      '</div>';
  }
  function wireFeatureList(root) {
    qsa(root, ".list-item[data-fid]").forEach(function (row) {
      row.addEventListener("click", function (ev) {
        if (ev.target.closest("[data-del]")) return;
        var f = features.filter(function (x) { return x.id === row.getAttribute("data-fid"); })[0];
        if (!f) return;
        state.view = "edit"; renderRail();
        zoomToFeature(f);
        openEditor(f);
      });
    });
    qsa(root, "[data-del]").forEach(function (b) {
      var armed = false;
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (!armed) {
          armed = true;
          b.classList.add("confirm"); b.textContent = "Hapus?";
          setTimeout(function () { if (b.isConnected) { armed = false; b.classList.remove("confirm"); b.innerHTML = svg("trash"); } }, 2600);
          return;
        }
        var victim = features.filter(function (x) { return x.id === b.getAttribute("data-del"); })[0];
        features = features.filter(function (x) { return x.id !== b.getAttribute("data-del"); });
        persist(); renderFeatures(); renderPanel();
        if (victim) logActivity("Hapus objek: " + (victim.title || "(tanpa judul)"));
        toast("Objek dihapus", "ok");
      });
    });
  }

  /* =================================================================
     MAIN MENU → PUBLIC MAPPING (WorkCompartment, PRD F-4.1 – F-4.4)
     ================================================================= */
  var wcDraft = { name: "", desc: "", thumb: WC_THUMBS[0] };
  function renderPublicPanel() {
    if (state.wcCreating) {
      panelBody.innerHTML =
        '<div class="view-head"><h2>WorkCompartment baru</h2></div>' +
        '<div class="field" id="wrapWcName"><label>Nama <span class="star">*</span></label>' +

        '<div class="field"><label>Keterangan</label>' +
          '<textarea id="wcDesc" placeholder="Tujuan / lingkup pekerjaan proyek">' + esc(wcDraft.desc) + '</textarea></div>' +
        '<div class="field"><label>Thumbnail</label>' +
          '<div class="thumb-grid" id="wcThumbs">' +
            WC_THUMBS.map(function (t) { return '<button type="button" data-t="' + t + '" class="' + (t === wcDraft.thumb ? "sel" : "") + '">' + t + '</button>'; }).join("") +
          '</div></div>' +
        '<div class="editor-actions">' +
          '<button class="btn btn-cancel" id="wcCancel" type="button">' + svg("close") + ' Batal</button>' +
          '<button class="btn btn-save" id="wcSave" type="button">' + svg("check") + ' Buat</button>' +
        '</div>';
      qs(panelBody, "#wcName").addEventListener("input", function () { wcDraft.name = this.value; });
      qs(panelBody, "#wcDesc").addEventListener("input", function () { wcDraft.desc = this.value; });
      qsa(panelBody, "#wcThumbs button").forEach(function (b) {
        b.addEventListener("click", function () {
          wcDraft.thumb = b.getAttribute("data-t");
          qsa(panelBody, "#wcThumbs button").forEach(function (x) { x.classList.remove("sel"); });
          b.classList.add("sel");
        });
      });
      qs(panelBody, "#wcCancel").addEventListener("click", function () { state.wcCreating = false; renderPanel(); });
      qs(panelBody, "#wcSave").addEventListener("click", function () {
        var name = (wcDraft.name || "").trim();
        if (!name) { qs(panelBody, "#wrapWcName").classList.add("invalid"); toast("Nama wajib diisi", "err"); return; }
        var rec = { id: uid("wc"), name: name, desc: (wcDraft.desc || "").trim(), thumb: wcDraft.thumb, createdAt: new Date().toISOString() };
        compartments.push(rec);
        state.activeCompartment = rec.id;
        state.wcCreating = false;
        wcDraft = { name: "", desc: "", thumb: WC_THUMBS[0] };
        persist();
        logActivity("Buat & aktifkan WorkCompartment: " + rec.name);
        renderPanel();
        toast("WorkCompartment dibuat & diaktifkan", "ok");
      });
      return;
    }

    var active = state.activeCompartment && wcById(state.activeCompartment);
    panelBody.innerHTML =
      '<div class="view-head"><h2>' + (active ? esc(active.thumb + " " + active.name) : "Public Mapping") + '</h2>' +
        '<span class="count">' + compartments.length + '</span><span class="grow"></span>' +
        (active ? '<button class="hbtn" id="wcExit" type="button">' + svg("close") + ' Public Mapping</button>' : "") +
      '</div>' +
      (active
        ? '<p class="muted">' + esc(active.desc || "Tanpa keterangan.") + '</p>' +
          '<div class="status-line"><span class="sl-dot sl-ok"></span><span>Kompartemen aktif — objek baru otomatis masuk ke sini. ' +
            features.filter(function (f) { return f.compartmentId === active.id; }).length + ' objek tercatat.</span></div>'
        : '<p class="muted">Pilih WorkCompartment untuk mengorganisir pekerjaan survei per proyek, atau tetap di Public Mapping default. Objek yang direkam saat sebuah kompartemen aktif otomatis dikaitkan dengannya.</p>') +
      '<div class="sub-label">Daftar WorkCompartment</div>' +
      '<div class="list" id="wcList">' +
        compartments.map(function (c) {
          var cnt = features.filter(function (f) { return f.compartmentId === c.id; }).length;
          return '<div class="list-item' + (c.id === state.activeCompartment ? " active" : "") + '" data-wc="' + c.id + '">' +
            '<span class="li-ico" style="background:var(--panel-2)">' + esc(c.thumb) + '</span>' +
            '<span class="li-body"><span class="li-title">' + esc(c.name) + '</span>' +
            '<span class="li-meta">' + esc(c.desc || "—") + ' · ' + cnt + ' objek</span></span>' +
            '<button class="li-act" data-del="' + c.id + '" type="button" aria-label="Hapus">' + svg("trash") + '</button>' +
          '</div>';
        }).join("") +
      '</div>' +
      '<div style="height:10px"></div>' +
      '<button class="btn btn-primary full" id="wcNew" type="button">' + svg("plus") + ' Buat WorkCompartment</button>';

    if (qs(panelBody, "#wcExit")) qs(panelBody, "#wcExit").addEventListener("click", exitCompartment);
    qs(panelBody, "#wcNew").addEventListener("click", function () { state.wcCreating = true; renderPanel(); });
    qsa(panelBody, ".list-item[data-wc]").forEach(function (row) {
      row.addEventListener("click", function (ev) {
        if (ev.target.closest("[data-del]")) return;
        var id = row.getAttribute("data-wc");
        state.activeCompartment = state.activeCompartment === id ? null : id;
        persist();
        var wc = wcById(id);
        logActivity(state.activeCompartment ? "Aktifkan WorkCompartment: " + (wc && wc.name) : "Kembali ke Public Mapping default");
        renderPanel();
        toast(state.activeCompartment ? "Kompartemen aktif: " + (wc && wc.name) : "Kembali ke Public Mapping", "ok");
      });
    });
    qsa(panelBody, "[data-del]").forEach(function (b) {
      var armed = false;
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var id = b.getAttribute("data-del");
        if (!armed) { armed = true; b.classList.add("confirm"); b.textContent = "Hapus?"; setTimeout(function () { if (b.isConnected) { armed = false; b.classList.remove("confirm"); b.innerHTML = svg("trash"); } }, 2600); return; }
        compartments = compartments.filter(function (c) { return c.id !== id; });
        features.forEach(function (f) { if (f.compartmentId === id) f.compartmentId = null; });
        if (state.activeCompartment === id) state.activeCompartment = null;
        persist(); renderPanel(); renderFeatures();
        toast("WorkCompartment dihapus", "ok");
      });
    });
  }
  function exitCompartment() {
    state.activeCompartment = null;
    persist();
    logActivity("Kembali ke Public Mapping default");
    renderPanel();
    toast("Kembali ke Public Mapping", "ok");
  }

  /* =================================================================
     MAIN MENU → MY LAYERS (PRD F-4.8 / F-4.9)
     ================================================================= */
  function renderMyLayersPanel() {
    var active = state.activeCompartment && wcById(state.activeCompartment);
    var scoped = active && !state.myLayersScopeAll;
    var pool = features.filter(function (f) {
      if (scoped && f.compartmentId !== active.id) return false;
      if (state.myGeomFilter !== "all" && f.geometry.type !== state.myGeomFilter) return false;
      return true;
    });
    panelBody.innerHTML =
      '<div class="view-head"><h2>My Layers</h2><span class="count">' + pool.length + '</span><span class="grow"></span>' +
        (active ? '<button class="hbtn" id="mlScope" type="button">' + (scoped ? "Semua kompartemen" : "Hanya " + esc(active.thumb)) + '</button>' : "") +
      '</div>' +
      '<button class="btn btn-primary full" id="mlNew" type="button" style="margin-bottom:.7rem">' + svg("plus") + ' Rekam objek baru (Edit Mode)</button>' +
      (active ? '<div class="status-line"><span class="sl-dot ' + (scoped ? "sl-ok" : "sl-live") + '"></span><span>' +
        (scoped ? "Menampilkan objek kompartemen “" + esc(active.name) + "”." : "Menampilkan seluruh objek dari semua kompartemen.") + '</span></div>' : "") +
      '<div class="seg" id="mlSeg">' +
        [["all", "Semua"], ["Point", "Titik"], ["LineString", "Garis"], ["Polygon", "Poligon"]].map(function (o) {
          return '<button data-g="' + o[0] + '" class="' + (state.myGeomFilter === o[0] ? "sel" : "") + '">' + o[1] + '</button>';
        }).join("") +
      '</div>' +
      '<div class="field"><input id="mlFilter" type="text" placeholder="Saring judul / alamat …" /></div>' +
      '<div style="display:flex;gap:6px;margin-bottom:10px">' +
        '<button class="btn btn-ghost" id="mlExport" type="button" style="flex:1">' + svg("download") + ' Ekspor</button>' +
        '<button class="btn btn-ghost" id="mlImport" type="button" style="flex:1">' + svg("upload") + ' Impor</button>' +
      '</div>' +
      '<div class="list" id="mlList"></div>' +
      classPanelHtml();

    function paint(txt) {
      var t = (txt || "").toLowerCase();
      var rows = pool.filter(function (x) { return !t || (x.title + " " + (x.address || "")).toLowerCase().indexOf(t) >= 0; });
      qs(panelBody, "#mlList").innerHTML = rows.length ? rows.map(featureRowHtml).join("") : '<div class="muted">Tidak ada objek yang cocok.</div>';
      wireFeatureList(qs(panelBody, "#mlList"));
    }
    paint("");
    wireClassPanel(panelBody);
    qs(panelBody, "#mlNew").addEventListener("click", function () { state.view = "edit"; persist(); renderRail(); renderPanel(); });
    qs(panelBody, "#mlFilter").addEventListener("input", function () { paint(this.value); });
    qsa(panelBody, "#mlSeg button").forEach(function (b) {
      b.addEventListener("click", function () { state.myGeomFilter = b.getAttribute("data-g"); renderPanel(); });
    });
    if (qs(panelBody, "#mlScope")) qs(panelBody, "#mlScope").addEventListener("click", function () { state.myLayersScopeAll = !state.myLayersScopeAll; renderPanel(); });
    qs(panelBody, "#mlExport").addEventListener("click", exportGeoJSON);
    qs(panelBody, "#mlImport").addEventListener("click", importGeoJSON);
  }

          '<div class="field"><label>Warna</label><input id="ncColor" type="color" value="#33809c" style="height:38px;padding:2px" /></div>' +
