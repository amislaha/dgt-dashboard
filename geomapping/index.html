  function wireClassPanel(root) {
    qsa(root, ".switch input[data-cls]").forEach(function (c) {
      c.addEventListener("change", function () {
        var id = c.getAttribute("data-cls");
        if (c.checked) delete state.hidden[id]; else state.hidden[id] = true;
        persist(); renderFeatures();
      });
    });
    var add = qs(root, "#ncAdd");
    if (add) add.addEventListener("click", function () {
      var name = qs(root, "#ncName").value.trim();
      if (!name) { toast("Nama wajib diisi", "err"); return; }
      classifications.push({
        id: uid("cls"), name: name,
        desc: qs(root, "#ncDesc").value.trim() || "-",
        color: qs(root, "#ncColor").value,
        icon: qs(root, "#ncIcon").value
      });
      persist(); renderPanel(); renderDockTop();
      toast("Klasifikasi ditambahkan", "ok");
    });
  }

  function exportGeoJSON() {
    var fc = {
      type: "FeatureCollection",
      features: features.map(function (f) {
        var cls = clsById(f.classificationId);
        var ll = geomToLatLngs(f.geometry);
        var wc = f.compartmentId && wcById(f.compartmentId);
        return {
          type: "Feature", geometry: f.geometry,
          properties: {
            id: f.id, title: f.title, description: f.description, address: f.address,
            classification: cls.name, classification_id: f.classificationId,
            compartment: wc ? wc.name : undefined, compartment_id: f.compartmentId || undefined,
            privilege: f.privilege, images: f.images || [],
            approval_status: ensureApproval(f).status,
            approval_reviewer: f.approval.reviewer || undefined,
            approval_submitted_at: f.approval.submittedAt || undefined,
            approval_reviewed_at: f.approval.reviewedAt || undefined,
            area_m2: f.geometry.type === "Polygon" ? Math.round(polygonAreaM2(ll) * 100) / 100 : undefined,
            length_m: f.geometry.type === "LineString" ? Math.round(lineLengthM(ll) * 100) / 100 : undefined,
            createdAt: f.createdAt, updatedAt: f.updatedAt
          }
        };
      })
    };
    var blob = new Blob([JSON.stringify(fc, null, 2)], { type: "application/geo+json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "geomapping-" + new Date().toISOString().slice(0, 10) + ".geojson";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 0);
    logActivity("Ekspor GeoJSON (" + features.length + " objek)");
    toast("Diekspor: " + features.length + " objek", "ok");
  }
  function importGeoJSON() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".geojson,.json,application/geo+json,application/json";
    inp.addEventListener("change", function () {
      var file = inp.files && inp.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          var arr = data.type === "FeatureCollection" ? data.features : data.type === "Feature" ? [data] : [];
          if (!arr.length) throw new Error("no features");
          var added = 0;
          arr.forEach(function (gf) {
            var g = gf.geometry;
            if (!g || ["Point", "LineString", "Polygon"].indexOf(g.type) < 0) return;
            var p = gf.properties || {};
            var cls = classifications.filter(function (c) { return c.id === p.classification_id || c.name === p.classification; })[0] || clsById(state.collectionId);
            var wc = compartments.filter(function (c) { return c.id === p.compartment_id || c.name === p.compartment; })[0];
            var now = new Date().toISOString();
            var impStatus = APPROVAL_META[p.approval_status] ? p.approval_status : "PENDING";
            features.push({
              id: uid("ft"), classificationId: cls.id, compartmentId: wc ? wc.id : (state.activeCompartment || null),
              title: p.title || p.name || "Objek impor", description: p.description || "",
              address: p.address || "", images: Array.isArray(p.images) ? p.images : [],
              privilege: p.privilege || "PUBLIC", geometry: g,
              approval: {
                status: impStatus,
                submittedBy: p.approval_reviewer ? (p.approval_reviewer + " (impor)") : userName(),
                submittedAt: p.approval_submitted_at || p.createdAt || now,
                reviewer: impStatus === "PENDING" ? null : (p.approval_reviewer || null),
                reviewedAt: impStatus === "PENDING" ? null : (p.approval_reviewed_at || null),
                note: "", history: [{ action: "SUBMITTED", by: userName(), at: now, note: "impor GeoJSON" }]
              },
              createdAt: p.createdAt || now, updatedAt: now
            });
            added++;
          });
          persist(); renderFeatures(); renderPanel();
          logActivity("Impor GeoJSON (" + added + " objek)");
          toast("Diimpor: " + added + " objek", "ok");
        } catch (e) { toast("Berkas GeoJSON tidak valid", "err"); }
      };
      reader.readAsText(file);
    });
    inp.click();
  }

  /* =================================================================
     APPROVAL — review/verify survey objects before publishing
     (PRD open question #2). Front-end prototype: any signed-in user
     may act as reviewer.
     ================================================================= */
  function apprChip(status) {
    var m = APPROVAL_META[status] || APPROVAL_META.PENDING;
    return '<span class="appr-chip" style="color:' + m.color + ';background:color-mix(in srgb,' + m.color + ' 14%,transparent);border-color:' + m.color + '">' +
      '<span class="appr-dot" style="background:' + m.color + '"></span>' + m.label + '</span>';
  }
  function apprHistoryHtml(a) {
    if (!a.history || !a.history.length) return '<div class="muted" style="font-size:.7rem">Belum ada riwayat.</div>';
    return a.history.map(function (h) {
      return '<div class="act-item"><span class="act-dot" style="background:' + ((APPROVAL_META[h.action] || {}).color || 'var(--series-2)') + '"></span>' +
        '<span><span>' + esc(APPROVAL_ACTION_LABEL[h.action] || h.action) + ' &middot; ' + esc(h.by || "-") + (h.note ? ' — ' + esc(h.note) : "") + '</span>' +
        '<span class="act-when">' + fmtWhen(Date.parse(h.at) || Date.now()) + '</span></span></div>';
    }).join("");
  }
  // shared read-only metadata block (used in the editor form too)
  function approvalMetaHtml(f) {
    var a = ensureApproval(f);
    return '<div class="appr-meta">' +
      '<div class="qn-row"><span class="qn-k">Status</span><span class="qn-v">' + apprChip(a.status) + '</span></div>' +
      '<div class="qn-row"><span class="qn-k">Diajukan</span><span class="qn-v mono">' + esc(a.submittedBy || "-") + ' &middot; ' + (a.submittedAt ? fmtWhen(Date.parse(a.submittedAt)) : "-") + '</span></div>' +
      '<div class="qn-row"><span class="qn-k">Ditinjau</span><span class="qn-v mono">' + (a.reviewer ? esc(a.reviewer) + ' &middot; ' + fmtWhen(Date.parse(a.reviewedAt)) : "—") + '</span></div>' +
      (a.note ? '<div class="qn-row"><span class="qn-k">Catatan</span><span class="qn-v">' + esc(a.note) + '</span></div>' : "") +
      '<details class="appr-hist"><summary>Riwayat approval (' + (a.history ? a.history.length : 0) + ')</summary>' +
        '<div style="margin-top:.4rem">' + apprHistoryHtml(a) + '</div></details>' +
    '</div>';
  }

  function renderApprovalPanel() {
    var counts = { all: features.length, PENDING: apprCount("PENDING"), APPROVED: apprCount("APPROVED"), REJECTED: apprCount("REJECTED") };
    var pool = features.filter(function (f) { return state.apprFilter === "all" || ensureApproval(f).status === state.apprFilter; });
    pool = pool.slice().sort(function (x, y) {
      var rank = { PENDING: 0, REJECTED: 1, APPROVED: 2 };
      var d = rank[ensureApproval(x).status] - rank[ensureApproval(y).status];
      return d || (ensureApproval(y).submittedAt || "").localeCompare(ensureApproval(x).submittedAt || "");
    });

    panelBody.innerHTML =
      '<div class="view-head"><h2>Approval</h2><span class="count">' + counts.PENDING + ' menunggu</span></div>' +
      '<div class="seg" id="apprSeg">' +
        [["all", "Semua " + counts.all], ["PENDING", "Menunggu " + counts.PENDING], ["APPROVED", "Disetujui " + counts.APPROVED], ["REJECTED", "Ditolak " + counts.REJECTED]].map(function (o) {
          return '<button data-s="' + o[0] + '" class="' + (state.apprFilter === o[0] ? "sel" : "") + '">' + o[1] + '</button>';
        }).join("") +
      '</div>' +
      (pool.length ? '<div class="list" id="apprList">' + pool.map(apprRowHtml).join("") + '</div>'
                   : '<div class="muted">Tidak ada objek pada status ini.</div>');

    qsa(panelBody, "#apprSeg button").forEach(function (b) {
      b.addEventListener("click", function () { state.apprFilter = b.getAttribute("data-s"); renderPanel(); });
    });
    qsa(panelBody, "[data-appr]").forEach(function (row) {
      var fid = row.getAttribute("data-appr");
      var f = features.filter(function (x) { return x.id === fid; })[0];
      if (!f) return;
      row.querySelector(".appr-head").addEventListener("click", function () {
        state.apprOpen[fid] = !state.apprOpen[fid];
        renderPanel();
      });
      var zoom = row.querySelector("[data-zoom]");
      if (zoom) zoom.addEventListener("click", function (e) { e.stopPropagation(); zoomToFeature(f); state.view = "edit"; renderRail(); openEditor(f); });
      qsa(row, "[data-act]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var note = (row.querySelector(".appr-note") || {}).value || "";
          var act = btn.getAttribute("data-act");
          if (act === "REJECTED" && !note.trim()) { toast("Beri catatan alasan penolakan", "err"); return; }
          setApproval(f, act, note.trim());
          renderFeatures();
          renderPanel();
          toast("Status diperbarui: " + APPROVAL_META[act].label, "ok");
        });
      });
    });
  }
  function apprRowHtml(f) {
    var a = ensureApproval(f);
    var cls = clsById(f.classificationId);
    var open = !!state.apprOpen[f.id];
    var wc = f.compartmentId && wcById(f.compartmentId);
    return '<div class="appr-item' + (open ? " open" : "") + '" data-appr="' + f.id + '">' +
      '<div class="appr-head">' +
        '<span class="li-ico" style="background:' + cls.color + '">' + svg(cls.icon) + '</span>' +
        '<span class="li-body"><span class="li-title">' + esc(f.title || "(tanpa judul)") + '</span>' +
        '<span class="li-meta">' + geomLabel(f.geometry.type) + ' &middot; ' + esc(a.submittedBy || "-") + (wc ? ' &middot; ' + esc(wc.name) : "") + '</span></span>' +
        apprChip(a.status) +
        '<span class="appr-caret">' + svg("arrowRight") + '</span>' +
      '</div>' +
      (open
        ? '<div class="appr-body">' +
            approvalMetaHtml(f) +
            '<button class="xlink" data-zoom="1" type="button" style="margin:.4rem 0 .6rem">Buka di peta / editor ' + svg("arrowRight") + '</button>' +
            '<textarea class="appr-note" placeholder="Catatan reviewer (wajib untuk penolakan)"></textarea>' +
            '<div class="appr-actions">' +
              (a.status !== "APPROVED" ? '<button class="btn btn-save" data-act="APPROVED" type="button">' + svg("check") + ' Setujui</button>' : "") +
              (a.status !== "REJECTED" ? '<button class="btn btn-danger" data-act="REJECTED" type="button">' + svg("x") + ' Tolak</button>' : "") +
              (a.status !== "PENDING" ? '<button class="btn btn-ghost" data-act="PENDING" type="button">' + svg("history") + ' Kembalikan ke Menunggu</button>' : "") +
            '</div>' +
          '</div>'
        : "") +
    '</div>';
  }

  /* =================================================================
     MAIN MENU → ACTIVITY (PRD F-4.10 / F-4.11)
     ================================================================= */
  function renderActivityPanel() {
    panelBody.innerHTML =
      '<div class="view-head"><h2>Activity</h2><span class="count">' + activity.length + '</span><span class="grow"></span>' +
        (activity.length ? '<button class="hbtn" id="actClear" type="button">' + svg("trash") + ' Bersihkan</button>' : "") +
      '</div>' +
      (activity.length
        ? '<div style="margin-top:.6rem">' + activity.map(function (a) {
            return '<div class="act-item"><span class="act-dot"></span><span><span>' + esc(a.action) + '</span>' +
              '<span class="act-when">' + fmtWhen(a.ts) + '</span></span></div>';
          }).join("") + '</div>'
        : '<div class="muted" style="margin-top:.6rem">Belum ada aktivitas tercatat.</div>');
    if (qs(panelBody, "#actClear")) {
      var b = qs(panelBody, "#actClear"), armed = false;
      b.addEventListener("click", function () {
        if (!armed) { armed = true; b.innerHTML = svg("trash") + " Yakin?"; return; }
        activity = []; store.set("activity", activity); renderPanel(); updateRailBadges();
      });
    }
  }

  /* =================================================================
     EDIT MODE → TASK (PRD F-5.13 / F-5.14)
     ================================================================= */
  function renderTaskPanel() {
    var open = tasks.filter(function (t) { return !t.done; }).length;
    panelBody.innerHTML =
      '<div class="view-head"><h2>Task</h2><span class="count">' + open + ' terbuka</span></div>' +
      '<div style="margin-top:.7rem">' +
        tasks.map(function (t) {
          return '<div class="task-item' + (t.done ? " done" : "") + '">' +
            '<input type="checkbox" data-tid="' + t.id + '"' + (t.done ? " checked" : "") + ' />' +
            '<span style="flex:1"><span class="ti-title">' + esc(t.title) + '</span>' +
            '<span class="ti-desc">' + esc(t.desc || "") + '</span></span>' +
            '<button class="li-act" data-del="' + t.id + '" type="button" aria-label="Hapus">' + svg("trash") + '</button>' +
          '</div>';
        }).join("") +
      '</div>' +
      '<div class="sub-label">Tambah tugas</div>' +
      '<div class="field"><input id="tkTitle" type="text" placeholder="Judul tugas survei" /></div>' +
      '<button class="btn btn-save full" id="tkAdd" type="button">' + svg("plus") + ' Tambah tugas</button>';
    qsa(panelBody, "input[data-tid]").forEach(function (c) {
      c.addEventListener("change", function () {
        var t = tasks.filter(function (x) { return x.id === c.getAttribute("data-tid"); })[0];
        if (!t) return;
        t.done = c.checked; persist(); updateRailBadges();
        logActivity((c.checked ? "Tandai tugas selesai: " : "Buka kembali tugas: ") + t.title);
        renderPanel();
      });
    });
    qsa(panelBody, "[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        tasks = tasks.filter(function (x) { return x.id !== b.getAttribute("data-del"); });
        persist(); updateRailBadges(); renderPanel();
      });
    });
    qs(panelBody, "#tkAdd").addEventListener("click", function () {
      var v = qs(panelBody, "#tkTitle").value.trim();
      if (!v) { toast("Judul tugas wajib diisi", "err"); return; }
      tasks.push({ id: uid("tsk"), title: v, desc: "", done: false });
      persist(); updateRailBadges(); renderPanel();
      toast("Tugas ditambahkan", "ok");
    });
  }

  /* =================================================================
     LOCATE FAB + generic GPS handlers
     ================================================================= */
  document.getElementById("locateBtn").addEventListener("click", function () { requestMyLoc(); });

  document.getElementById("langBtn").addEventListener("click", function () {
    toast("Antarmuka dwibahasa belum tersedia pada prototipe ini");
  });

  /* user menu / logout */
  var userMenu = document.getElementById("userMenu");
  document.getElementById("userBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    userMenu.hidden = !userMenu.hidden;
    this.setAttribute("aria-expanded", String(!userMenu.hidden));
  });
  document.addEventListener("click", function () { userMenu.hidden = true; document.getElementById("userBtn").setAttribute("aria-expanded", "false"); });
  (function () {
    var rb = document.getElementById("resetBtn"), armed = false;
    rb.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!armed) { armed = true; rb.textContent = "Ketuk lagi untuk hapus semua data"; return; }
      try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(LS) === 0) localStorage.removeItem(k); }); } catch (e2) {}
      location.reload();
    });
  })();
  document.getElementById("bmBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    var p = document.getElementById("bmPop");
    p.hidden = !p.hidden;
    if (!p.hidden) renderBmPop();
  });
  document.addEventListener("click", function () { document.getElementById("bmPop").hidden = true; });
  document.getElementById("bmPop").addEventListener("click", function (e) { e.stopPropagation(); });
  document.getElementById("poiBtn").addEventListener("click", function () {
    state.poiVisible = !state.poiVisible;
    persist();
    renderPOIs();
    document.getElementById("poiBtn").classList.toggle("on", state.poiVisible);
    toast(state.poiVisible ? "Layer POI aktif" : "Layer POI dimatikan");
    logActivity(state.poiVisible ? "Aktifkan layer POI" : "Nonaktifkan layer POI");
  });
  document.getElementById("bndBtn").addEventListener("click", function () {
    var anyOn = BND_LEVELS.some(function (lv) { return state.boundary[lv.key]; });
    state.boundary = {};
    if (!anyOn) BND_LEVELS.forEach(function (lv) { state.boundary[lv.key] = true; });
    persist();
    renderBoundaries();
    toast(anyOn ? "Overlay batas wilayah dimatikan" : "Overlay batas wilayah aktif (semua tingkat)");
  });
  function renderBmPop() {
    var p = document.getElementById("bmPop");
    var groups = { Klikpeta: [], MapBox: [] };
    Object.keys(BASEMAPS).forEach(function (k) { groups[BASEMAPS[k].group].push(k); });
    p.innerHTML = Object.keys(groups).map(function (g) {
      return '<div class="bm-grp">' + g + '</div>' + groups[g].map(function (k) {
        return '<div class="bm-opt' + (state.basemap === k ? " sel" : "") + '" data-bm="' + k + '">' + esc(BASEMAPS[k].name) + '</div>';
      }).join("");
    }).join("");
    qsa(p, ".bm-opt").forEach(function (o) {
      o.addEventListener("click", function () { setBasemap(o.getAttribute("data-bm")); p.hidden = true; });
    });
  }

  /* =================================================================
     NO AUTH GATE — the login overlay (PRD Modul I) was removed on
     request; the app opens straight into the workspace. `userName()`
     still resolves a default identity for approval/activity records.
     ================================================================= */

  /* =================================================================
     BOOT
     ================================================================= */
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    setBasemap(state.basemap, true);
    renderBoundaries();
    renderPOIs();
    document.getElementById("poiBtn").classList.toggle("on", state.poiVisible);
    renderRail();
    renderDrawDock();
    renderPanel();
    renderFeatures();
    setTimeout(function () { map.invalidateSize(); }, 100);
  }

  (function () {
    var u = userName();
    document.getElementById("userName").textContent = u;
    document.getElementById("userAv").textContent = (u[0] || "S").toUpperCase();
    boot();
  })();

  /* PWA — register the service worker (no-op when unsupported or on file://) */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline mode simply unavailable */ });
    });
  }
})();
</script>
