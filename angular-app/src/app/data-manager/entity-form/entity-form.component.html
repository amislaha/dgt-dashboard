<form *ngIf="form" [formGroup]="form">
  <div class="form-tabs" *ngIf="tabs.length > 1">
    <button
      type="button"
      *ngFor="let tab of tabs; let i = index"
      [class.sel]="activeTab === i"
      [class.has-error]="tabHasErrors(i)"
      (click)="activeTab = i">
      {{ tab.label }}
    </button>
  </div>

  <ng-container *ngFor="let tab of tabs; let i = index">
  <div [class.d-none]="activeTab !== i">
  <div class="form-row" *ngFor="let group of tab.groups">
    <div class="form-group" [ngClass]="group.length > 1 ? 'col-6' : 'col-12'" *ngFor="let field of group">
      <label [attr.for]="'f_' + field.name">
        {{ field.label }}<span *ngIf="field.required" class="text-danger"> *</span>
      </label>

      <ng-container [ngSwitch]="field.type">
        <select
          *ngSwitchCase="'select'"
          [id]="'f_' + field.name"
          class="form-control form-control-sm"
          [class.is-invalid]="fieldInvalid(field)"
          [formControlName]="field.name">
          <option value="" disabled>— pilih —</option>
          <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
        </select>

        <select
          *ngSwitchCase="'fk'"
          [id]="'f_' + field.name"
          class="form-control form-control-sm"
          [class.is-invalid]="fieldInvalid(field)"
          [formControlName]="field.name">
          <option value="" disabled>— pilih —</option>
          <option *ngFor="let opt of fkOptions[field.name]" [value]="opt.id">{{ opt.label }}</option>
        </select>

        <textarea
          *ngSwitchCase="'textarea'"
          [id]="'f_' + field.name"
          class="form-control form-control-sm"
          rows="3"
          [class.is-invalid]="fieldInvalid(field)"
          [formControlName]="field.name"
          [placeholder]="field.placeholder || ''">
        </textarea>

        <input
          *ngSwitchCase="'number'"
          type="number"
          [id]="'f_' + field.name"
          class="form-control form-control-sm"
          [class.is-invalid]="fieldInvalid(field)"
          [formControlName]="field.name"
          [attr.min]="field.min"
          [attr.step]="field.step || 'any'"
          [attr.max]="field.max"
          [placeholder]="field.placeholder || ''" />

        <div *ngSwitchCase="'geometry'" class="geometry-field">
          <div class="geometry-actions">
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="startDraw(field, 'Point')">Tandai Titik</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="startDraw(field, 'LineString')">Gambar Garis</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="startDraw(field, 'Polygon')">Gambar Area</button>
          </div>
          <div class="geometry-summary" *ngIf="form.get(field.name)!.value">
            <span>{{ geometrySummary(field) }}</span>
            <button type="button" class="btn btn-sm btn-link text-danger p-0" (click)="clearGeometry(field)">Hapus</button>
          </div>
        </div>

        <div *ngSwitchCase="'boolean'" class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" [id]="'f_' + field.name" [formControlName]="field.name" />
          <label class="custom-control-label" [attr.for]="'f_' + field.name">Ya</label>
        </div>

        <input
          *ngSwitchCase="'date'"
          type="date"
          [id]="'f_' + field.name"
          class="form-control form-control-sm"
          [class.is-invalid]="fieldInvalid(field)"
          [formControlName]="field.name" />

        <input
          *ngSwitchDefault
          type="text"
          [id]="'f_' + field.name"
          class="form-control form-control-sm"
          [class.is-invalid]="fieldInvalid(field)"
          [formControlName]="field.name"
          [placeholder]="field.placeholder || ''" />
      </ng-container>

      <small class="form-text text-muted" *ngIf="field.hint">{{ field.hint }}</small>
      <small class="form-text text-danger" *ngIf="fieldInvalid(field)">Kolom ini wajib diisi.</small>
    </div>
  </div>
  </div>
  </ng-container>
</form>
