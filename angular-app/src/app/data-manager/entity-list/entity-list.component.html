<ng-container *ngIf="config">
  <div class="inline-editor" *ngIf="inline && drawerOpen; else listView">
    <div class="inline-editor-head">
      <div class="min-w-0">
        <div class="inline-editor-eyebrow">{{ drawerTitle }}</div>
        <h2 class="inline-editor-title">{{ editorHeading }}</h2>
      </div>
      <button type="button" class="inline-editor-close" (click)="closeDrawer()" aria-label="Tutup">&times;</button>
    </div>

    <div class="inline-editor-body">
      <dgt-entity-form [config]="config" [record]="editing" (saved)="onFormSaved($event)"></dgt-entity-form>
    </div>

    <ng-container *ngTemplateOutlet="formFooter"></ng-container>
  </div>

  <ng-template #listView>
  <div [class.inline-list]="inline">
  <dgt-page-head [title]="config.label" [description]="config.sub">
    <div class="input-group input-group-sm search-box mr-2">
      <div class="input-group-prepend">
        <span class="input-group-text bg-white">🔎</span>
      </div>
      <input
        type="text"
        class="form-control"
        [placeholder]="'Cari ' + config.label.toLowerCase() + '...'"
        [value]="query"
        (input)="onSearch($any($event.target).value)" />
    </div>
    <button type="button" class="btn btn-primary btn-sm" (click)="openCreate()">{{ needsApproval ? '+ Ajukan Tambah' : '+ Tambah' }}</button>
  </dgt-page-head>

  <div class="panel">
    <dgt-data-table
      [columns]="columns"
      [rows]="rows"
      [sortKey]="sortKey"
      [sortDir]="sortDir"
      [emptyLabel]="emptyLabel"
      (sortChange)="onSort($event)"
      (rowClick)="openEdit($event)">
    </dgt-data-table>
  </div>
  </div>
  </ng-template>

  <dgt-drawer *ngIf="!inline" [open]="drawerOpen && !drawing" [title]="drawerTitle" (closed)="closeDrawer()">
    <dgt-entity-form *ngIf="drawerOpen" [config]="config" [record]="editing" (saved)="onFormSaved($event)"></dgt-entity-form>

    <div drawer-footer class="w-100">
      <ng-container *ngTemplateOutlet="formFooter"></ng-container>
    </div>
  </dgt-drawer>

  <ng-template #formFooter>
    <div class="form-footer d-flex justify-content-between align-items-center w-100">
      <button *ngIf="editing" type="button" class="btn btn-outline-danger btn-sm" (click)="deleteCurrent()">{{ needsApproval ? 'Ajukan Hapus' : 'Hapus' }}</button>
      <span *ngIf="!editing"></span>
      <div>
        <button type="button" class="btn btn-secondary btn-sm mr-2" (click)="closeDrawer()">Batal</button>
        <button type="button" class="btn btn-primary btn-sm" (click)="submitForm()">{{ needsApproval ? 'Ajukan' : 'Simpan' }}</button>
      </div>
    </div>
  </ng-template>
</ng-container>
