<ng-container *ngIf="config">
  <!-- Detail page: replaces the list (no drawer), opened from a row or "+ Tambah". -->
  <div class="detail-page" [class.inline]="inline" *ngIf="drawerOpen; else listView">
    <header class="detail-head">
      <nav class="crumb" aria-label="Breadcrumb">
        <button type="button" class="link" (click)="closeDrawer()">{{ config.label }}</button>
        <span aria-hidden="true">/</span>
        <span class="here">{{ editorHeading }}</span>
      </nav>
      <div class="detail-title-row">
        <button type="button" class="icon-btn" (click)="closeDrawer()" aria-label="Kembali ke daftar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <h2 class="detail-title">{{ editorHeading }}</h2>
        <span class="detail-sub">{{ drawerTitle }}</span>
      </div>
    </header>

    <div class="detail-body">
      <dgt-entity-form [config]="config" [record]="editing" (saved)="onFormSaved($event)"></dgt-entity-form>
    </div>

    <footer class="detail-foot">
      <button *ngIf="editing" type="button" class="btn-delete" (click)="deleteCurrent()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        {{ needsApproval ? 'Ajukan hapus' : 'Hapus' }}
      </button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-light btn-cancel" (click)="closeDrawer()">Batal</button>
      <button type="button" class="btn btn-primary btn-save" (click)="submitForm()">{{ needsApproval ? 'Ajukan' : 'Simpan' }}</button>
    </footer>
  </div>

  <ng-template #listView>
    <div class="list-page" [class.inline]="inline">
      <header class="list-head">
        <div class="min-w-0">
          <h2 class="list-title">{{ config.label }}</h2>
          <div class="list-sub">{{ rows.length }} data<ng-container *ngIf="config.sub"> · {{ config.sub }}</ng-container></div>
        </div>
        <div class="list-actions">
          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input
              type="search"
              class="form-control"
              [placeholder]="'Cari ' + config.label.toLowerCase() + '…'"
              [attr.aria-label]="'Cari ' + config.label.toLowerCase()"
              [value]="query"
              (input)="onSearch($any($event.target).value)" />
          </div>
          <button type="button" class="btn btn-primary btn-add" (click)="openCreate()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            {{ needsApproval ? 'Ajukan tambah' : 'Tambah' }}
          </button>
        </div>
      </header>

      <div class="dm-table">
        <dgt-data-table
          [columns]="columns"
          [rows]="rows"
          [sortKey]="sortKey"
          [sortDir]="sortDir"
          [emptyLabel]="emptyLabel"
          (sortChange)="onSort($event)"
          (rowClick)="openEdit($event)">
        </dgt-data-table>
      </div>
    </div>
  </ng-template>
</ng-container>
