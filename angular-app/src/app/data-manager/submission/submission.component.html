<ng-container *ngIf="!drawerOpen">
  <div class="dm-toolbar d-flex justify-content-end mb-3">
    <button type="button" class="btn btn-primary btn-sm" (click)="openCreate()">+ Ajukan Perubahan</button>
  </div>

  <div class="panel">
    <dgt-data-table
      [columns]="columns"
      [rows]="rows"
      emptyLabel='Belum ada pengajuan. Klik "+ Ajukan Perubahan" untuk membuat yang pertama.'>
    </dgt-data-table>
  </div>
</ng-container>

<div class="inline-form" *ngIf="drawerOpen">
  <div class="inline-form-head d-flex justify-content-between align-items-center mb-3">
    <h3 class="h6 font-weight-bold mb-0">Ajukan Perubahan Data</h3>
    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="closeDrawer()" aria-label="Tutup">✕</button>
  </div>

  <form>
    <div class="form-row">
      <div class="form-group col-6">
        <label>Entitas</label>
        <select class="form-control form-control-sm" [(ngModel)]="draftEntityKey" name="entityKey">
          <option *ngFor="let opt of entityOptions" [value]="opt.key">{{ opt.label }}</option>
        </select>
      </div>
      <div class="form-group col-6">
        <label>Jenis Pengajuan</label>
        <select class="form-control form-control-sm" [(ngModel)]="draftMode" name="mode">
          <option *ngFor="let opt of modeOptions" [value]="opt[0]">{{ opt[1] }}</option>
        </select>
      </div>
    </div>

    <div class="form-group" *ngIf="needsTargetPicker">
      <label>Data Target</label>
      <select class="form-control form-control-sm" [(ngModel)]="draftTargetId" name="targetId">
        <option value="" disabled>— pilih —</option>
        <option *ngFor="let opt of targetOptions" [value]="opt.id">{{ opt.label }}</option>
      </select>
    </div>

    <div class="form-group" *ngIf="!needsTargetPicker">
      <label>Nama/Judul Usulan</label>
      <input type="text" class="form-control form-control-sm" [(ngModel)]="draftTargetLabel" name="targetLabel" placeholder="cth. LUNANG SILAUT" />
    </div>

    <div class="form-group">
      <label>Ringkasan Perubahan <span class="text-danger">*</span></label>
      <textarea class="form-control form-control-sm" rows="3" [(ngModel)]="draftSummary" name="summary" placeholder="Jelaskan data apa yang diusulkan/diubah dan alasannya"></textarea>
    </div>

    <div class="form-group">
      <label>Lokasi/Geometri (opsional)</label>
      <div class="draw-actions">
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="startDraw('Point')">Tandai Titik</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="startDraw('LineString')">Gambar Garis</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="startDraw('Polygon')">Gambar Area</button>
      </div>
      <div class="draw-summary" *ngIf="draftGeometry">
        <span>{{ geometrySummary }}</span>
        <button type="button" class="btn btn-sm btn-link text-danger p-0" (click)="clearGeometry()">Hapus</button>
      </div>
      <small class="form-text text-muted">Klik salah satu tombol, lalu gambar langsung di peta pada panel sebelah kiri.</small>
    </div>

    <div class="form-group">
      <label>Foto Pendukung (opsional)</label>
      <input type="file" class="form-control-file" accept="image/*" multiple (change)="onFiles($event)" />
      <div class="image-preview" *ngIf="draftImages.length">
        <div class="image-thumb" *ngFor="let src of draftImages; let i = index">
          <img [src]="src" alt="" />
          <button type="button" class="remove-btn" (click)="removeImage(i)">&times;</button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Diajukan oleh <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" [(ngModel)]="draftSubmittedBy" name="submittedBy" placeholder="Nama petugas" />
    </div>
  </form>

  <div class="inline-form-actions d-flex justify-content-end">
    <button type="button" class="btn btn-secondary btn-sm mr-2" (click)="closeDrawer()">Batal</button>
    <button type="button" class="btn btn-primary btn-sm" (click)="submitDraft()">Kirim Pengajuan</button>
  </div>
</div>
