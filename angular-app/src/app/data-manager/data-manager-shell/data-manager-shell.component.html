<div class="dm-shell d-flex flex-column">
  <header class="dm-header navbar navbar-expand navbar-light bg-white border-bottom px-3">
    <img class="dm-logo" src="assets/logo-emblem.png" alt="Lambang Kementerian Transmigrasi" />
    <span class="navbar-brand font-weight-bold mb-0">DGT Data Manager</span>

    <nav class="dm-nav flex-grow-1 d-flex align-items-center flex-wrap">
      <a class="dm-nav-link" [class.active]="activeId === 'wilayah'" (click)="onSelect('wilayah')">
        Wilayah <span class="dm-nav-badge">{{ wilayahSub }}</span>
      </a>
      <a class="dm-nav-link" [class.active]="activeId === 'submission'" (click)="onSelect('submission')">
        Submission &amp; Approval <span class="dm-nav-badge">{{ submissionSub }}</span>
      </a>

      <div class="dm-nav-right ml-auto d-flex align-items-center">
        <div ngbDropdown class="dm-nav-dropdown">
          <button type="button" class="dm-nav-link dm-dropdown-toggle" ngbDropdownToggle>Data Master</button>
          <div ngbDropdownMenu class="dm-dropdown-menu">
            <button
              ngbDropdownItem
              type="button"
              class="dm-dropdown-item"
              *ngFor="let item of masterItems"
              [class.active]="activeId === item.id"
              (click)="onSelect(item.id)">
              <span>{{ item.label }}</span>
              <span class="dm-item-sub">{{ item.sub }}</span>
            </button>
          </div>
        </div>

        <div ngbDropdown class="dm-nav-dropdown">
          <button type="button" class="dm-nav-link dm-dropdown-toggle" ngbDropdownToggle>Settings</button>
          <div ngbDropdownMenu class="dm-dropdown-menu">
            <button
              ngbDropdownItem
              type="button"
              class="dm-dropdown-item"
              *ngFor="let item of settingsItems"
              [class.active]="activeId === item.id"
              (click)="onSelect(item.id)">
              <span>{{ item.label }}</span>
              <span class="dm-item-sub">{{ item.sub }}</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="ml-auto d-flex align-items-center">
      <span class="topbar-stat d-none d-sm-inline-flex align-items-center mr-3">
        <span class="status-dot mr-2"></span>{{ totalLabel }}
      </span>
      <dgt-theme-toggle></dgt-theme-toggle>
    </div>
  </header>

  <div class="dm-content flex-grow-1">
    <router-outlet></router-outlet>
  </div>
</div>
