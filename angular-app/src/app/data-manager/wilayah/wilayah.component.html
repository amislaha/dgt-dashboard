<div class="wilayah-shell">
  <div class="wilayah-map-panel">
    <dgt-wilayah-map [wilayah]="wilayah" [selectedId]="selectedId" (select)="onSelect($event)"></dgt-wilayah-map>
  </div>

  <div class="wilayah-side-panel" [class.collapsed]="sidebarCollapsed" [class.drawing]="drawing">
    <button
      type="button"
      class="sidebar-collapse-toggle"
      (click)="toggleSidebar()"
      [attr.aria-label]="sidebarCollapsed ? 'Buka panel Wilayah' : 'Ciutkan panel Wilayah'">
      {{ sidebarCollapsed ? '‹' : '›' }}
    </button>
    <div class="sidebar-scroll" *ngIf="!sidebarCollapsed">
      <dgt-wilayah-editor *ngIf="editorOpen" [record]="editing" (closed)="closeEditor()" (created)="onCreated($event)"></dgt-wilayah-editor>
      <!-- Kept alive under the editor so its search/sort survive opening a record. -->
      <dgt-entity-list [class.d-none]="editorOpen" [inline]="true" [customEditor]="true" (editRequest)="openEditor($event)"></dgt-entity-list>
    </div>
  </div>
</div>
