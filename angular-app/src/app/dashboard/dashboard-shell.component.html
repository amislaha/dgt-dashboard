<div class="shell d-flex">
  <dgt-rail-nav
    [items]="visibleNavItems"
    [activeId]="activeId"
    [collapsed]="!isNarrow && railCollapsed"
    [open]="isNarrow && railOpen"
    logoSrc="assets/logo-emblem.png"
    logoAlt="Lambang Kementerian Transmigrasi"
    brandText="DGT"
    [showSub]="false"
    backLabel="Kembali ke DGT"
    groupLabel="Modul Eksekutif"
    (select)="onSelect($event)"
    (closeMobile)="railOpen = false">
    <div class="rail-footer" railFooter>
      <a class="rail-footer-btn" routerLink="/data-manager" title="Buka DGT Data Manager">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.2 7.6 8 9 4.8-1.4 8-4.5 8-9V6Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Admin DGT</span>
      </a>
    </div>
  </dgt-rail-nav>

  <button
    type="button"
    class="rail-fab"
    [class.hidden-until-hover]="!isNarrow && activeId !== 'geospasial'"
    [class.shifted]="!isNarrow && !railCollapsed"
    [class.on-geo]="activeId === 'geospasial'"
    aria-label="Buka/tutup menu modul"
    (click)="toggleRail()">
    &#9776;
  </button>

  <dgt-theme-toggle *ngIf="activeId !== 'geospasial'" [fixed]="true"></dgt-theme-toggle>

  <main class="main flex-grow-1">
    <router-outlet></router-outlet>
  </main>
</div>
