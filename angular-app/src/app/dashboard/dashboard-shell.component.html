<div class="shell d-flex">
  <dgt-rail-nav
    [items]="visibleNavItems"
    [activeId]="activeId"
    [collapsed]="!isNarrow && railCollapsed"
    [open]="isNarrow && railOpen"
    logoSrc="assets/logo-emblem.png"
    logoAlt="Lambang Kementerian Transmigrasi"
    backLabel="Kembali ke DGT"
    groupLabel="Modul Eksekutif"
    (select)="onSelect($event)"
    (closeMobile)="railOpen = false">
    <div class="rail-footer" railFooter>
      <a class="rail-footer-btn" routerLink="/data-manager" title="Buka DGT Data Manager">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18"/><path d="M9 4v16"/></svg>
        <span>Kelola Data Tabel</span>
      </a>
      <a class="rail-footer-btn" routerLink="/geomapping" title="Buka Geomapping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
        <span>Kelola Data Spasial</span>
      </a>
    </div>
  </dgt-rail-nav>

  <button
    type="button"
    class="rail-fab"
    [class.hidden-until-hover]="!isNarrow && railCollapsed"
    [class.shifted]="!isNarrow && !railCollapsed"
    aria-label="Buka/tutup menu modul"
    (click)="toggleRail()">
    &#9776;
  </button>

  <main class="main flex-grow-1">
    <router-outlet></router-outlet>
  </main>
</div>
