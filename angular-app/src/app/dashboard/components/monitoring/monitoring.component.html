<dgt-page-head
  title="Monitoring 5T: Program, Kinerja, Anggaran &amp; Tindak Lanjut"
  description="Pelacakan linimasa program (Kurva S) dan realisasi penyerapan anggaran program unggulan 5T secara real-time.">
</dgt-page-head>

<div class="row mb-4">
  <div class="col-6 col-md-3 mb-3">
    <dgt-kpi-tile label="Realisasi Fisik" value="74%" delta="vs. rencana 80%" dir="down"></dgt-kpi-tile>
  </div>
  <div class="col-6 col-md-3 mb-3">
    <dgt-kpi-tile label="Realisasi Anggaran" value="68%" delta="▲ 5% bulan ini" dir="up"></dgt-kpi-tile>
  </div>
  <div class="col-6 col-md-3 mb-3">
    <dgt-kpi-tile label="Program Berjalan" value="18" delta="dari 24 program aktif" dir="flat"></dgt-kpi-tile>
  </div>
  <div class="col-6 col-md-3 mb-3">
    <dgt-kpi-tile label="Tenggat Terlewat" value="3" delta="perlu tindak lanjut" dir="down"></dgt-kpi-tile>
  </div>
</div>

<div class="card mb-4">
  <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
    <h2 class="h6 font-weight-bold mb-0">Kurva S — Rencana vs. Realisasi</h2>
    <span class="d-flex align-items-center small">
      <span class="legend-chip mr-1" style="background: var(--series-2)"></span>Rencana
      <span class="legend-chip mr-1 ml-3" style="background: var(--primary)"></span>Realisasi
    </span>
  </div>
  <div class="card-body">
    <dgt-dual-line-chart [labels]="sCurve.labels" [s1]="sCurve.rencana" [s2]="sCurve.realisasi" [width]="900" [height]="220"></dgt-dual-line-chart>
  </div>
</div>

<div class="card">
  <div class="card-header"><h2 class="h6 font-weight-bold mb-0">Realisasi Anggaran per Kawasan</h2></div>
  <div class="card-body">
    <dgt-bar-chart [data]="anggaranBarData" [height]="200" [width]="900" suffix="%" [max]="100"></dgt-bar-chart>
  </div>
</div>
