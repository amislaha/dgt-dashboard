<dgt-page-head
  title="Transmigran, Masyarakat Lokal &amp; Kependudukan"
  description="Visualisasi persebaran demografi, asal daerah transmigran, dan tingkat pembauran dengan masyarakat lokal.">
</dgt-page-head>

<div class="row mb-4">
  <div class="col-lg-6 mb-4">
    <div class="card h-100">
      <div class="card-header"><h2 class="h6 font-weight-bold mb-0">Asal Daerah Transmigran (Top 5)</h2></div>
      <div class="card-body">
        <dgt-bar-chart [data]="asalBarData" [height]="190"></dgt-bar-chart>
      </div>
    </div>
  </div>
  <div class="col-lg-6 mb-4">
    <div class="card h-100">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h2 class="h6 font-weight-bold mb-0">Indeks Pembauran Sosial</h2>
        <span class="small text-muted">rata-rata nasional</span>
      </div>
      <div class="card-body d-flex flex-column align-items-center">
        <dgt-gauge-chart [value]="pembauranValue" [max]="100" color="var(--good)" label="/ 100"></dgt-gauge-chart>
        <p class="text-muted text-center small mt-2 mb-0">Skala 0–100 &middot; berbasis survei interaksi sosial &amp; partisipasi kegiatan bersama</p>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h2 class="h6 font-weight-bold mb-0">Populasi per Kawasan</h2>
    <span class="small text-muted">jumlah jiwa transmigran terdaftar</span>
  </div>
  <div class="card-body">
    <dgt-bar-chart [data]="popBarData" [height]="200" [width]="900"></dgt-bar-chart>
  </div>
</div>
