<dgt-page-head
  title="Infrastruktur, Sarana Prasarana &amp; Kolaborasi K/L"
  description="Inventarisasi aset fisik kawasan dan pemetaan intervensi program lintas Kementerian/Lembaga — Trans Gotong Royong.">
</dgt-page-head>

<div class="row">
  <div class="col-lg-6 mb-4">
    <div class="card h-100">
      <div class="card-header"><h2 class="h6 font-weight-bold mb-0">Capaian Infrastruktur per Kategori</h2></div>
      <div class="card-body">
        <div class="mb-3" *ngFor="let i of infraKategori">
          <div class="d-flex justify-content-between small mb-1">
            <span>{{ i.nama }}</span>
            <span class="mono">{{ i.capaian }}%</span>
          </div>
          <div class="progress" style="height: 7px">
            <div class="progress-bar" role="progressbar" [style.width.%]="i.capaian"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6 mb-4">
    <div class="card h-100">
      <div class="card-header"><h2 class="h6 font-weight-bold mb-0">Kolaborasi Kementerian/Lembaga</h2></div>
      <div class="table-responsive">
        <table class="table mb-0">
          <thead>
            <tr>
              <th>K/L</th>
              <th>Program</th>
              <th class="text-right">Kawasan</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of klCollab">
              <td>{{ c.kl }}</td>
              <td>{{ c.program }}</td>
              <td class="text-right mono">{{ c.kawasanCount }}</td>
              <td><span class="badge" [ngClass]="statusBadgeClass(c.status)">{{ c.status }}</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
