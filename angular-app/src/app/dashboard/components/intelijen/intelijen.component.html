<dgt-page-head title="BUAT LAPORAN"></dgt-page-head>

<div class="lap-toolbar d-flex flex-wrap justify-content-between align-items-center mb-2">
  <div class="d-flex flex-wrap align-items-center" style="gap: .6rem">
    <span class="lap-toolbar-label">Pilih Periode</span>
    <span class="info-chip">Periode: 2026 &middot; TW1</span>
    <span class="lap-toolbar-label ml-2">Pilih Kawasan</span>
    <select class="form-control form-control-sm" style="width: auto" [(ngModel)]="kawasanFilter">
      <option value="Semua">Semua Kawasan</option>
      <option *ngFor="let k of kawasan" [value]="k.id">{{ k.nama }}</option>
    </select>
  </div>
  <button type="button" class="lap-history-link" (click)="toggleHistoryNote()">History ekspor laporan</button>
</div>
<p class="small text-muted" *ngIf="showHistoryNote">Belum ada riwayat ekspor laporan pada prototipe ini.</p>

<div class="lap-card-grid mb-4">
  <div class="lap-card" *ngFor="let c of cards" title="Ekspor laporan belum tersedia pada prototipe ini.">
    <img src="assets/hero-kawasan.jpg" alt="" />
    <div class="lap-card-overlay">
      <span class="lap-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>
        </svg>
      </span>
      <div class="lap-card-title">{{ c.title }}</div>
      <div class="lap-card-sub">{{ kawasanCount }} Kawasan</div>
    </div>
  </div>
</div>

<div class="lap-ai-panel">
  <h2 class="h6 font-weight-bold mb-3">Asisten AI</h2>
  <dgt-chat-panel mode="compact"></dgt-chat-panel>
</div>
