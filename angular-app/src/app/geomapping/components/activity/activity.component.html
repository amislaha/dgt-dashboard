<div class="view-head">
  <h2>Activity</h2>
  <span class="count">{{ activity.length }}</span>
  <span class="grow"></span>
  <button class="hbtn" type="button" *ngIf="activity.length" (click)="onClearClick()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    {{ clearArmed ? 'Yakin?' : 'Bersihkan' }}
  </button>
</div>

<div style="margin-top:.6rem" *ngIf="activity.length; else emptyState">
  <div class="act-item" *ngFor="let a of activity">
    <span class="act-dot"></span>
    <span>
      <span>{{ a.action }}</span>
      <span class="act-when">{{ fmtWhen(a.ts) }}</span>
    </span>
  </div>
</div>
<ng-template #emptyState><div class="muted" style="margin-top:.6rem">Belum ada aktivitas tercatat.</div></ng-template>
