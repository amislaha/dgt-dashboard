<ng-container>
  <div class="rail-scrim d-lg-none" *ngIf="open" (click)="closeMobile.emit()"></div>

  <nav class="rail" [class.collapsed]="collapsed" [class.open]="open">
    <div class="rail-head">
      <a class="rail-back-link" routerLink="/" [title]="backLabel" [attr.aria-label]="backLabel">
        <img class="rail-logo" *ngIf="logoSrc" [src]="logoSrc" [alt]="logoAlt" />
        <span class="rail-logo-text" *ngIf="!logoSrc">DGT</span>
      </a>
    </div>

    <div class="rail-body">
      <span class="rail-group-label">{{ groupLabel }}</span>
      <button
        *ngFor="let item of items"
        type="button"
        class="rail-item"
        [class.active]="item.id === activeId"
        (click)="onSelect(item.id)">
        <span class="rail-icon" *ngIf="item.icon" [innerHTML]="item.icon | safeHtml"></span>
        <span class="rail-text">
          <span class="rail-label">{{ item.label }}</span>
          <span class="rail-sub" *ngIf="item.sub">{{ item.sub }}</span>
        </span>
      </button>
    </div>

    <!-- Optional footer, projected by the consuming shell (e.g. DashboardShellComponent's
         "Kelola Data Tabel"/"Kelola Data Spasial" links) — a sibling of .rail-body (not nested
         inside it) so it's pinned below the scrollable nav list rather than scrolling with it.
         Empty/omitted by default, so shells that don't project anything (data-manager) are
         unaffected. -->
    <ng-content select="[railFooter]"></ng-content>
  </nav>
</ng-container>
