<main class="am-page">
  <dgt-page-head [title]="manage ? 'Manage user password' : 'Password'"
                 [description]="manage ? 'Atur ulang kata sandi pengguna.' : 'Ubah kata sandi akun Anda.'"></dgt-page-head>

  <form class="am-form" (ngSubmit)="submit()" novalidate>
    <div class="form-group" *ngIf="manage">
      <label for="pwUser">Pengguna</label>
      <select id="pwUser" name="account" class="form-control" [class.is-invalid]="errors.account" [(ngModel)]="accountId">
        <option [ngValue]="null" disabled>Pilih pengguna…</option>
        <option *ngFor="let a of accounts" [ngValue]="a.id">{{ a.login }} ({{ a.email }})</option>
      </select>
      <div class="invalid-feedback">{{ errors.account }}</div>
    </div>
    <div class="form-group">
      <label for="pwNew">Kata sandi baru</label>
      <input id="pwNew" name="password" type="password" class="form-control" [class.is-invalid]="errors.password" [(ngModel)]="password" autocomplete="new-password">
      <div class="invalid-feedback">{{ errors.password }}</div>
    </div>
    <div class="form-group">
      <label for="pwConfirm">Konfirmasi kata sandi</label>
      <input id="pwConfirm" name="confirm" type="password" class="form-control" [class.is-invalid]="errors.confirm" [(ngModel)]="confirm" autocomplete="new-password">
      <div class="invalid-feedback">{{ errors.confirm }}</div>
    </div>
    <button type="submit" class="btn btn-primary">Simpan</button>
  </form>
</main>
