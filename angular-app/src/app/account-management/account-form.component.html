<header class="am-nav">
  <a routerLink="/" class="brand" aria-label="Beranda DGT">
    <img src="assets/logo-emblem.png" alt="Lambang Kementerian Transmigrasi">
  </a>
  <span class="nav-title">Account Management</span>
  <dgt-theme-toggle class="ml-auto"></dgt-theme-toggle>
</header>

<main class="am-page">
  <dgt-page-head [title]="title">
    <a routerLink="/account-management" class="btn btn-outline-secondary">← Kembali</a>
  </dgt-page-head>

  <form class="am-form" (ngSubmit)="submit()" novalidate>
    <div class="form-group">
      <label for="amLogin">Login</label>
      <input id="amLogin" name="login" class="form-control" [class.is-invalid]="errors.login" [(ngModel)]="form.login" [disabled]="mode === 'view'">
      <div class="invalid-feedback">{{ errors.login }}</div>
    </div>
    <div class="form-group">
      <label for="amEmail">Email</label>
      <input id="amEmail" name="email" type="email" class="form-control" [class.is-invalid]="errors.email" [(ngModel)]="form.email" [disabled]="mode === 'view'">
      <div class="invalid-feedback">{{ errors.email }}</div>
    </div>
    <div class="form-group" *ngIf="mode === 'create'">
      <label for="amPass">Kata sandi</label>
      <input id="amPass" name="password" type="password" class="form-control" [class.is-invalid]="errors.password" [(ngModel)]="password" autocomplete="new-password">
      <div class="invalid-feedback">{{ errors.password }}</div>
    </div>
    <div class="form-group">
      <label for="amLang">Bahasa</label>
      <select id="amLang" name="language" class="form-control" [(ngModel)]="form.language" [disabled]="mode === 'view'">
        <option value="id">Indonesia (id)</option>
        <option value="en">English (en)</option>
      </select>
    </div>
    <div class="custom-control custom-switch mb-3">
      <input type="checkbox" class="custom-control-input" id="amActive" name="activated" [(ngModel)]="form.activated" [disabled]="mode === 'view'">
      <label class="custom-control-label" for="amActive">Akun aktif</label>
    </div>
    <fieldset class="form-group">
      <legend class="col-form-label">Profil (role)</legend>
      <div class="custom-control custom-checkbox" *ngFor="let r of roles">
        <input type="checkbox" class="custom-control-input" [id]="'role-' + r" [checked]="hasRole(r)" [disabled]="mode === 'view'" (change)="toggleRole(r)">
        <label class="custom-control-label" [for]="'role-' + r">{{ r }}</label>
      </div>
    </fieldset>
    <div class="d-flex">
      <a routerLink="/account-management" class="btn btn-outline-secondary mr-2">{{ mode === 'view' ? 'Tutup' : 'Batal' }}</a>
      <button type="submit" class="btn btn-primary" *ngIf="mode !== 'view'">Simpan</button>
      <a [routerLink]="['/account-management', form.id, 'edit']" class="btn btn-primary" *ngIf="mode === 'view'">Ubah</a>
    </div>
  </form>
</main>

<dgt-toast-container></dgt-toast-container>
