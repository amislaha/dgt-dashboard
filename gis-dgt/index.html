<style>

    --bg: #f7f9fa;
    --bg-2: #eff3f5;

  .card {

    width: 100%; max-width: 460px; padding: 2.2rem 2rem 2rem; text-align: center;

  .eyebrow {

    border-radius: 999px; padding: 0.35rem 0.8rem;
    font-size: 0.72rem; font-weight: 600; margin-bottom: 1.6rem;

  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

  .back {
