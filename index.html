  select, .btn {

  .kpi-grid {

  .prov-tile {

  .peta-wrap { position: relative; border-radius: 8px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--border-soft); }
  .peta-svg { display: block; width: 100%; height: auto; cursor: default; }

  /* ---------- EWS ---------- */
  .ews-item {

    .main { padding: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
    * { transition: none !important; }
  }
</style>

  function barChart(data, opts) {

      }, svg);
      var title = el("title", {}, rect);

  function lineChartDual(labels, s1, s2, opts) {
    opts = opts || {};

    var pad = { t: 14, r: 14, b: 26, l: 14 };
    var innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
    var all = s1.concat(s2).filter(function (v) { return v !== null && v !== undefined; });

          '<td>' + k.nama + '<div class="hint" style="color:var(--text-faint);font-size:0.66rem">' + k.tipe + '</div></td>' +
          '<td>' + k.provinsi + '</td>' +
          '<td><span class="badge ' + stageClass[k.tahap] + ' dot">' + k.tahap + '</span></td>' +
          '<td><div class="bar-cell"><span class="mono">' + k.indeks5t + '</span><div class="bar-track"><div class="bar-fill" style="width:' + k.indeks5t + '%"></div></div></div></td>' +
          '</tr>';
      }).join("");
      qsa(wrap, "tbody#profilTbody tr").forEach(function (tr) {
        tr.addEventListener("click", function () { state.selectedKawasan = tr.dataset.id; renderProfilTable(); renderDrawer(); });
      });
    }

    function renderDrawer() {
      var k = kawasan.find(function (x) { return x.id === state.selectedKawasan; });
      var d = qs(wrap, "#profilDrawer");
      if (!k) { d.innerHTML = '<p class="empty">Pilih kawasan pada tabel.</p>'; return; }
      d.innerHTML = photoCard(k) +
        '<h3>' + k.nama + '</h3>' +
        row("Provinsi", k.provinsi) + row("Tipe", k.tipe) +
        row("Tahap", '<span class="badge ' + stageClass[k.tahap] + '">' + k.tahap + '</span>') +
        row("Populasi", k.populasi.toLocaleString("id-ID") + " jiwa") +
        row("Indeks 5T", k.indeks5t + " / 100") +
        row("HPL", k.hplHa.toLocaleString("id-ID") + " Ha") +
        row("SHM Terbit", k.shmHa.toLocaleString("id-ID") + " Ha") +
        row("Realisasi Anggaran", k.anggaranPct + "%") +
        row("Tingkat Risiko", '<span class="sev ' + k.risiko + '">' + ({ high: "Tinggi", med: "Sedang", low: "Rendah" })[k.risiko] + '</span>');
    }
    function row(label, val) { return '<div class="row"><span>' + label + '</span><span>' + val + '</span></div>'; }

    var counts = {};
    STAGES.forEach(function (s) { counts[s] = 0; });
    kawasan.forEach(function (k) { counts[k.tahap]++; });
    var colors = { "Rintisan": "var(--critical)", "Tumbuh": "var(--warn)", "Berkembang": "var(--series-2)", "Mandiri": "var(--good)" };
    var segs = STAGES.map(function (s) { return { label: s, value: counts[s], color: colors[s] }; });
    qs(wrap, "#stageDonut").appendChild(donut(segs, { centerLabel: kawasan.length, centerSub: "kawasan" }));
    qs(wrap, "#stageLegend").innerHTML = STAGES.map(function (s) {
      return '<span class="sw"><span class="chip" style="background:' + colors[s] + '"></span>' + s + ' (' + counts[s] + ')</span>';
    }).join("");

    renderProfilTable();
    renderDrawer();
    return wrap;
  }

  /* ---------- render: 02 Geospasial ---------- */
  function renderGeospasial() {
    var wrap = h(
      pageHead("Geospasial, HPL, SHM & Legalitas Lahan", "Tumpang susun peta digital Hak Pengelolaan Lahan (HPL) dan Sertifikat Hak Milik (SHM) transmigran untuk mendukung Trans Tuntas.",
        '<button class="btn small" id="viewDasar">Peta Dasar</button><button class="btn small" id="viewPeta">Peta Skematik</button><button class="btn small" id="viewGrid">Grid Provinsi</button>') +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-header"><h2 id="sebaranTitle">Peta Kawasan</h2><span class="hint" id="sebaranHint">klik titik untuk detail kawasan</span></div>' +
        '<div id="sebaranBody"></div></div>' +
        '<div class="panel"><div class="panel-header"><h2>Titik Rawan Tumpang Tindih</h2></div><div id="conflictList"></div></div>' +
      '</div>' +
      '<div class="panel"><div class="panel-header"><h2>Rasio Legalitas Lahan per Kawasan (SHM / HPL)</h2><span class="hint">Trans Tuntas — semakin tinggi rasio, semakin tuntas legalitas</span></div>' +
        '<div id="legalBar"></div></div>'
    );

    /* ---- grid-of-provinces view (original) ---- */
    function renderProvGrid() {
      qs(wrap, "#sebaranTitle").textContent = "Sebaran Provinsi";
      qs(wrap, "#sebaranHint").textContent = "klik provinsi untuk highlight kawasan";
      var body = qs(wrap, "#sebaranBody");
      body.innerHTML =
        '<div class="toolbar" style="margin-bottom:0.7rem">' +
          '<button class="btn small" id="toggleHPL" aria-pressed="true">Layer HPL</button>' +
          '<button class="btn small" id="toggleSHM" aria-pressed="true">Layer SHM</button>' +
        '</div>' +
        '<div class="map-legend" style="margin-bottom:0.7rem">' +
          '<span class="sw"><span class="chip" style="background:var(--series-2)"></span>Luas HPL</span>' +
          '<span class="sw"><span class="chip" style="background:var(--gold)"></span>Luas SHM Terbit</span>' +
        '</div>' +
        '<div class="province-grid" id="provGrid"></div>';

      function draw() {
        var grid = qs(wrap, "#provGrid");
        grid.innerHTML = provinces.map(function (p) {
          var hplPct = Math.min(100, (p.hpl / 15000) * 100);
          var shmPct = Math.min(100, (p.shm / 15000) * 100);
          return '<div class="prov-tile' + (state.selectedProv === p.nama ? " selected" : "") + '" data-p="' + p.nama + '">' +
            '<div class="p-name">' + p.nama + '</div><div class="p-count">' + p.count + ' kawasan</div>' +
            (state.showHPL ? '<div class="layer hpl" style="width:' + hplPct + '%"></div>' : "") +
            (state.showSHM ? '<div class="layer shm" style="width:' + shmPct + '%"></div>' : "") +
            '</div>';
        }).join("");
        qsa(grid, ".prov-tile").forEach(function (t) {
          t.addEventListener("click", function () {
            state.selectedProv = state.selectedProv === t.dataset.p ? null : t.dataset.p;
            draw(); renderConflict();
          });
        });
      }
      qs(wrap, "#toggleHPL").addEventListener("click", function (e) {
        state.showHPL = !state.showHPL; e.target.setAttribute("aria-pressed", state.showHPL); draw();
      });
      qs(wrap, "#toggleSHM").addEventListener("click", function (e) {
        state.showSHM = !state.showSHM; e.target.setAttribute("aria-pressed", state.showSHM); draw();
      });
      draw();
    }

    /* ---- schematic map view (new) ---- */
    function renderPeta() {
      qs(wrap, "#sebaranTitle").textContent = "Peta Kawasan";
      qs(wrap, "#sebaranHint").textContent = "klik titik untuk detail kawasan";
      var body = qs(wrap, "#sebaranBody");
      var maxPop = Math.max.apply(null, kawasan.map(function (k) { return k.populasi; }));

      body.innerHTML = '<div class="peta-wrap"><svg class="peta-svg" viewBox="0 0 900 420" role="img" aria-label="Peta sebaran kawasan transmigrasi"></svg></div>' +
        '<div class="peta-legend">' +
          '<span class="grp">' + STAGES.map(function (s) {
            return '<span class="sw"><span class="chip" style="background:' + STAGE_COLOR[s] + '"></span>' + s + '</span>';
          }).join("") + '</span>' +
          '<span class="grp">Populasi:' +
            '<span class="sw"><span class="size-dot" style="width:7px;height:7px"></span>kecil</span>' +
            '<span class="sw"><span class="size-dot" style="width:11px;height:11px"></span>sedang</span>' +
            '<span class="sw"><span class="size-dot" style="width:15px;height:15px"></span>besar</span>' +
          '</span>' +
        '</div>' +
        '<p class="peta-caption">Peta skematik — posisi relatif per provinsi, bukan peta geospasial presisi.</p>' +
        '<div class="drawer" id="petaInfo" style="margin-top:0.7rem"></div>';

      var svg = qs(wrap, ".peta-svg");

      // faint graticule
      for (var gx = 0; gx <= 900; gx += 90) el("line", { x1: gx, y1: 0, x2: gx, y2: 420, stroke: "var(--border-soft)", "stroke-width": 1 }, svg);
      for (var gy = 0; gy <= 420; gy += 70) el("line", { x1: 0, y1: gy, x2: 900, y2: gy, stroke: "var(--border-soft)", "stroke-width": 1 }, svg);

      // islands
      ISLANDS.forEach(function (isl) {
        var path = el("path", {
          d: smoothClosedPath(isl.points),
          fill: "var(--panel-3)", stroke: "var(--border)", "stroke-width": 1,
          opacity: isl.muted ? 0.35 : 0.85
        }, svg);
        if (isl.name) {
          el("text", {
            x: isl.labelX, y: isl.labelY, fill: "var(--text-faint)", "font-size": "10",
            "letter-spacing": "1.5", "font-weight": "600"
          }, svg).textContent = isl.name;
        }
      });

      // pins
      kawasan.forEach(function (k) {
        var r = 4 + (k.populasi / maxPop) * 10;
        var g = el("g", { class: "peta-pin" + (state.selectedKawasan === k.id ? " selected" : ""), "data-id": k.id }, svg);
        el("circle", { class: "core", cx: k.mapX, cy: k.mapY, r: r, fill: STAGE_COLOR[k.tahap], stroke: "var(--bg)", "stroke-width": 1.4, opacity: 0.92 }, g);
        el("title", {}, g).textContent = k.nama + " · " + k.provinsi + " · " + k.populasi.toLocaleString("id-ID") + " jiwa";
      });

      function renderInfo() {
        var k = kawasan.find(function (x) { return x.id === state.selectedKawasan; });
        var infoEl = qs(wrap, "#petaInfo");
        if (!k) { infoEl.innerHTML = '<p class="empty">Klik titik pada peta untuk melihat detail kawasan.</p>'; return; }
        infoEl.innerHTML = photoCard(k) +
          '<h3>' + k.nama + '</h3>' +
          '<div class="row"><span>Provinsi</span><span>' + k.provinsi + '</span></div>' +
          '<div class="row"><span>Tahap</span><span><span class="badge ' + stageClass[k.tahap] + '">' + k.tahap + '</span></span></div>' +
          '<div class="row"><span>Populasi</span><span>' + k.populasi.toLocaleString("id-ID") + ' jiwa</span></div>' +
          '<div class="row"><span>Indeks 5T</span><span>' + k.indeks5t + ' / 100</span></div>' +
          '<div class="row"><span>HPL vs SHM</span><span>' + k.hplHa.toLocaleString("id-ID") + ' Ha / ' + k.shmHa.toLocaleString("id-ID") + ' Ha</span></div>';
      }

      qsa(svg, ".peta-pin").forEach(function (pin) {
        pin.addEventListener("click", function () {
          var id = pin.getAttribute("data-id");
          var k = kawasan.find(function (x) { return x.id === id; });
          state.selectedKawasan = id;
          state.selectedProv = k.provinsi;
          qsa(svg, ".peta-pin").forEach(function (p2) { p2.classList.toggle("selected", p2 === pin); });
          renderInfo();
          renderConflict();
        });
      });

      renderInfo();
    }

    /* ---- real-world basemap view (Leaflet + OpenStreetMap) ---- */
    function renderDasar() {
      qs(wrap, "#sebaranTitle").textContent = "Peta Dasar (OpenStreetMap)";
      qs(wrap, "#sebaranHint").textContent = "geser & perbesar peta, klik penanda untuk detail";
      var body = qs(wrap, "#sebaranBody");

      if (activeLeafletMap) { activeLeafletMap.remove(); activeLeafletMap = null; }

      if (typeof L === "undefined") {
        body.innerHTML = '<div class="basemap-fallback">Peta dasar (OpenStreetMap) tidak dapat dimuat pada pratinjau ini — kemungkinan diblokir oleh kebijakan keamanan konten. Gunakan "Peta Skematik", atau buka versi yang di-deploy di GitHub Pages.</div>';
        return;
      }

      body.innerHTML = '<div class="basemap-wrap"><div class="basemap-el" id="basemapEl"></div></div>' +
        '<p class="peta-caption">Lokasi indikatif berdasarkan provinsi kawasan — bukan koordinat resmi kementerian.</p>' +
        '<div class="drawer" id="dasarInfo" style="margin-top:0.7rem"></div>';

      var map = L.map(qs(wrap, "#basemapEl"), { scrollWheelZoom: false }).setView([-2.2, 118], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
      }).addTo(map);

      var maxPop = Math.max.apply(null, kawasan.map(function (k) { return k.populasi; }));

      function renderDasarInfo() {
        var k = kawasan.find(function (x) { return x.id === state.selectedKawasan; });
        var infoEl = qs(wrap, "#dasarInfo");
        if (!infoEl) return;
        if (!k) { infoEl.innerHTML = '<p class="empty">Klik penanda pada peta untuk melihat detail kawasan.</p>'; return; }
        infoEl.innerHTML = photoCard(k) + '<h3>' + k.nama + '</h3>' +
          '<div class="row"><span>Provinsi</span><span>' + k.provinsi + '</span></div>' +
          '<div class="row"><span>Tahap</span><span><span class="badge ' + stageClass[k.tahap] + '">' + k.tahap + '</span></span></div>' +
          '<div class="row"><span>Populasi</span><span>' + k.populasi.toLocaleString("id-ID") + ' jiwa</span></div>';
      }

      kawasan.forEach(function (k) {
        var radius = 6 + (k.populasi / maxPop) * 10;
        var marker = L.circleMarker([k.lat, k.lon], {
          radius: radius, color: "#0a0f1c", weight: 1.4,
          fillColor: STAGE_COLOR_HEX[k.tahap], fillOpacity: 0.9
        }).addTo(map);
        marker.bindPopup(photoCard(k) + '<b>' + k.nama + '</b><br/>' + k.provinsi + '<br/>Tahap: ' + k.tahap +
          '<br/>Populasi: ' + k.populasi.toLocaleString("id-ID") + ' jiwa');
        marker.on("click", function () {
          state.selectedKawasan = k.id; state.selectedProv = k.provinsi;
          renderDasarInfo(); renderConflict();
        });
      });

      activeLeafletMap = map;
      renderDasarInfo();
      setTimeout(function () { map.invalidateSize(); }, 60);
    }

    function renderConflict() {
      var rows = kawasan.filter(function (k) { return !state.selectedProv || k.provinsi === state.selectedProv; })
        .map(function (k) { return { k: k, gap: k.hplHa - k.shmHa }; })
        .sort(function (a, b) { return b.gap - a.gap; }).slice(0, 5);
      qs(wrap, "#conflictList").innerHTML = rows.map(function (r) {
        var pct = Math.round((r.gap / r.k.hplHa) * 100);
        return '<div class="ews-item"><div class="ews-body">' +
          '<div class="t">' + r.k.nama + ' <span class="hint" style="color:var(--text-faint)">· ' + r.k.provinsi + '</span></div>' +
          '<div class="d">Selisih HPL–SHM ~' + r.gap.toLocaleString("id-ID") + ' Ha (' + pct + '% belum tersertifikasi)</div>' +
          '</div><span class="sev ' + (pct > 50 ? "high" : pct > 30 ? "med" : "low") + '">' + pct + '%</span></div>';
      }).join("") || '<p class="empty" style="color:var(--text-faint)">Tidak ada data untuk filter ini.</p>';
    }

    function renderSebaran() {
      qs(wrap, "#viewDasar").setAttribute("aria-pressed", state.geoView === "dasar");
      qs(wrap, "#viewPeta").setAttribute("aria-pressed", state.geoView === "peta");
      qs(wrap, "#viewGrid").setAttribute("aria-pressed", state.geoView === "grid");
      if (state.geoView !== "dasar" && activeLeafletMap) { activeLeafletMap.remove(); activeLeafletMap = null; }
      if (state.geoView === "dasar") renderDasar();
      else if (state.geoView === "peta") renderPeta();
      else renderProvGrid();
    }

    qs(wrap, "#viewDasar").addEventListener("click", function () { state.geoView = "dasar"; renderSebaran(); });
    qs(wrap, "#viewPeta").addEventListener("click", function () { state.geoView = "peta"; renderSebaran(); });
    qs(wrap, "#viewGrid").addEventListener("click", function () { state.geoView = "grid"; renderSebaran(); });

    var legalData = kawasan.map(function (k) { return { label: k.nama.replace(/^SKP |^KPB /, ""), value: Math.round((k.shmHa / k.hplHa) * 100), color: "var(--gold)" }; });
    qs(wrap, "#legalBar").appendChild(barChart(legalData, { height: 190, suffix: "%", max: 100 }));

    renderSebaran();
    renderConflict();
    return wrap;
  }

        '<tr><td>KPB Bathin III</td><td>Agroindustri Kelapa Sawit</td><td class="mono">Rp 65 M</td><td><span class="badge mandiri">Siap Tawar</span></td></tr>' +
        '<tr><td>KPB Air Terang</td><td>Perikanan Tambak</td><td class="mono">Rp 9 M</td><td><span class="badge tumbuh">Perencanaan</span></td></tr>' +
        '</tbody></table></div></div>'
    );
    function step(n, label) { return '<div class="step"><div class="s-icon">' + n + '</div><div class="s-label">' + label + '</div></div>'; }

    var komData = komoditas.map(function (k) { return { label: k.nama, value: k.nilai, color: "var(--gold)" }; });
    qs(wrap, "#komoditasBar").appendChild(barChart(komData, { height: 200 }));

    return wrap;
  }

  /* ---------- render: 07 Analitik / EWS ---------- */
  function renderAnalitik() {
    var wrap = h(
      pageHead("Analitik Kawasan, Skoring Prioritas 5T & Early Warning", "Pemodelan statistik untuk skoring prioritas intervensi serta notifikasi otomatis Early Warning System (EWS).") +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-header"><h2>Skoring Prioritas Intervensi</h2><span class="hint">semakin rendah indeks 5T, semakin tinggi prioritas</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Kawasan</th><th>Indeks 5T</th><th>Risiko</th><th>Prioritas</th></tr></thead><tbody id="priorityTbody"></tbody></table></div></div>' +
        '<div class="panel"><div class="panel-header"><h2>Early Warning System</h2><span class="hint" id="ewsCount"></span></div><div id="ewsList"></div></div>' +
      '</div>'
    );

    var ranked = kawasan.slice().sort(function (a, b) { return a.indeks5t - b.indeks5t; });
    qs(wrap, "#priorityTbody").innerHTML = ranked.map(function (k, i) {
      var priority = i < 2 ? "high" : i < 5 ? "med" : "low";
      return '<tr><td class="mono">#' + (i + 1) + ' ' + k.nama + '</td><td class="mono">' + k.indeks5t + '</td>' +
        '<td><span class="sev ' + k.risiko + '">' + ({ high: "Tinggi", med: "Sedang", low: "Rendah" })[k.risiko] + '</span></td>' +
        '<td><span class="sev ' + priority + '">' + ({ high: "Segera", med: "Terjadwal", low: "Pantau" })[priority] + '</span></td></tr>';
    }).join("");

    function renderEWS() {
      var active = ewsAlerts.filter(function (a) { return !a.ack; }).length;
      qs(wrap, "#ewsCount").textContent = active + " aktif";
      qs(wrap, "#ewsList").innerHTML = ewsAlerts.map(function (a) {
        return '<div class="ews-item' + (a.ack ? " ack" : "") + '" data-id="' + a.id + '">' +
          '<span class="sev ' + a.sev + '">' + ({ high: "Tinggi", med: "Sedang", low: "Rendah" })[a.sev] + '</span>' +
          '<div class="ews-body"><div class="t">' + a.title + '</div><div class="d">' + a.detail + '</div>' +
          '<div class="ews-meta">' + a.when + '</div></div>' +
          '<button class="btn small" data-ack="' + a.id + '">' + (a.ack ? "Dibuka" : "Tandai") + '</button>' +
          '</div>';
      }).join("");
      qsa(wrap, "[data-ack]").forEach(function (b) {
        b.addEventListener("click", function () {
          var a = ewsAlerts.find(function (x) { return x.id === b.dataset.ack; });
          a.ack = !a.ack; renderEWS();
        });
      });
    }
    renderEWS();

    return wrap;
  }

  /* ---------- render: 08 Executive Intelligence / AI ---------- */
  function renderIntelijen() {
    var wrap = h(
      pageHead("Executive Intelligence, Pelaporan Strategis & AI Assistant", "Konsolidasi statistik sektoral transmigrasi tingkat nasional dan asisten AI untuk pertanyaan cepat pimpinan.") +
      '<div class="kpi-grid">' +
        kpiTile("Kawasan Mandiri", kawasan.filter(function (k) { return k.tahap === "Mandiri"; }).length, "dari " + kawasan.length + " kawasan", "flat") +
        kpiTile("Luas HPL Nasional", (nationalKPI.hplTotal / 1000).toFixed(1) + "rb Ha", "seluruh kawasan terpantau", "flat") +
        kpiTile("Luas SHM Terbit", (nationalKPI.shmTotal / 1000).toFixed(1) + "rb Ha", Math.round(nationalKPI.shmTotal / nationalKPI.hplTotal * 100) + "% dari HPL", "up") +
        kpiTile("Peringatan Aktif", ewsAlerts.filter(function (a) { return !a.ack; }).length, "perlu tindak lanjut", "down") +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-header"><h2>Laporan Strategis</h2></div>' +
        '<p class="desc">Ringkasan otomatis kondisi seluruh kawasan untuk bahan rapat pimpinan, disusun dari data 8 modul di atas.</p>' +
        '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.6rem">' +
          '<button class="btn primary small">Unduh Ringkasan PDF</button>' +
          '<button class="btn small">Jadwalkan Laporan Mingguan</button>' +
        '</div>' +
        '<p class="footnote" style="margin-top:1rem">Tindakan di atas dinonaktifkan pada prototipe ini — memerlukan integrasi backend pelaporan.</p>' +
        '</div>' +
        '<div class="panel"><div class="panel-header"><h2>AI Assistant</h2><span class="hint">tanya cepat seputar data kawasan</span></div>' +
        '<div class="chat-log" id="chatLog"></div>' +
        '<div class="chat-input-row"><input id="chatInput" type="text" placeholder="Contoh: kawasan mana yang paling berisiko?" />' +
        '<button class="btn primary" id="chatSend">Kirim</button></div>' +
        '<div class="chat-suggest">' +
          '<button class="btn small" data-q="kawasan mandiri">kawasan mandiri</button>' +
          '<button class="btn small" data-q="risiko tinggi">risiko tinggi</button>' +
          '<button class="btn small" data-q="realisasi anggaran">realisasi anggaran</button>' +
        '</div></div>' +
      '</div>'
    );

    var log = [{ role: "ai", text: "Selamat datang. Saya dapat merangkum status kawasan, risiko, dan anggaran dari data pada dashboard ini." }];

    function renderLog() {
      qs(wrap, "#chatLog").innerHTML = log.map(function (m) {
        return '<div class="msg ' + m.role + '">' + m.text + '</div>';
      }).join("");
      var elLog = qs(wrap, "#chatLog"); elLog.scrollTop = elLog.scrollHeight;
    }

    function answer(q) {
      var s = q.toLowerCase();
      if (s.indexOf("mandiri") > -1) {
        var m = kawasan.filter(function (k) { return k.tahap === "Mandiri"; });
        return "Ada <b>" + m.length + " kawasan</b> berstatus Mandiri: " + m.map(function (k) { return k.nama; }).join(", ") + ".";
      }
      if (s.indexOf("risiko") > -1 || s.indexOf("bahaya") > -1) {
        var r = kawasan.filter(function (k) { return k.risiko === "high"; });
        return "Kawasan risiko tinggi saat ini: " + r.map(function (k) { return k.nama + " (" + k.provinsi + ")"; }).join(", ") + ". Rekomendasi: prioritaskan intervensi anggaran &amp; pendampingan sosial.";
      }
      if (s.indexOf("anggaran") > -1 || s.indexOf("budget") > -1) {
        var avg = Math.round(kawasan.reduce(function (a, k) { return a + k.anggaranPct; }, 0) / kawasan.length);
        return "Rata-rata realisasi anggaran seluruh kawasan adalah <b>" + avg + "%</b>. Kawasan dengan realisasi terendah: " + kawasan.slice().sort(function (a, b) { return a.anggaranPct - b.anggaranPct; })[0].nama + ".";
      }
      if (s.indexOf("indeks") > -1 || s.indexOf("5t") > -1) {
        return "Rata-rata Indeks 5T nasional adalah <b>" + nationalKPI.avgIndeks + " / 100</b>, dengan kawasan tertinggi " + kawasan.slice().sort(function (a, b) { return b.indeks5t - a.indeks5t; })[0].nama + ".";
      }
      return "Saya belum memiliki jawaban spesifik untuk itu pada data prototipe ini. Coba tanyakan tentang: kawasan mandiri, risiko tinggi, realisasi anggaran, atau indeks 5T.";
    }

    function send(text) {
      if (!text.trim()) return;
      log.push({ role: "user", text: text });
      log.push({ role: "ai", text: answer(text) });
      renderLog();
    }

    qs(wrap, "#chatSend").addEventListener("click", function () {
      var inp = qs(wrap, "#chatInput"); send(inp.value); inp.value = "";
    });
    qs(wrap, "#chatInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { send(this.value); this.value = ""; }
    });
    qsa(wrap, "[data-q]").forEach(function (b) {
      b.addEventListener("click", function () { send(b.dataset.q); });
    });

    renderLog();
    return wrap;
  }

  var RENDERERS = {
    profil: renderProfil, geospasial: renderGeospasial, demografi: renderDemografi,
    infrastruktur: renderInfrastruktur, monitoring: renderMonitoring, ekonomi: renderEkonomi,
    analitik: renderAnalitik, intelijen: renderIntelijen
  };

  function render() {
    mainEl.innerHTML = "";
    mainEl.appendChild(RENDERERS[state.tab]());
    var footnote = document.createElement("div");
    footnote.className = "footnote";
    footnote.textContent = "SVKE — Prototipe visualisasi. Seluruh angka pada dasbor ini bersifat ilustratif untuk keperluan demonstrasi antarmuka, bukan data resmi kementerian.";
    mainEl.appendChild(footnote);
  }

  /* ---------- clock ---------- */
  function tickClock() {
    var d = new Date();
    var pad2 = function (n) { return (n < 10 ? "0" : "") + n; };
    document.getElementById("clock").textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- responsive rail toggle ---------- */
  var railToggle = document.getElementById("railToggle");
  function checkWidth() {
    var narrow = window.innerWidth <= 760;
    railToggle.style.display = narrow ? "inline-flex" : "none";
  }
  window.addEventListener("resize", checkWidth);
  checkWidth();
  railToggle.addEventListener("click", function () {
    document.getElementById("rail").classList.toggle("open");
  });

  render();
})();
</script>
