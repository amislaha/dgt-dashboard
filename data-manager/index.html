<title>DGT Data Manager — Kawasan Transmigrasi</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Standalone CRUD admin tool for the DGT dashboard's master data (sibling folder ../dashboard/ in
     this repo). Not connected to it at runtime — it's a separate, self-contained HTML file (no
     build step, no server) that edits data in this browser's localStorage and lets you copy the
     result out as ready-to-paste JS array literals (or plain JSON). See README.md. -->

  :root {

    --bg-2: #eff3f5;
    --panel: #ffffff;
    --panel-2: #eff3f5;
    --panel-3: #eef2f6;
    --border: #dfe6ea;
    --border-soft: rgba(15, 25, 34, 0.06);
    --text: #0f1922;
    --text-dim: #5b6b76;
    --text-faint: #97a7b2;
    --primary: #163b54;
    --primary-soft: rgba(22, 59, 84, 0.12);
    --primary-line: rgba(22, 59, 84, 0.35);
    --series-2: #33809c;
    --series-2-soft: rgba(51, 128, 156, 0.14);
    --good: #1f5d47;
    --good-soft: rgba(31, 93, 71, 0.14);
    --warn: #c09546;
    --warn-soft: rgba(192, 149, 70, 0.14);

    --radius-sm: 8px;

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  .mono { font-family: "JetBrains Mono", "Cascadia Code", "Consolas", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button, input, select, textarea { font-family: inherit; }
  :focus-visible { outline: 2px dashed var(--primary); outline-offset: 2px; }

  /* ---------- topbar ---------- */
  .topbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 1rem;
    padding: 0.8rem 1.3rem; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: var(--radius-sm); flex: 0 0 auto;
    background: linear-gradient(155deg, var(--primary), #081826);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.6rem; letter-spacing: -0.02em; color: #f4f8fa;
  }
  .brand-text { line-height: 1.2; }
  .brand-text .name { font-weight: 700; font-size: 0.86rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .brand-text .sub { font-size: 0.72rem; color: var(--text-dim); }

  /* ---------- layout ---------- */
  .shell { display: flex; flex: 1 1 auto; min-height: 0; }
  .rail {
    width: 220px; flex: 0 0 auto; border-right: 1px solid var(--border);
    padding: 0.9rem 0.6rem; background: var(--panel); overflow-y: auto;
  }
  .rail-item {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--text-dim); padding: 0.6rem 0.7rem; margin-bottom: 0.2rem; font-size: 0.82rem;

  .rail-item .rc { display: block; font-size: 0.68rem; color: var(--text-faint); margin-top: 0.1rem; }
  .rail-item:hover { background: var(--panel-2); color: var(--text); }
  .rail-item.active { background: var(--primary-soft); border-color: var(--primary-line); color: var(--text); font-weight: 600; }

  .main { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 1.2rem 1.4rem 3rem; }

  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  .page-head .desc { margin: 0.2rem 0 0; color: var(--text-dim); font-size: 0.8rem; max-width: 60ch; }
  .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 0.45rem 0.8rem; font-size: 0.78rem; cursor: pointer;

  .btn:hover { border-color: var(--primary-line); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #f4f8fa; font-weight: 600; }
  .btn.primary:hover { background: #102c40; }
  .btn.danger { color: var(--critical); }
  .btn.danger:hover { border-color: var(--critical); }
  .btn.small { padding: 0.3rem 0.6rem; font-size: 0.7rem; }

  input[type="text"], input[type="number"], select, textarea {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.5rem 0.65rem; font-size: 0.82rem;
  }
  input:invalid { border-color: var(--critical); }
  textarea { min-height: 76px; resize: vertical; font-family: inherit; }

  .search-box { position: relative; }
  .search-box input { width: 220px; padding-left: 2rem; }
  .search-box svg { position: absolute; left: 0.55rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-faint); }

  /* ---------- table ---------- */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th {
    text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-faint); font-weight: 600; padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--border);
    white-space: nowrap; background: var(--panel-2);
  }
  td {
    padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--border-soft); vertical-align: middle;

  tbody tr:hover { background: var(--panel-2); }

    background: var(--panel-3); color: var(--text-dim);
  }

  /* ---------- slide-over form panel ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(15, 25, 34, 0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease; z-index: 30;

  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform 0.18s ease;
    display: flex; flex-direction: column; z-index: 31;

  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .drawer-head h2 { margin: 0; font-size: 1rem; }
  .drawer-close { background: transparent; border: none; cursor: pointer; color: var(--text-faint); font-size: 1.1rem; padding: 0.2rem 0.5rem; }

  .field .hint { font-size: 0.68rem; color: var(--text-faint); margin-top: 0.25rem; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .drawer-foot { padding: 0.9rem 1.2rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: flex-end; }

  /* ---------- export modal ---------- */
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(15, 25, 34, 0.5);
    display: none; align-items: center; justify-content: center; z-index: 40; padding: 2rem;

  .modal {
    background: var(--panel); border-radius: var(--radius); width: 640px; max-width: 100%;
    max-height: 84vh; display: flex; flex-direction: column; border: 1px solid var(--border);
  }
  .modal-head { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-head h2 { margin: 0; font-size: 1rem; }
  .modal-body { padding: 1rem 1.2rem; overflow-y: auto; }
  .modal-body textarea {
    width: 100%; min-height: 320px; resize: vertical; font-size: 0.74rem; line-height: 1.5;
    font-family: "JetBrains Mono", monospace; white-space: pre; background: var(--panel-2);

  .modal-foot { padding: 0.9rem 1.2rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: flex-end; }

    position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%) translateY(10px);

    font-size: 0.78rem; opacity: 0; pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease;

  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    var prefix = ENTITIES[key].idPrefix;
    var max = 0;
    DATA[key].forEach(function (r) {
      var m = /^\D*(\d+)$/.exec(r.id);
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return prefix + (max + 1);
  }

  var toastTimer;
  function showToast(msg) {
    var t = qs("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  /* ============ rail ============ */
  function renderRail() {
    var rail = qs("#rail");
    rail.innerHTML = ENTITY_ORDER.map(function (key) {
      var ent = ENTITIES[key];
      var active = key === state.tab ? " active" : "";
      return (
        '<button class="rail-item' + active + '" data-tab="' + key + '">' +
          esc(ent.label) +
          '<span class="rc">' + DATA[key].length + " data</span>" +
        "</button>"
      );
    }).join("");
    qsa(".rail-item", rail).forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-tab");
        state.query = "";
        render();
      });
    });
  }

  /* ============ main / table ============ */
  function filteredRows(key) {
    var q = state.query.trim().toLowerCase();
    if (!q) return DATA[key];
    return DATA[key].filter(function (r) {
      return Object.keys(r).some(function (k) { return String(r[k]).toLowerCase().indexOf(q) !== -1; });
    });
  }

  function render() {
    renderRail();
    var key = state.tab;
    var ent = ENTITIES[key];
    var rows = filteredRows(key);

    var head =
      '<div class="page-head">' +
        "<div>" +
          "<h1>" + esc(ent.label) + "</h1>" +
          '<p class="desc">' + esc(ent.sub) + "</p>" +
        "</div>" +
        '<div class="toolbar">' +
          '<div class="search-box">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
            '<input type="text" id="searchInput" placeholder="Cari ' + esc(ent.label.toLowerCase()) + '..." value="' + esc(state.query) + '" />' +
          "</div>" +
          '<button class="btn" id="btnExportJson">Ekspor JSON</button>' +
          '<button class="btn" id="btnExportJs">Salin sebagai JS</button>' +
          '<button class="btn" id="btnImportJson">Impor JSON</button>' +
          '<button class="btn primary" id="btnAdd">+ Tambah</button>' +
        "</div>" +
      "</div>";

    var thead = "<tr>" + ent.columns.map(function (c) { return "<th>" + esc(c.label) + "</th>"; }).join("") + "<th></th></tr>";

    var tbody;
    if (rows.length === 0) {
      tbody = '<tr class="empty-row"><td colspan="' + (ent.columns.length + 1) + '">' +
        (state.query ? "Tidak ada data yang cocok." : "Belum ada data. Klik “Tambah” untuk membuat entri pertama.") +
        "</td></tr>";
    } else {
      tbody = rows.map(function (r) {
        var cells = ent.columns.map(function (c) {
          var v = r[c.key];
          var titleAttr = v != null && v !== "" ? ' title="' + esc(String(v)) + '"' : "";
          return "<td" + titleAttr + ">" + (c.render ? c.render(v) : esc(v)) + "</td>";
        }).join("");
        return (
          "<tr>" + cells +
            '<td><div class="row-actions">' +
              '<button class="btn small" data-edit="' + esc(r.id) + '">Ubah</button>' +
              '<button class="btn small danger" data-del="' + esc(r.id) + '">Hapus</button>' +
            "</div></td>" +
          "</tr>"
        );
      }).join("");
    }

    qs("#main").innerHTML =
      head +
      '<div class="panel"><div class="table-wrap"><table><thead>' + thead + "</thead><tbody>" + tbody + "</tbody></table></div></div>";

    qs("#searchInput").addEventListener("input", function (e) { state.query = e.target.value; render(); qs("#searchInput").focus(); qs("#searchInput").setSelectionRange(state.query.length, state.query.length); });
    qs("#btnAdd").addEventListener("click", function () { openForm(key, null); });
    qs("#btnExportJson").addEventListener("click", function () { openExport(key, "json"); });
    qs("#btnExportJs").addEventListener("click", function () { openExport(key, "js"); });
    qs("#btnImportJson").addEventListener("click", function () { importJson(key); });
    qsa("[data-edit]", qs("#main")).forEach(function (btn) {
      btn.addEventListener("click", function () { openForm(key, btn.getAttribute("data-edit")); });
    });
    qsa("[data-del]", qs("#main")).forEach(function (btn) {
      btn.addEventListener("click", function () { deleteRow(key, btn.getAttribute("data-del")); });
    });
  }

  function deleteRow(key, id) {
    var row = DATA[key].find(function (r) { return r.id === id; });
    if (!row) return;
    var label = String(row[ENTITIES[key].titleField] || "(tanpa nama)");
    if (label.length > 70) label = label.slice(0, 70) + "…";
    if (!confirm('Hapus "' + label + '"? Tindakan ini tidak bisa dibatalkan.')) return;
    DATA[key] = DATA[key].filter(function (r) { return r.id !== id; });
    saveEntity(key, DATA[key]);
    showToast("Data dihapus.");
    render();
  }

  /* ============ drawer form ============ */
  function openForm(key, id) {
    state.editing = { key: key, id: id };
    var ent = ENTITIES[key];
    var record = id ? DATA[key].find(function (r) { return r.id === id; }) : {};
    qs("#drawerTitle").textContent = (id ? "Ubah " : "Tambah ") + ent.label.toLowerCase();

    // Foreign-key fields (f.fk = another entity's key) get an autocomplete <datalist> built from
    // that entity's current titleField values — free-text autocomplete, not an enforced FK.
    var datalistsHtml = "";
    ent.fields.forEach(function (f) {
      if (!f.fk) return;
      var srcEnt = ENTITIES[f.fk];
      var vals = Array.from(new Set(DATA[f.fk].map(function (r) { return r[srcEnt.titleField]; }))).filter(Boolean).sort();
      datalistsHtml += '<datalist id="dl_' + f.fk + '_' + f.name + '">' + vals.map(function (v) { return '<option value="' + esc(v) + '">'; }).join("") + "</datalist>";
    });

    var rowsHtml = {};
    ent.fields.forEach(function (f) {
      var val = record[f.name] != null ? record[f.name] : "";
      var html;
      if (f.type === "select") {
        var placeholderOpt = val === "" ? '<option value="" selected disabled>— pilih —</option>' : "";
        html =
          '<div class="field"><label for="f_' + f.name + '">' + esc(f.label) + (f.required ? " *" : "") + "</label>" +
          '<select id="f_' + f.name + '" name="' + f.name + '"' + (f.required ? " required" : "") + ">" +
          placeholderOpt +
          f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (o === val ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") +
          "</select></div>";
      } else if (f.type === "textarea") {
        html =
          '<div class="field"><label for="f_' + f.name + '">' + esc(f.label) + (f.required ? " *" : "") + "</label>" +
          '<textarea id="f_' + f.name + '" name="' + f.name + '"' + (f.required ? " required" : "") + (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : "") + ">" + esc(val) + "</textarea>" +
          (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "") +
          "</div>";
      } else {
        var attrs = "";
        if (f.min !== undefined) attrs += ' min="' + f.min + '"';
        if (f.max !== undefined) attrs += ' max="' + f.max + '"';
        if (f.step) attrs += ' step="' + f.step + '"';
        if (f.placeholder) attrs += ' placeholder="' + esc(f.placeholder) + '"';
        if (f.fk) attrs += ' list="dl_' + f.fk + '_' + f.name + '"';
        html =
          '<div class="field"><label for="f_' + f.name + '">' + esc(f.label) + (f.required ? " *" : "") + "</label>" +
          '<input type="' + f.type + '" id="f_' + f.name + '" name="' + f.name + '" value="' + esc(val) + '"' + (f.required ? " required" : "") + attrs + " />" +
          (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "") +
          "</div>";
      }
      var bucket = f.row || "_" + f.name;
      (rowsHtml[bucket] = rowsHtml[bucket] || []).push(html);
    });

    var body = datalistsHtml;
    Object.keys(rowsHtml).forEach(function (bucket) {
      var group = rowsHtml[bucket];
      body += group.length > 1 ? '<div class="field-row">' + group.join("") + "</div>" : group[0];
    });
    qs("#drawerBody").innerHTML = body;

    qs("#scrim").classList.add("open");
    qs("#drawer").classList.add("open");
    var firstInput = qs("#drawerBody input, #drawerBody select");
    if (firstInput) firstInput.focus();
  }

  function closeForm() {
    qs("#scrim").classList.remove("open");
    qs("#drawer").classList.remove("open");
    state.editing = null;
  }

  function saveForm() {
    var editing = state.editing;
    if (!editing) return;
    var key = editing.key;
    var ent = ENTITIES[key];
    var record = editing.id ? Object.assign({}, DATA[key].find(function (r) { return r.id === editing.id; })) : { id: nextId(key) };

    for (var i = 0; i < ent.fields.length; i++) {
      var f = ent.fields[i];
      var input = qs("#f_" + f.name);
      if (f.required && !input.value.trim() && input.value !== "0") {
        input.focus();
        showToast('Kolom "' + f.label + '" wajib diisi.');
        return;
      }
      if (f.type === "number") {
        var num = input.value === "" ? null : parseFloat(input.value);
        if (num !== null && (f.min !== undefined && num < f.min || f.max !== undefined && num > f.max)) {
          input.focus();
          showToast('"' + f.label + '" harus antara ' + f.min + " dan " + f.max + ".");
          return;
        }
        record[f.name] = num;
      } else {
        record[f.name] = input.value.trim();
      }
    }

    if (editing.id) {
      var idx = DATA[key].findIndex(function (r) { return r.id === editing.id; });
      DATA[key][idx] = record;
    } else {
      DATA[key].push(record);
    }
    saveEntity(key, DATA[key]);
    closeForm();
    showToast("Data disimpan.");
    render();
  }

  qs("#scrim").addEventListener("click", closeForm);
  qs("#drawerClose").addEventListener("click", closeForm);
  qs("#drawerCancel").addEventListener("click", closeForm);
  qs("#drawerSave").addEventListener("click", saveForm);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeForm(); closeExport(); }
  });

  /* ============ export / import ============ */
  function toJsLiteral(key) {
    var ent = ENTITIES[key];
    var fieldOrder = ["id"].concat(ent.fields.map(function (f) { return f.name; }));
    var lines = DATA[key].map(function (r) {
      var parts = fieldOrder.map(function (k) {
        var v = r[k];
        if (v === "" || v == null) return null;
        return k + ": " + (typeof v === "number" ? v : JSON.stringify(v));
      }).filter(Boolean);
      return "  { " + parts.join(", ") + " }";
    });
    return "var " + key + " = [\n" + lines.join(",\n") + "\n];";
  }

  function openExport(key, format) {
    var ent = ENTITIES[key];
    qs("#exportTitle").textContent = (format === "js" ? "Salin sebagai JS — " : "Ekspor JSON — ") + ent.label;
    qs("#exportText").value = format === "js" ? toJsLiteral(key) : JSON.stringify(DATA[key], null, 2);
    qs("#exportScrim").dataset.key = key;
    qs("#exportScrim").dataset.format = format;
    qs("#exportScrim").classList.add("open");
    qs("#exportText").focus();
    qs("#exportText").select();
  }
  function closeExport() { qs("#exportScrim").classList.remove("open"); }

  qs("#exportClose").addEventListener("click", closeExport);
  qs("#exportScrim").addEventListener("click", function (e) { if (e.target.id === "exportScrim") closeExport(); });
  qs("#exportCopy").addEventListener("click", function () {
    var text = qs("#exportText");
    text.select();
    var copied = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text.value).then(function () { showToast("Disalin ke clipboard."); }).catch(function () {
        try { copied = document.execCommand("copy"); } catch (e) {}
        showToast(copied ? "Disalin ke clipboard." : "Gagal menyalin — salin manual dari kotak teks.");
      });
    } else {
      try { copied = document.execCommand("copy"); } catch (e) {}
      showToast(copied ? "Disalin ke clipboard." : "Gagal menyalin — salin manual dari kotak teks.");
    }
  });
  qs("#exportDownload").addEventListener("click", function () {
    var key = qs("#exportScrim").dataset.key;
    var format = qs("#exportScrim").dataset.format;
    var text = qs("#exportText").value;
    var ext = format === "js" ? "js" : "json";
    var blob = new Blob([text], { type: format === "js" ? "text/javascript" : "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "svke-" + key + "." + ext;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  function importJson(key) {
    var input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.addEventListener("change", function () {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed)) throw new Error("File harus berisi array JSON.");
          if (!confirm("Impor akan MENGGANTI seluruh data " + ENTITIES[key].label + " saat ini (" + DATA[key].length + " entri) dengan " + parsed.length + " entri dari file. Lanjutkan?")) return;
          DATA[key] = parsed;
          saveEntity(key, DATA[key]);
          showToast("Impor berhasil: " + parsed.length + " entri.");
          render();
        } catch (e) {
          alert("Gagal mengimpor: " + e.message);
        }
      };
      reader.readAsText(file);
    });
    input.click();
  }

  render();
})();
</script>
